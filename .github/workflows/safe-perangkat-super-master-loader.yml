name: Safe Perangkat SUPER Master Loader
on:
  push:
    branches: [feat-perangkat-pembelajaran-super-2026-09-10]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Safely append master loaders before final body
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          loaders=[
            'assets/perangkat-pembelajaran-super.js',
            'assets/perangkat-katalog-super-v2.js',
            'assets/perangkat-cp-atp-tp-super-v2.js',
            'assets/perangkat-binding-super-v1.js',
            'assets/perangkat-jp-super-v1.js',
            'assets/perangkat-pertemuan-super-v1.js',
            'assets/perangkat-prota-promes-super-v2.js',
            'assets/perangkat-rpm-super-v2.js',
            'assets/perangkat-lkpd-asesmen-super-v1.js',
            'assets/perangkat-lkpd-asesmen-super-v2.js',
            'assets/perangkat-audit-super-v1.js',
            'assets/perangkat-kalender-adaptif-v1.js',
          ]
          pos=s.rfind('</body>')
          if pos < 0: raise SystemExit('final </body> not found')
          tail=s[:pos]
          # Tags inside exportHtml() strings are not document loaders.
          final_script=s.rfind('</script>',0,pos)
          final_area=s[final_script+9:pos] if final_script>=0 else s[:pos]
          missing=[x for x in loaders if f'<script src="{x}"></script>' not in final_area]
          if not missing:
              print('All master loaders already present in final document')
              raise SystemExit(0)
          block='\n'.join(f'<script src="{x}"></script>' for x in missing)+'\n'
          s=s[:pos]+block+s[pos:]
          p.write_text(s,encoding='utf-8')
          print('Inserted',len(missing),'master loaders')
          PY
      - name: Validate master stack
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          loaders=[
            'assets/perangkat-pembelajaran-super.js',
            'assets/perangkat-katalog-super-v2.js',
            'assets/perangkat-cp-atp-tp-super-v2.js',
            'assets/perangkat-binding-super-v1.js',
            'assets/perangkat-jp-super-v1.js',
            'assets/perangkat-pertemuan-super-v1.js',
            'assets/perangkat-prota-promes-super-v2.js',
            'assets/perangkat-rpm-super-v2.js',
            'assets/perangkat-lkpd-asesmen-super-v1.js',
            'assets/perangkat-lkpd-asesmen-super-v2.js',
            'assets/perangkat-audit-super-v1.js',
            'assets/perangkat-kalender-adaptif-v1.js',
          ]
          pos=s.rfind('</body>'); final_script=s.rfind('</script>',0,pos)
          area=s[final_script+9:pos]
          for x in loaders:
              tag=f'<script src="{x}"></script>'
              if area.count(tag)!=1: raise SystemExit(f'final loader invalid: {x}: {area.count(tag)}')
          print('Validated',len(loaders),'Perangkat SUPER loaders in the real document body')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "ci: load Perangkat Pembelajaran SUPER master stack"
          git push