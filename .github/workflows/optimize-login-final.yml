name: One-time final login optimization
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch login safely
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;visibility:hidden;', 'backdrop-filter:none;-webkit-backdrop-filter:none;opacity:0;visibility:hidden;')
          old="""  applyClassLock();syncRoleMenu();initAIGenerator();renderBookBasisStatus();renderStats();renderStudents();renderScores();renderReport();showPage((t.role==='guru'||t.role==='guru_mapel')?'students':'dashboard');\n  // Sinkronisasi D1 berjalan di belakang layar agar login tidak tertahan.\n  syncRemoteData(t).catch(err=>console.warn('Sinkronisasi D1 gagal:',err));"""
          new="""  applyClassLock();syncRoleMenu();\n  const firstPage=(t.role==='guru'||t.role==='guru_mapel')?'students':'dashboard';\n  showPage(firstPage);\n  const defer=window.requestAnimationFrame||((fn)=>setTimeout(fn,0));\n  defer(()=>setTimeout(()=>{\n    try{initAIGenerator();renderBookBasisStatus();renderStats();renderStudents();renderScores();renderReport();}catch(err){console.warn('Init dashboard tertunda:',err)}\n    syncRemoteData(t).catch(err=>console.warn('Sinkronisasi D1 gagal:',err));\n  },0));"""
          if old in s:
              s=s.replace(old,new,1)
          elif "const firstPage=(t.role==='guru'||t.role==='guru_mapel')?'students':'dashboard';" not in s:
              raise SystemExit('login anchor not found; no index change')
          p.write_text(s,encoding='utf-8')
      - name: Validate inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          if not scripts: raise SystemExit('no inline scripts found')
          Path('/tmp/index-inline.js').write_text('\\n'.join(scripts),encoding='utf-8')
          print('inline scripts:',len(scripts))
          PY
          node --check /tmp/index-inline.js
      - name: Commit optimized index and remove workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if ! git diff --cached --quiet; then git commit -m 'Optimize login transition safely'; git push; fi
          rm -f .github/workflows/optimize-login-final.yml
          git add .github/workflows/optimize-login-final.yml
          if ! git diff --cached --quiet; then git commit -m 'Remove one-time login optimizer'; git push; fi
