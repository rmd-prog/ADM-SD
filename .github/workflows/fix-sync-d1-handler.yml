name: Fix Sinkron D1 handler

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-sync-d1-handler.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch exact Sinkron D1 handler
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""async function refreshStudentsFromD1(){const t=currentTeacher||JSON.parse(localStorage.getItem('siLogin')||'null');if(!t)return;const rombel=t.role==='guru'?normalizeRombel(t.rombel||t.kelas):'';const sp=await apiGet('/siswa',rombel?{rombel}:{});if(Array.isArray(sp.data))db.students=sp.data.map(normalizeStudentRow).filter(s=>s.name);save();renderStats();renderStudents();renderReport();renderScores()}"""
          new="""async function refreshStudentsFromD1(){let t=currentTeacher;if(!t||!String(t.token||'').trim()){try{const saved=JSON.parse(localStorage.getItem('siLogin')||'null');const tok=String(saved?.token||saved?.access_token||'').trim();if(saved&&tok){t={...saved,token:tok};currentTeacher=t;localStorage.setItem('siAuthToken',tok)}}catch(e){}}if(!t)throw new Error('Belum login. Silakan login ulang.');const token=String(t.token||localStorage.getItem('siAuthToken')||'').trim();if(!token)throw new Error('Belum login. Silakan login ulang.');const rombel=t.role==='guru'?normalizeRombel(t.rombel||t.kelas):'';const sp=await apiGet('/siswa',rombel?{rombel}:{});if(Array.isArray(sp.data))db.students=sp.data.map(normalizeStudentRow).filter(s=>s.name);save();renderStats();renderStudents();renderReport();renderScores()}"""
          if s.count(old)!=1:
              raise SystemExit(f'exact refreshStudentsFromD1 target count={s.count(old)}')
          s=s.replace(old,new,1)
          marker='/* ADM-SD D1 SYNC HANDLER V1 */'
          if marker not in s:
              s=s.replace('</body>',marker+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate frontend
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.count('async function refreshStudentsFromD1(){')==1
          assert 'ADM-SD D1 SYNC HANDLER V1' in s
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/index-inline.js

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'fix: make Sinkron D1 reuse active JWT [skip ci]'
          git push origin main
