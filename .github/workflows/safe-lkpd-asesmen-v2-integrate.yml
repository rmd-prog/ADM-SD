name: Safe LKPD Asesmen SUPER v2 Integrate
on:
  push:
    branches: [feat-perangkat-pembelajaran-super-2026-09-10]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Safely insert loader
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          tag='<script src="assets/perangkat-lkpd-asesmen-super-v2.js"></script>'
          if tag not in s:
              anchors=[
                '<script src="assets/perangkat-lkpd-asesmen-super-v1.js"></script>',
                '<script src="assets/perangkat-pembelajaran-super.js"></script>'
              ]
              anchor=next((a for a in anchors if a in s),None)
              if not anchor: raise SystemExit('safe anchor not found; refusing unsafe edit')
              s=s.replace(anchor,anchor+'\n'+tag,1)
              p.write_text(s,encoding='utf-8')
          if s.count(tag)!=1: raise SystemExit('loader validation failed')
          PY
      - name: Validate
        run: grep -F '<script src="assets/perangkat-lkpd-asesmen-super-v2.js"></script>' index.html
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "ci: load LKPD asesmen SUPER v2"
          git push