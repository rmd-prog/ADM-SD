name: Apply final GURU+ SD login design
on:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/final-login-design.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='GURU+ SD V9 • FINAL LOGIN DESIGN'
          if marker in s:
              print('already patched')
              raise SystemExit(0)
          css=r'''
          /* ===== GURU+ SD V9 • FINAL LOGIN DESIGN ===== */
          .login{position:relative;isolation:isolate;overflow:hidden;min-height:100vh;padding:12px!important;background:#17395f!important}
          .login:before{content:"";position:absolute;inset:0;z-index:-2;background-image:linear-gradient(180deg,rgba(8,32,58,.10),rgba(8,25,44,.52)),url("https://commons.wikimedia.org/wiki/Special:FilePath/Kota%20Bogor%20%26%20Gunung%20Salak%20%28cropped%29.jpg");background-position:center;background-size:cover;background-repeat:no-repeat;filter:saturate(1.06)}
          .login:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(7,29,52,.10),rgba(7,29,52,.02) 45%,rgba(7,29,52,.16)),linear-gradient(180deg,rgba(255,255,255,.04),rgba(4,18,32,.30));pointer-events:none}
          .login-card{position:relative;z-index:2;width:min(350px,calc(100vw - 28px))!important;padding:18px 19px 16px!important;border-radius:20px!important;background:rgba(255,255,255,.93)!important;border:1px solid rgba(255,255,255,.92)!important;box-shadow:0 18px 50px rgba(5,20,40,.24)!important;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
          .login .logo{width:62px!important;height:62px!important;border-radius:16px!important;margin:auto;box-shadow:0 8px 22px rgba(5,20,40,.10)!important}
          .login-card h1{font-size:21px!important;margin-bottom:3px!important}
          .login-card .center{margin-top:7px!important}
          .login-card .badge{font-size:9px!important;padding:3px 7px!important;margin-bottom:2px!important}
          .login-card label{font-size:11px!important;margin:9px 0 4px!important}
          .login-card input{height:39px!important;padding:8px 11px!important;font-size:12px!important;border-radius:10px!important}
          .login-card .password input{padding-right:58px!important}
          .login-card .toggle{top:4px!important;font-size:11px!important;padding:6px 8px!important}
          .login-card .wide{height:39px!important;margin-top:12px!important;font-size:11px!important;border-radius:10px!important}
          .login-card .demo{margin-top:9px!important;padding:7px 9px!important;font-size:10px!important}
          .bogor-corner{position:absolute;top:12px;right:16px;z-index:4;display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:12px;background:rgba(255,255,255,.88);box-shadow:0 7px 20px rgba(5,20,40,.13);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
          .bogor-corner img{width:31px;height:39px;object-fit:contain}.bogor-corner span{font-size:9px;font-weight:900;color:#17395f;letter-spacing:.4px}
          .login-location{position:absolute;left:16px;top:15px;z-index:4;color:#fff;font-weight:900;font-size:10px;letter-spacing:1px;text-shadow:0 2px 8px rgba(0,0,0,.45)}
          .login-kujang{position:absolute;z-index:1;right:7%;bottom:0;height:min(70vh,560px);width:auto;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 12px 12px rgba(0,0,0,.22));opacity:.94;pointer-events:none}
          .login-school{position:absolute;z-index:1;left:0;bottom:0;width:min(32vw,430px);max-height:46vh;object-fit:cover;object-position:center top;border-radius:0 22px 0 0;opacity:.92;box-shadow:0 -10px 35px rgba(0,0,0,.12);pointer-events:none}
          @media(max-width:760px) and (orientation:portrait){
            .login{padding:8px!important}
            .login-card{width:min(310px,calc(100vw - 24px))!important;padding:15px 15px 13px!important}
            .login .logo{width:52px!important;height:52px!important}
            .login-card h1{font-size:18px!important}.login-card label{margin:7px 0 3px!important}.login-card input{height:35px!important;font-size:11px!important}.login-card .wide{height:35px!important;margin-top:9px!important}.login-card .demo{display:none}
            .login-kujang{height:42vh;right:-2%;opacity:.80}.login-school{width:46vw;max-height:28vh;opacity:.80}
            .login-location{left:10px;top:11px;font-size:8px}.bogor-corner{top:8px;right:9px}.bogor-corner img{width:25px;height:31px}.bogor-corner span{display:none}
          }
          @media(max-width:760px) and (orientation:landscape){
            .login{padding:5px!important}
            .login-card{width:min(315px,58vw)!important;padding:9px 13px 8px!important;border-radius:16px!important}
            .login .logo{width:38px!important;height:38px!important;border-radius:11px!important}
            .login-card h1{font-size:15px!important;margin-bottom:1px!important}.login-card .center{margin-top:3px!important}.login-card .badge{font-size:7px!important;padding:2px 5px!important}
            .login-card label{font-size:9px!important;margin:4px 0 2px!important}.login-card input{height:28px!important;padding:5px 8px!important;font-size:10px!important}.login-card .toggle{top:2px!important;font-size:9px!important;padding:4px 6px!important}.login-card .wide{height:29px!important;margin-top:6px!important;font-size:9px!important}.login-card .demo{display:none}
            .login-kujang{height:76vh;right:4%;opacity:.86}.login-school{width:29vw;max-height:58vh;opacity:.82}
            .login-location{left:8px;top:7px;font-size:7px}.bogor-corner{top:6px;right:7px;padding:3px 5px}.bogor-corner img{width:20px;height:25px}.bogor-corner span{display:none}
          }
          @media(min-width:761px){.login-kujang{height:min(72vh,620px)}.login-school{width:min(30vw,440px)}}
          '''
          css='\n'.join(x.strip() for x in css.splitlines() if x.strip())
          s=s.replace('</style>',css+'\n</style>',1)
          html='''\n<!-- GURU+ SD V9 • FINAL LOGIN DESIGN -->\n<img class="login-school" src="https://cdn-sekolah.annibuku.com/20201762/1.jpg" alt="Sekolah Bogor" aria-hidden="true">\n<img class="login-kujang" src="https://e7.pngegg.com/pngimages/91/5/png-clipart-gray-and-purple-tower-kujang-monument-bca-tugu-kujang-kujang-bogor-angle-fictional-character.png" alt="Tugu Kujang Bogor" aria-hidden="true">\n'''
          # Put decorative objects inside the login screen, once.
          if 'class="login-school"' not in s:
              pos=s.find('<div id="loginScreen"')
              if pos>=0:
                  end=s.find('>',pos)+1
                  s=s[:end]+html+s[end:]
              else:
                  s=s.replace('<body>', '<body>'+html, 1)
          p.write_text(s,encoding='utf-8')
          print('final login design patched')
          PY
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "feat: compact login and correct Tugu Kujang visual [skip ci]"; git push; fi
