name: Fix BAB Dropdown V8
on:
  push:
    branches:
      - main
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch BAB source and refresh cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="function updateBab(){\nlet k=normalizeRombel(id('scoreKelas').value),m=id('scoreMapel').value;\nconst scoreUnits=babList(m,k);\nid('scoreBab').innerHTML=scoreUnits.length?scoreUnits.map((x,i)=>'<option value=\"'+i+'\">'+esc('BAB '+(i+1)+' — '+x)+'</option>').join(''):'<option value=\"\">Struktur BAB/Unit belum terverifikasi</option>';\nlet rk=normalizeRombel(id('rpmKelas').value),rm=id('rpmMapel').value;\nconst rpmUnits=babList(rm,rk);\nid('rpmBab').innerHTML=rpmUnits.length?rpmUnits.map((x,i)=>'<option value=\"'+i+'\">'+esc('BAB '+(i+1)+' — '+x)+'</option>').join(''):'<option value=\"\">Struktur BAB/Unit belum terverifikasi</option>';\n}"
          new="function updateBab(){\n  const getUnits=(m,k)=>{const g=gradeOf(k);const b=BOOK_CATALOG[m]?.[g];if(b&&Array.isArray(b.chapters)&&b.chapters.length)return b.chapters.slice();return Array.isArray(BAB[m]?.[g])?BAB[m][g].slice():[]};\n  const k=normalizeRombel(id('scoreKelas').value),m=id('scoreMapel').value;\n  const scoreUnits=getUnits(m,k);\n  id('scoreBab').innerHTML=scoreUnits.length?scoreUnits.map((x,i)=>'<option value=\"'+i+'\">'+esc('BAB '+(i+1)+' — '+x)+'</option>').join(''):'<option value=\"\">Struktur BAB/Unit belum terverifikasi</option>';\n  const rk=normalizeRombel(id('rpmKelas').value),rm=id('rpmMapel').value;\n  const rpmUnits=getUnits(rm,rk);\n  const prev=Number(id('rpmBab').value||0);\n  id('rpmBab').innerHTML=rpmUnits.length?rpmUnits.map((x,i)=>'<option value=\"'+i+'\">'+esc('BAB '+(i+1)+' — '+x)+'</option>').join(''):'<option value=\"\">Struktur BAB/Unit belum terverifikasi</option>';\n  if(rpmUnits.length)id('rpmBab').value=String(Math.min(prev,rpmUnits.length-1));\n}"
          if old not in s: raise SystemExit('UPDATEBAB TARGET NOT FOUND')
          s=s.replace(old,new,1)
          marker='</body>'
          patch="""<script>\n/* V8 BAB DROPDOWN HOTFIX: selalu ambil BAB dari BOOK_CATALOG/BAB sesuai kelas+mapel. */\n(function(){\n  const original=window.updateBab;\n  window.__babDropdownFixVersion='2026-09-08';\n  window.updateBab=function(){\n    const getUnits=(m,k)=>{const g=gradeOf(k);const b=BOOK_CATALOG[m]?.[g];if(b&&Array.isArray(b.chapters)&&b.chapters.length)return b.chapters.slice();return Array.isArray(BAB[m]?.[g])?BAB[m][g].slice():[]};\n    const render=(el,units,keep)=>{if(!el)return;const old=Number(el.value||0);el.innerHTML=units.length?units.map((x,i)=>'<option value=\\\"'+i+'\\\">'+esc('BAB '+(i+1)+' — '+x)+'</option>').join(''):'<option value=\\\"\\\">Struktur BAB/Unit belum terverifikasi</option>';if(units.length)el.value=String(Math.min(Number.isFinite(keep)?keep:old,units.length-1));};\n    const sk=normalizeRombel(id('scoreKelas').value),sm=id('scoreMapel').value;\n    render(id('scoreBab'),getUnits(sm,sk),Number(id('scoreBab').value||0));\n    const rk=normalizeRombel(id('rpmKelas').value),rm=id('rpmMapel').value;\n    render(id('rpmBab'),getUnits(rm,rk),Number(id('rpmBab').value||0));\n  };\n})();\n</script>\n"""
          s=s.replace(marker,patch+marker,1)
          s=s.replace('</head>','<meta name="app-version" content="V8-BAB-FIX-2026-09-08">\n</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          js='\n'.join(re.findall(r'<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>',s,re.I))
          Path('/tmp/index.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/index.js
      - name: Commit patch and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "fix: force correct BAB dropdown by class and subject"
          git push
          git rm .github/workflows/fix-bab-dropdown.yml
          git commit -m "chore: remove one-time BAB dropdown patch workflow"
          git push
