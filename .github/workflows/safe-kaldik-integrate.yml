name: Safe Kaldik Integrate
on:
  push:
    branches: [feat/kaldik-master-2026-09-10]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Insert Kaldik loader safely
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          tag='<script src="assets/perangkat-kaldik-super-v1.js"></script>'
          if tag in s:
              print('Kaldik loader already present.')
              raise SystemExit(0)
          marker='<script src="assets/absensi.js"'
          i=s.find(marker)
          if i<0:
              raise SystemExit('Safe boundary marker not found; aborting.')
          s=s[:i]+tag+'\n'+s[i:]
          p.write_text(s,encoding='utf-8')
      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          tag='<script src="assets/perangkat-kaldik-super-v1.js"></script>'
          if s.count(tag)!=1: raise SystemExit('Kaldik loader count must be exactly 1.')
          print('PASS: Kaldik loader boundary is safe.')
      - name: Commit loader
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: load Kaldik master module"
          git push