name: repair html script parser

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair parser and Guru Mapel access
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old='<script src="guru-mapel-ui.js"></script>'; new='<script src="guru-mapel-ui.js"><\\/script>'
          if old in s:s=s.replace(old,new)
          bad='<script src="guru-mapel-ui.js"><\\/script>\n</body></html>'; good='<script src="guru-mapel-ui.js"><\\/script>\\n</body></html>'
          if bad in s:s=s.replace(bad,good)
          p.write_text(s,encoding='utf-8')
          w=Path('src/index.js'); x=w.read_text(encoding='utf-8')
          old='''        if (requested) {\n          const rw = rombelWhere(field, requested);\n          result = await env.DB.prepare(`SELECT * FROM siswa WHERE ${rw.sql} ORDER BY nama`).bind(...rw.binds).all();\n        } else if (user.role === "admin") {'''
          new='''        if (requested) {\n          if (isGuruMapelAll(user) && requested === "ALL") {\n            result = await env.DB.prepare(`SELECT * FROM siswa ORDER BY nama`).all();\n          } else {\n            const rw = rombelWhere(field, requested);\n            result = await env.DB.prepare(`SELECT * FROM siswa WHERE ${rw.sql} ORDER BY nama`).bind(...rw.binds).all();\n          }\n        } else if (user.role === "admin") {'''
          if old in x:x=x.replace(old,new,1)
          w.write_text(x,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
          node --check src/index.js
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html src/index.js
          if git diff --cached --quiet; then echo 'No repair needed'; exit 0; fi
          git commit -m 'fix: repair parser and Guru Mapel ALL access [skip ci]'
          git push
