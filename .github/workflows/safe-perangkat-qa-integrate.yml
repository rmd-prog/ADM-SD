name: Safe Perangkat QA Integrate
on:
  push:
    branches:
      - feat/perangkat-format-prota-promes-rpm-2026-09-10
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add QA loader at document boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          tag='<script src="assets/perangkat-qa-super-v1.js"></script>'
          pos=s.rfind('</body>')
          if pos<0: raise SystemExit('No closing body tag')
          doc=s[:pos]
          if tag not in doc:
              s=s[:pos]+tag+'\n'+s[pos:]
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validate boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.count('assets/perangkat-qa-super-v1.js')==1
          assert s.rfind('</body>')>s.rfind('assets/perangkat-qa-super-v1.js')
          print('Safe QA loader boundary OK')
          PY
      - name: Commit if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'chore: load perangkat QA safely'
          git push