name: Safe Katalog SUPER Integrate
on:
  push:
    branches: [feat-perangkat-pembelajaran-super-2026-09-10]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add catalog loader safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          tag='<script src="assets/perangkat-katalog-super-v2.js"></script>'
          if tag not in s:
              marker='<script src="assets/perangkat-pembelajaran-super.js"></script>'
              if marker not in s: raise SystemExit('base perangkat loader not found')
              s=s.replace(marker, marker+'\n'+tag, 1)
              p.write_text(s,encoding='utf-8')
          if s.count(tag)!=1: raise SystemExit('catalog loader count invalid')
          PY
      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'ci: load expanded perangkat catalog'
          git push