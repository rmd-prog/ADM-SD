name: Fix AI lock final
on:
  push:
    branches:
      - main
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore project and patch
        run: |
          git checkout 3fb6fd0a434ce6a761dd40a0e37de410216ebb0f -- index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pat=r"function aiBookLock\(m,k,bab\)\{.*?\}\nfunction aiBookInstruction"
          repl="""function normalizeBabName(v){const s=String(v??'').trim();return s.replace(/^BAB\\s*\\d+\\s*[—-]\\s*/i,'').trim();}
function aiBookLock(m,k,bab){const b=bookInfo(m,k);if(!b)return{title:'Belum terdaftar',source:'SIBI',chapters:[]};const chapters=Array.isArray(b.chapters)?b.chapters.slice():[];const raw=normalizeBabName(bab);const wanted=/^\\d+$/.test(raw)&&chapters[Number(raw)]?chapters[Number(raw)]:raw;return{title:b.title,source:b.source,year:b.year||'',chapters,bab:wanted&&chapters.includes(wanted)?wanted:''};}
function aiBookInstruction"""
          s,n=re.subn(pat,repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('aiBookLock replacement failed')
          pat=r"context:\[ctx,aiBookInstruction\(m,k,type==='rpm'\?id\('rpmBab'\)\.value:''\)\]\.filter\(Boolean\)\.join\('\\\\n\\\\n'\),existing:tx\.value,bookReference:aiBookLock\(m,k,type==='rpm'\?id\('rpmBab'\)\.value:''\),bookLock:true"
          repl="context:[ctx,aiBookInstruction(m,k,type==='rpm'?(babList(m,k)[Number(id('rpmBab').value||0)]||''):'')].filter(Boolean).join('\\n\\n'),existing:tx.value,bookReference:aiBookLock(m,k,type==='rpm'?(babList(m,k)[Number(id('rpmBab').value||0)]||''):''),bookLock:true"
          s,n=re.subn(pat,repl,s,count=1)
          if n!=1: raise SystemExit('generateDoc replacement failed')
          old="if(t==='rpm')extra.bab=bab.options[bab.selectedIndex]?.textContent||'';"
          new="if(t==='rpm')extra.bab=normalizeBabName(bab.options[bab.selectedIndex]?.textContent||'');"
          if old not in s: raise SystemExit('AI SUPER replacement failed')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>',s,re.I)
          if not blocks: raise SystemExit('No JS')
          Path('/tmp/index.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/index.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "fix: lock selected book chapter across AI generators"
          git push
