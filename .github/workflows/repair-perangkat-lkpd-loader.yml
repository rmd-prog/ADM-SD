name: Repair Perangkat LKPD Loader

on:
  workflow_run:
    workflows: [Safe Perangkat SUPER Master Loader]
    types: [completed]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'feat-perangkat-pembelajaran-super-2026-09-10' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-perangkat-pembelajaran-super-2026-09-10
      - name: Ensure canonical LKPD loader exists exactly once
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          src='assets/perangkat-lkpd-asesmen-super-v2.js'
          s=re.sub(r'\s*<script\s+src=["\']'+re.escape(src)+r'["\']\s*>\s*</script>\s*','\n',s,flags=re.I)
          pos=s.rfind('</body>')
          if pos<0: raise SystemExit('final </body> not found')
          s=s[:pos]+'\n<script src="'+src+'"></script>\n'+s[pos:]
          if len(re.findall(r'<script\s+src=["\']'+re.escape(src)+r'["\']\s*>\s*</script>',s,re.I))!=1:
            raise SystemExit('LKPD loader count is not exactly 1')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "ci: restore canonical LKPD assessment loader"
          git push
