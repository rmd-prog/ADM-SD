name: Global App Integrity Audit
on:
  push:
    branches:
      - feat-perangkat-pembelajaran-super-2026-09-10
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax audit
        run: |
          set -e
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | while IFS= read -r -d '' f; do node --check "$f"; done
      - name: Core contracts
        run: |
          set -e
          test -s index.html
          test -s index.js
          test -s assets/app-global-integrity-super-v1.js
          grep -q 'GURU_SD_GLOBAL_APP_INTEGRITY' assets/app-global-integrity-super-v1.js
          grep -q 'GURU_SD_MASTER' assets/perangkat-master-state-super-v1.js
          grep -q 'GURU_SD_AUTO_CHAIN' assets/perangkat-auto-chain-super-v1.js
          grep -q 'Assessment Integrity Layer V3' assets/assessment-auto.js
          grep -q 'ADM_CURRICULUM' assets/curriculum-data.js
      - name: Assessment policy
        run: |
          set -e
          for f in assets/assessment-auto.js assets/assessment-smart.js assets/assessment-bab-matrix.js assets/assessment-rekap-smart.js; do
            if grep -Eiq '\bSTS\b' "$f"; then echo "STS found in $f"; exit 1; fi
          done
          grep -q 'Ulangan BAB' assets/assessment-kokurikuler.js
      - name: Single source
        run: |
          set -e
          test ! -e assets/perangkat-cp-atp-tp-super-v2.js
          test ! -e assets/perangkat-prota-promes-super-v2.js
          test ! -e assets/perangkat-rpm-super-v2.js
          test ! -e assets/perangkat-lkpd-asesmen-super-v1.js
          test ! -e assets/perangkat-lkpd-asesmen-super-v2.js
          grep -q 'BOOK_CATALOG' assets/perangkat-katalog-super-v2.js
          if grep -Eiq 'const (BOOK|ROMBELS|MAPEL)[[:space:]]*=' assets/ai-generate-super.js; then exit 1; fi
          if grep -Eiq 'const (BOOK|ROMBELS|MAPEL)[[:space:]]*=' assets/ai-super-smart.js; then exit 1; fi
      - name: Pass
        run: echo 'GLOBAL APP INTEGRITY AUDIT: PASS'
