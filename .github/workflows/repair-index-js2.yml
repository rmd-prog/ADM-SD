name: Repair index script directly
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-index-js2.yml'
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove embedded script from exportHtml
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.find("+d.body+'<script>")
          end=s.find("</script>\n</body></html>'}", start)
          if start < 0 or end < 0:
              raise SystemExit(f'TARGET NOT FOUND start={start} end={end}')
          end += len("</script>\n</body></html>'}")
          s=s[:start]+"+d.body+'</body></html>'}"+s[end:]
          p.write_text(s,encoding='utf-8')
          print('repaired', start, end)
          PY
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          js='\n'.join(re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I))
          Path('/tmp/index.js').write_text(js,encoding='utf-8')
          print('script blocks:',len(re.findall(r'<script(?:\s[^>]*)?>',s,re.I)))
          PY
          node --check /tmp/index.js
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "fix: restore executable index script"
          git push
