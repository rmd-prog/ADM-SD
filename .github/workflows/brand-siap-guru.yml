name: Normalize SIAP GURU brand

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize-brand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace legacy visible brand text
        shell: bash
        run: |
          set -euo pipefail
          changed=0
          while IFS= read -r -d '' file; do
            if grep -Eq 'GURU\+ SD|SIAP GURU V11' "$file"; then
              sed -i -e 's/GURU+ SD/SIAP GURU/g' -e 's/SIAP GURU V11/SIAP GURU/g' "$file"
              changed=1
            fi
          done < <(git grep -Ilz -E 'GURU\+ SD|SIAP GURU V11' -- . ':!.github/workflows/*' || true)
          echo "changed=$changed"

      - name: Commit brand normalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No legacy brand text remains.'
            exit 0
          fi
          git add -A -- ':!.github/workflows/*'
          git commit -m 'chore: remove V11 from SIAP GURU branding'
          git push
