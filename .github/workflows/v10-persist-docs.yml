name: V10 Persist Docs

on:
  push:
    paths:
      - '.github/v10-persist.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Worker
        run: python3 .github/patch_persist.py
      - name: Validate Worker
        run: node --check src/index.js
      - name: Commit Worker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.js
          git diff --cached --quiet || git commit -m 'feat: persist perangkat and rpm documents'
          git push
