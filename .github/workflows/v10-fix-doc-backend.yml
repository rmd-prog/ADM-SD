name: V10 Fix Document Backend
on:
  push:
    paths:
      - '.github/v10-fix-doc-backend.trigger'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Worker document routes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/index.js')
          s=p.read_text(encoding='utf-8')
          if 'const DOCUMENT_TYPES = ["cp","tp","atp","prota","prosem"];' in s:
              print('Document routes already patched')
              raise SystemExit(0)
          anchor='      // AI DIAGNOSTIC — tidak pernah mengembalikan isi secret'
          if anchor not in s:
              raise SystemExit('ANCHOR_NOT_FOUND')
          block=r'''      // PERANGKAT PEMBELAJARAN - GET/POST (D1 persistence)
      const DOCUMENT_TYPES = ["cp","tp","atp","prota","prosem"];
      if (url.pathname === "/api/perangkat" && request.method === "GET") {
        const requested = cleanRombel(url.searchParams.get("rombel") || url.searchParams.get("kelas") || "");
        const own = cleanRombel(user.rombel || user.kelas || "");
        if (user.role !== "admin" && requested && requested !== own) return json({ok:false,message:"Akses rombel ditolak."},403);
        const c = await columns(env,"perangkat");
        const field = c.has("rombel") ? "COALESCE(NULLIF(TRIM(rombel), ''), TRIM(kelas))" : "TRIM(kelas)";
        let r;
        if (requested || user.role !== "admin") {
          const rw=rombelWhere(field,requested||own);
          r=await env.DB.prepare(`SELECT * FROM perangkat WHERE ${rw.sql} ORDER BY id DESC`).bind(...rw.binds).all();
        } else r=await env.DB.prepare("SELECT * FROM perangkat ORDER BY id DESC").all();
        return json({ok:true,data:r.results});
      }
      if (url.pathname === "/api/perangkat" && request.method === "POST") {
        const body=await request.json();
        const jenis=String(body.jenis||"").toLowerCase().trim();
        if(!DOCUMENT_TYPES.includes(jenis)) return json({ok:false,message:"Jenis perangkat tidak valid."},400);
        const kelas=cleanRombel(body.rombel||body.kelas||user.rombel||user.kelas||"");
        const own=cleanRombel(user.rombel||user.kelas||"");
        if(!kelas) return json({ok:false,message:"Rombel wajib diisi."},400);
        if(user.role!=="admin"&&kelas!==own) return json({ok:false,message:"Akses rombel ditolak."},403);
        const mapel=String(body.mapel||"").trim();
        const judul=String(body.judul||jenis.toUpperCase()).trim();
        const isi=String(body.isi??body.teks??body.text??body.konten??body.content??"");
        if(!isi.trim()) return json({ok:false,message:"Isi perangkat kosong."},400);
        const c=await columns(env,"perangkat");
        const cols=[]; const vals=[];
        const add=(name,value)=>{if(c.has(name)){cols.push(name);vals.push(value)}};
        add("jenis",jenis); add("mapel",mapel); add("kelas",kelas); add("rombel",kelas); add("judul",judul); add("isi",isi); add("teks",isi); add("content",isi); add("konten",isi); add("tahun",String(body.tahun||"2026/2027"));
        if(!cols.length) return json({ok:false,message:"Struktur tabel perangkat tidak dikenali."},500);
        const r=await env.DB.prepare(`INSERT INTO perangkat (${cols.join(",")}) VALUES (${cols.map(()=>"?").join(",")}) RETURNING *`).bind(...vals).first();
        return json({ok:true,data:r});
      }

      // RPM - GET/POST (D1 persistence)
      if (url.pathname === "/api/rpm" && request.method === "GET") {
        const requested=cleanRombel(url.searchParams.get("rombel")||url.searchParams.get("kelas")||"");
        const own=cleanRombel(user.rombel||user.kelas||"");
        if(user.role!=="admin"&&requested&&requested!==own)return json({ok:false,message:"Akses rombel ditolak."},403);
        const c=await columns(env,"rpm");
        const field=c.has("rombel")?"COALESCE(NULLIF(TRIM(rombel), ''), TRIM(kelas))":"TRIM(kelas)";
        let r;
        if(requested||user.role!=="admin"){const rw=rombelWhere(field,requested||own);r=await env.DB.prepare(`SELECT * FROM rpm WHERE ${rw.sql} ORDER BY id DESC`).bind(...rw.binds).all();}
        else r=await env.DB.prepare("SELECT * FROM rpm ORDER BY id DESC").all();
        return json({ok:true,data:r.results});
      }
      if (url.pathname === "/api/rpm" && request.method === "POST") {
        const body=await request.json();
        const kelas=cleanRombel(body.rombel||body.kelas||user.rombel||user.kelas||"");
        const own=cleanRombel(user.rombel||user.kelas||"");
        if(!kelas)return json({ok:false,message:"Rombel wajib diisi."},400);
        if(user.role!=="admin"&&kelas!==own)return json({ok:false,message:"Akses rombel ditolak."},403);
        const mapel=String(body.mapel||"").trim(); const bab=String(body.bab||body.unit||body.materi||"").trim();
        const judul=String(body.judul||("RPM • "+mapel)).trim(); const isi=String(body.isi??body.teks??body.text??body.konten??body.content??"");
        if(!isi.trim())return json({ok:false,message:"Isi RPM kosong."},400);
        const c=await columns(env,"rpm"); const cols=[];const vals=[];const add=(name,value)=>{if(c.has(name)){cols.push(name);vals.push(value)}};
        add("mapel",mapel);add("kelas",kelas);add("rombel",kelas);add("bab",bab);add("unit",bab);add("judul",judul);add("isi",isi);add("teks",isi);add("content",isi);add("konten",isi);add("tahun",String(body.tahun||"2026/2027"));add("semester",Number(body.semester||1));
        if(!cols.length)return json({ok:false,message:"Struktur tabel RPM tidak dikenali."},500);
        const r=await env.DB.prepare(`INSERT INTO rpm (${cols.join(",")}) VALUES (${cols.map(()=>"?").join(",")}) RETURNING *`).bind(...vals).first();
        return json({ok:true,data:r});
      }

'''
          p.write_text(s.replace(anchor,block+anchor,1),encoding='utf-8')
          print('patched src/index.js')
          PY
      - name: Validate Worker JS
        run: node --check src/index.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.js
          git diff --cached --quiet && echo 'No changes' && exit 0
          git commit -m 'fix: add D1 persistence routes for perangkat and rpm'
          git push
