name: repair html script parser

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair embedded script closing tag
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<script src="guru-mapel-ui.js"></script>'
          new = '<script src="guru-mapel-ui.js"><\\/script>'
          if old in s:
              s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No repair needed'
            exit 0
          fi
          git commit -m 'fix: repair embedded script tag in index.html [skip ci]'
          git push
