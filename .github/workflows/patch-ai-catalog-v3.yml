name: Patch AI catalog lock V3

on:
  push:
    branches: [main]

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch frontend catalog behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""const officialBook=bookInfo(m,k);\nif(officialBook&&Array.isArray(officialBook.chapters)&&officialBook.chapters.length) return officialBook.chapters.slice();\nconst sets={"""
          new="""const officialBook=bookInfo(m,k);\nif(officialBook){\n  if(Array.isArray(officialBook.chapters)&&officialBook.chapters.length) return officialBook.chapters.slice();\n  // Buku terkunci tetapi struktur BAB/Unit belum terverifikasi: jangan mengarang.\n  return [];\n}\nconst sets={"""
          old2="""id('scoreBab').innerHTML=babList(m,k).map((x,i)=>'<option value=\"'+i+'\">'+esc('BAB '+(i+1)+' — '+x)+'</option>').join('');\nlet rk=normalizeRombel(id('rpmKelas').value),rm=id('rpmMapel').value;\nid('rpmBab').innerHTML=babList(rm,rk).map((x,i)=>'<option value=\"'+i+'\">'+esc('BAB '+(i+1)+' — '+x)+'</option>').join('');"""
          new2="""const scoreUnits=babList(m,k);\nid('scoreBab').innerHTML=scoreUnits.length?scoreUnits.map((x,i)=>'<option value=\"'+i+'\">'+esc('BAB '+(i+1)+' — '+x)+'</option>').join(''):'<option value=\"\">Struktur BAB/Unit belum terverifikasi</option>';\nlet rk=normalizeRombel(id('rpmKelas').value),rm=id('rpmMapel').value;\nconst rpmUnits=babList(rm,rk);\nid('rpmBab').innerHTML=rpmUnits.length?rpmUnits.map((x,i)=>'<option value=\"'+i+'\">'+esc('BAB '+(i+1)+' — '+x)+'</option>').join(''):'<option value=\"\">Struktur BAB/Unit belum terverifikasi</option>';"""
          if old not in s:
              raise SystemExit('catalog target not found')
          if old2 not in s:
              raise SystemExit('updateBab target not found')
          s=s.replace(old,new,1).replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          js=re.search(r'<script>([\s\S]*)</script>',s).group(1)
          Path('/tmp/index.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/index.js
      - name: Commit frontend patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: use verified book chapters across AI generators'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/patch-ai-catalog-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'chore: remove temporary AI catalog patch workflow'
          git push