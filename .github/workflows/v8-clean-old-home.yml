name: V8 Clean Old Home Layers
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy dashboard loaders
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tags = [
            '<script src="assets/kurikulum-super-schedule.js"></script>',
            '<script src="assets/kurikulum-super-schedule-multiday.js"></script>',
            '<script src="assets/promes-super-calendar.js"></script>',
          ]
          for tag in tags:
              s=s.replace('\n'+tag, '')
              s=s.replace(tag+'\n', '')
              s=s.replace(tag, '')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'Old dashboard loaders already clean'; exit 0; fi
          git commit -m 'V8: remove legacy schedule and calendar loaders'
          git push
