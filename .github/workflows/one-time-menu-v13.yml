name: One-time V13 menu restructure
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-menu:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch menu safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('<aside id="sidebar"')
          end=s.index('</aside>', start)+len('</aside>')
          menu='''<aside id="sidebar" class="side v13-sidebar">
          <div class="side-title">MENU UTAMA</div>
          <button type="button" class="navbtn v13-home active" data-page="dashboard"><span class="v13-main-icon">🏠</span><span>Dashboard</span></button>
          <div class="menu-group v13-group"><button type="button" class="navgroup"><span><span class="v13-main-icon">👨‍🏫</span> ADMINISTRASI GURU</span><span class="v13-chevron">▾</span></button><div class="submenu">
          <button type="button" class="navbtn" data-page="aiGenerate">📝 Jurnal &amp; Refleksi</button>
          <button type="button" class="navbtn admin-only" data-page="teachers">👩‍🏫 Data Guru</button>
          </div></div>
          <div class="menu-group v13-group"><button type="button" class="navgroup"><span><span class="v13-main-icon">📚</span> PERANGKAT PEMBELAJARAN</span><span class="v13-chevron">▾</span></button><div class="submenu">
          <button type="button" class="navbtn" data-page="cp">CP — Capaian Pembelajaran</button>
          <button type="button" class="navbtn" data-page="tp">TP — Tujuan Pembelajaran</button>
          <button type="button" class="navbtn" data-page="atp">ATP — Alur Tujuan Pembelajaran</button>
          <button type="button" class="navbtn" data-page="prota">Prota — Program Tahunan</button>
          <button type="button" class="navbtn" data-page="prosem">Prosem — Program Semester</button>
          <button type="button" class="navbtn" data-page="rpm">RPM / Modul Ajar</button>
          <button type="button" class="navbtn" data-page="aiGenerate">📄 Bahan Ajar &amp; LKPD</button>
          </div></div>
          <div class="menu-group v13-group"><button type="button" class="navgroup"><span><span class="v13-main-icon">📝</span> PENILAIAN</span><span class="v13-chevron">▾</span></button><div class="submenu">
          <button type="button" class="navbtn" data-page="aiGenerate">🤖 Generate Soal</button>
          <button type="button" class="navbtn" data-page="aiGenerate">📋 Kisi-kisi</button>
          <button type="button" class="navbtn" data-page="aiGenerate">🎯 Rubrik</button>
          <button type="button" class="navbtn" data-page="scores">✍️ Input Nilai</button>
          <button type="button" class="navbtn" data-page="report">📊 Rekap / Rapor</button>
          <button type="button" class="navbtn" data-page="aiGenerate">📈 Analisis Hasil</button>
          <button type="button" class="navbtn" data-page="aiGenerate">🔄 Remedial</button>
          <button type="button" class="navbtn" data-page="aiGenerate">🚀 Pengayaan</button>
          <button type="button" class="navbtn" data-page="aiGenerate">🧠 Deskripsi Hasil Belajar</button>
          <button type="button" class="navbtn admin-only" data-page="importScores">📥 Import Nilai</button>
          </div></div>
          <div class="menu-group v13-group"><button type="button" class="navgroup"><span><span class="v13-main-icon">👥</span> DATA SISWA</span><span class="v13-chevron">▾</span></button><div class="submenu">
          <button type="button" class="navbtn" data-page="students">📋 Daftar Siswa</button>
          <button type="button" class="navbtn admin-only" data-page="students">📥 Import Siswa</button>
          </div></div>
          <div class="menu-group v13-group"><button type="button" class="navgroup"><span><span class="v13-main-icon">🤖</span> AI GENERATOR SUPER</span><span class="v13-chevron">▾</span></button><div class="submenu">
          <button type="button" class="navbtn" data-page="aiGenerate">✨ Semua Generator AI</button>
          <button type="button" class="navbtn" data-page="aiGenerate">📚 Perangkat &amp; Materi</button>
          <button type="button" class="navbtn" data-page="aiGenerate">📝 Asesmen</button>
          <button type="button" class="navbtn" data-page="aiGenerate">👨‍🏫 Administrasi Guru</button>
          </div></div>
          <div class="menu-group v13-group"><button type="button" class="navgroup"><span><span class="v13-main-icon">📊</span> LAPORAN &amp; DOKUMEN</span><span class="v13-chevron">▾</span></button><div class="submenu">
          <button type="button" class="navbtn" data-page="report">📑 Laporan &amp; Rapor</button>
          <button type="button" class="navbtn" data-page="reference">📖 Referensi SIBI</button>
          </div></div>
          <div class="menu-group v13-group admin-only"><button type="button" class="navgroup"><span><span class="v13-main-icon">⚙️</span> PENGATURAN</span><span class="v13-chevron">▾</span></button><div class="submenu">
          <button type="button" class="navbtn admin-only" data-page="backup">💾 Backup / Restore</button>
          </div></div>
          </aside>'''
          s=s[:start]+menu+s[end:]
          css='''\n<style id="adm-v13-menu">\n.v13-sidebar{padding:12px;background:linear-gradient(180deg,#0b1220,#172554 58%,#312e81)!important}.v13-group{margin:4px 0}.v13-sidebar .navgroup{border:1px solid #ffffff10;border-radius:12px;color:#e2e8f0;padding:11px 12px}.v13-sidebar .navgroup:hover{background:#ffffff0d}.v13-main-icon{display:inline-grid;place-items:center;width:25px;margin-right:4px}.v13-chevron{font-size:12px;opacity:.75}.v13-sidebar .submenu{padding:3px 0 5px 8px}.v13-sidebar .submenu .navbtn{font-size:13px;padding:9px 11px;color:#cbd5e1!important}.v13-sidebar .submenu .navbtn:hover,.v13-sidebar .submenu .navbtn.active{background:#2563eb!important;color:#fff!important;transform:translateX(2px)}.v13-sidebar .v13-home{margin-bottom:5px;background:#1e3a8a!important;color:#fff!important}.v13-sidebar .side-title{letter-spacing:.04em;font-size:12px;opacity:.85}\n</style>\n'''
          if 'id="adm-v13-menu"' not in s:
              s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/one-time-menu-v13.yml
          git commit -m "Rombak menu utama GURU+ SD V13" || exit 0
          git push
# force rerun
