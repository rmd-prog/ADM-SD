name: AI chapter lock fix
on:
  push:
    branches:
      - main
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          a=s.index('function aiBookLock(m,k,bab){')
          b=s.index('function aiBookInstruction',a)
          new="""function normalizeBabName(v){const s=String(v??'').trim();return s.replace(/^BAB\\s*\\d+\\s*[—-]\\s*/i,'').trim();}
function aiBookLock(m,k,bab){const b=bookInfo(m,k);if(!b)return{title:'Belum terdaftar',source:'SIBI',chapters:[]};const chapters=Array.isArray(b.chapters)?b.chapters.slice():[];const raw=normalizeBabName(bab);const wanted=/^\\d+$/.test(raw)&&chapters[Number(raw)]?chapters[Number(raw)]:raw;return{title:b.title,source:b.source,year:b.year||'',chapters,bab:wanted&&chapters.includes(wanted)?wanted:''};}
"""
          s=s[:a]+new+s[b:]
          old="if(t==='rpm')extra.bab=bab.options[bab.selectedIndex]?.textContent||'';"
          new2="if(t==='rpm')extra.bab=normalizeBabName(bab.options[bab.selectedIndex]?.textContent||'');"
          if old not in s: raise SystemExit('AI SUPER target missing')
          s=s.replace(old,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>',s,re.I)
          if not blocks: raise SystemExit('No JS')
          Path('/tmp/index.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/index.js
          grep -q 'function normalizeBabName' index.html
          grep -q "extra.bab=normalizeBabName" index.html
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "fix: normalize selected BAB in AI generators"
          git push
