name: Deploy ADM-SD Worker

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

concurrency:
  group: adm-sd-worker-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: 1059f6c3f94755e9562d95cfd16ff6d1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect current Worker bindings via Workers API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -fsSL "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/adm-sd/settings" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" > /tmp/worker-settings.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/worker-settings.json'))
          if not d.get('success'): raise SystemExit('Workers API settings lookup failed')
          for b in d.get('result',{}).get('bindings',[]):
              if b.get('type')=='d1':
                  print('CURRENT D1 BINDING:',json.dumps({k:b.get(k) for k in ('name','type','database_id') if b.get(k)}))
          print('CURRENT BINDING TYPES:',sorted(set(b.get('type','') for b in d.get('result',{}).get('bindings',[]))))
          PY
      - name: Deploy Worker preserving existing production bindings
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --config wrangler.jsonc --keep-vars
