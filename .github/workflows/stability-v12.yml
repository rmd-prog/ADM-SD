name: ADM-SD guarded stability V12
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'fix: ADM-SD stability UI V12 [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded frontend and backend patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, re
          css=base64.b64decode('?').decode('utf-8')
          js=base64.b64decode('').decode('utf-8')
          idx=Path('index.html'); s=idx.read_text(encoding='utf-8')
          if 'ADM-SD V12 SAFE LOGIN' in s: raise SystemExit('index already patched')
          if 'remoteLogin' not in s or 'loginForm' not in s: raise SystemExit('ABORT: login anchors missing')
          if '</head>' not in s: raise SystemExit('ABORT: head missing')
          s=s.replace('</head>','<style id="adm-sd-v12">'+css+'</style>\n</head>',1)
          pos=s.rfind('</script>')
          if pos<0: raise SystemExit('ABORT: script close missing')
          s=s[:pos]+'\n'+js+'\n'+s[pos:]
          idx.write_text(s,encoding='utf-8')
          wpath=Path('src/index.js'); w=wpath.read_text(encoding='utf-8')
          old='user.role !== "admin" && requested && requested !== own'; new='user.role !== "admin" && requested && !canAccessRombel(user, requested)'; n=w.count(old)
          if n<4: raise SystemExit(f'ABORT: rombel guard count={n}')
          w=w.replace(old,new); wpath.write_text(w,encoding='utf-8')
          print('OK patch applied; guards=',n)
          PY
      - name: Validate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
          node --check src/index.js
          grep -q 'ADM-SD V12 SAFE LOGIN' index.html
          grep -q '!canAccessRombel(user, requested)' src/index.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html src/index.js
          git commit -m 'fix: ADM-SD stability UI V12 [skip ci]'
          git push
