name: Touch Fix V15
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile touch and navigation
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''\n<style id="touch-fix-v15">\n/* GURU+ SD V15 — Android touch safety */\n.v13-sidebar .navbtn,.v13-sidebar .navgroup,.v13-sidebar .submenu{position:relative;z-index:20;pointer-events:auto!important;touch-action:manipulation;-webkit-tap-highlight-color:transparent}\n#app .page.active input,#app .page.active select,#app .page.active textarea,#app .page.active button,#app .page.active .student-tab,#app .page.active .tablewrap{pointer-events:auto!important;touch-action:manipulation}\n#app .page.active{pointer-events:auto!important}\n</style>\n'''
          if 'id="touch-fix-v15"' not in s:
              s=s.replace('</head>',css+'</head>',1)
          js='''\n<script id="touch-fix-v15-js">\n(function(){\n  function fix(){\n    document.querySelectorAll('.v13-sidebar .submenu .navbtn').forEach(function(b){\n      if(b.dataset.touchV15)return;\n      b.dataset.touchV15='1';\n      b.addEventListener('click',function(e){e.stopPropagation();},false);\n      b.addEventListener('touchend',function(e){e.stopPropagation();},false);\n    });\n    document.querySelectorAll('#app .page.active input,#app .page.active select,#app .page.active textarea,#app .page.active button').forEach(function(el){\n      el.style.pointerEvents='auto';\n      el.style.touchAction='manipulation';\n    });\n  }\n  fix();\n  new MutationObserver(fix).observe(document.body,{subtree:true,attributes:true,attributeFilter:['class']});\n  document.addEventListener('click',function(e){if(e.target.closest('.page.active'))fix();},{passive:true});\n})();\n</script>\n'''
          if 'id="touch-fix-v15-js"' not in s:
              s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/touch-fix-v15.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix Android touch navigation V15"
          git push
