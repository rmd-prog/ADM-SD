name: Deploy ADM-SD Worker

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

concurrency:
  group: adm-sd-worker-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: 1059f6c3f94755e9562d95cfd16ff6d1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy Worker with persistent D1 binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc --keep-vars
