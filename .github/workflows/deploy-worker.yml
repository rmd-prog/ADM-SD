name: Deploy ADM-SD Worker

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 1059f6c3f94755e9562d95cfd16ff6d1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract live D1 binding fields (read only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import os,json,urllib.request
          a=os.environ['CLOUDFLARE_ACCOUNT_ID'];t=os.environ['CLOUDFLARE_API_TOKEN']
          for suffix in ['/settings','/versions']:
            u=f'https://api.cloudflare.com/client/v4/accounts/{a}/workers/scripts/adm-sd{suffix}'
            req=urllib.request.Request(u,headers={'Authorization':'Bearer '+t})
            try:
              with urllib.request.urlopen(req,timeout=20) as r:d=json.load(r)
              def walk(x):
                if isinstance(x,dict):
                  typ=str(x.get('type','')).lower()
                  if typ in ('d1','database','d1_database') or any('d1' in str(k).lower() for k in x.keys()):
                    print('D1_META',json.dumps(x)[:6000])
                  for v in x.values():walk(v)
                elif isinstance(x,list):
                  for v in x:walk(v)
              walk(d.get('result',d))
            except Exception as e:print('CF_ERROR',suffix,str(e)[:200])
          PY
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc --keep-vars
