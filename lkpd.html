<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LKPD Visual AI — SI-NILAI SD V8</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2ff;color:#172033;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dbe4f0;border-radius:20px;box-shadow:0 12px 35px #0f172a12}.top{padding:18px 20px;margin-bottom:14px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff}.top h1{margin:0;font-size:23px}.top p{margin:5px 0 0;opacity:.9}.controls{padding:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.field label{display:block;font-weight:800;font-size:12px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:11px;background:#fff}.field.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:900;cursor:pointer}.primary{background:#2563eb;color:#fff}.secondary{background:#e2e8f0}.success{background:#16a34a;color:#fff}.status{display:none;margin-top:10px;padding:10px 12px;border-radius:10px;background:#eff6ff;color:#1e40af}.status.show{display:block}.stage{padding:18px;margin-top:14px;overflow:auto}.paper{width:794px;height:1123px;margin:0 auto;background:#fff;position:relative;padding:28px;overflow:hidden;border:1px solid #cbd5e1;font-family:Arial,sans-serif}.paper:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 10% 5%,#dbeafe 0 45px,transparent 46px),radial-gradient(circle at 95% 92%,#fef3c7 0 55px,transparent 56px);pointer-events:none}.head{position:relative;border:2px solid var(--accent,#2563eb);border-radius:18px;padding:14px 16px;margin-bottom:10px;background:linear-gradient(135deg,var(--soft,#eff6ff),#fff)}.badge{display:inline-block;background:var(--accent,#2563eb);color:#fff;padding:4px 9px;border-radius:999px;font-size:9px;font-weight:900}.title{font-size:22px;font-weight:900;margin:5px 0}.sub{font-size:10px;color:#475569}.identity{display:grid;grid-template-columns:1.5fr .8fr .8fr;gap:8px;margin-top:10px}.idbox{border-bottom:1px solid #64748b;font-size:10px;padding:5px 3px}.instructions{position:relative;margin:8px 0;padding:8px 10px;border-left:5px solid var(--accent,#2563eb);background:var(--soft,#eff6ff);font-size:9.5px;border-radius:8px}.questions{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:7px 9px}.q{border:1px solid #dbe4f0;border-radius:10px;padding:7px 8px;break-inside:avoid;background:#fff;min-height:58px}.qnum{font-weight:900;font-size:10px}.qtext{font-size:9.2px;line-height:1.28;margin:2px 0 4px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:3px}.opt{font-size:8px;border:1px solid #e2e8f0;border-radius:6px;padding:3px 4px;background:#f8fafc;display:flex;gap:4px;align-items:center}.opt b{color:var(--accent,#2563eb)}.visual{width:24px;height:24px;border-radius:6px;background:var(--soft,#eff6ff);display:grid;place-items:center;font-size:14px;flex:none}.footer{position:absolute;left:28px;right:28px;bottom:12px;border-top:1px dashed #cbd5e1;padding-top:5px;display:flex;justify-content:space-between;font-size:8px;color:#64748b}.empty{height:100%;display:grid;place-items:center;color:#94a3b8;text-align:center}.loading{opacity:.55;pointer-events:none}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.paper{transform-origin:top left;margin-left:0}}@media(max-width:520px){.wrap{padding:10px}.grid{grid-template-columns:1fr}.top h1{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top card"><h1>🎨 LKPD Visual AI</h1><p>Generate LKPD menarik • 1 halaman • siap cetak • opsi visual</p></div>
<div class="controls card">
<div class="grid">
<div class="field"><label>Kelas</label><select id="kelas"><option value="IA">Kelas 1</option><option value="IIA">Kelas 2</option><option value="IIIA">Kelas 3</option><option value="IVA" selected>Kelas 4</option><option value="V">Kelas 5</option><option value="VI">Kelas 6</option></select></div>
<div class="field"><label>Mapel</label><input id="mapel" value="IPAS"></div>
<div class="field"><label>Jumlah soal</label><select id="jumlah"><option>10</option><option>15</option><option selected>20</option><option>25</option><option>30</option></select></div>
<div class="field"><label>Gaya</label><select id="gaya"><option value="ceria">Ceria & ramah anak</option><option value="alam">Alam & ilustratif</option><option value="minimal">Minimal modern</option><option value="warna">Warna-warni edukatif</option></select></div>
<div class="field full"><label>Materi / permintaan</label><textarea id="materi" rows="3" placeholder="Contoh: Bagian tumbuhan dan fungsinya. Buat pilihan ganda dengan beberapa opsi bergambar."></textarea></div>
</div>
<div class="actions"><button class="btn primary" id="generate">✨ Generate LKPD</button><button class="btn secondary" id="sample">Contoh cepat</button><button class="btn success" id="png">🖼️ Simpan PNG</button><button class="btn secondary" onclick="window.print()">🖨️ Cetak</button></div>
<div id="status" class="status"></div>
</div>
<div class="stage card"><div id="paper" class="paper"><div class="empty"><div><div style="font-size:44px">🧩</div><b>LKPD akan muncul di sini</b><br><small>Masukkan materi lalu tekan Generate LKPD.</small></div></div></div></div>
</div>
<script>
const API_BASE=localStorage.getItem('siApiBase')||'https://adm-sd-api.workers.dev/api';
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]));
const themes={ceria:['#2563eb','#eff6ff','🌈'],alam:['#15803d','#dcfce7','🌿'],minimal:['#334155','#f1f5f9','📘'],warna:['#db2777','#fce7f3','⭐']};
function className(v){return ({IA:'1',IIA:'2',IIIA:'3',IVA:'4',V:'5',VI:'6'})[v]||v}
function visualFor(text){const s=String(text).toLowerCase();if(/tumbuh|daun|akar|batang|bunga/.test(s))return '🌱';if(/hewan|kucing|sapi|ayam|ikan|kupu/.test(s))return '🐾';if(/matahari|planet|bulan|bintang/.test(s))return '🌞';if(/air|sungai|laut/.test(s))return '💧';if(/angka|hitung|matematika/.test(s))return '🔢';if(/bahasa|kata|kalimat/.test(s))return '🔤';return '💡'}
function normalizeAI(raw,n){let x=raw;if(typeof x==='string'){const m=x.match(/\{[\s\S]*\}/);if(m)try{x=JSON.parse(m[0])}catch{}if(typeof x==='string'){const lines=x.split(/\n+/).filter(Boolean);const qs=[];for(let i=0;i<lines.length&&qs.length<n;i++){const line=lines[i].replace(/^\s*(?:\d+|[-*])\.?\s*/,'').trim();if(line.length>15)qs.push({question:line,options:['Pilihan A','Pilihan B','Pilihan C','Pilihan D']})}return {title:'LKPD '+$('mapel').value,questions:qs}}}return x&&Array.isArray(x.questions)?x:{title:'LKPD '+$('mapel').value,questions:[]}}
function render(data){const [accent,soft,emoji]=themes[$('gaya').value];document.documentElement.style.setProperty('--accent',accent);document.documentElement.style.setProperty('--soft',soft);let qs=(data.questions||[]).slice(0,Number($('jumlah').value));while(qs.length<Number($('jumlah').value))qs.push({question:'Aktivitas sesuai materi yang dipelajari.',options:['Benar','Kurang tepat','Tidak sesuai','Belum tahu']});$('paper').innerHTML=`<div class="head"><span class="badge">LKPD • KURIKULUM MERDEKA</span><div class="title">${esc(data.title||'LEMBAR KERJA PESERTA DIDIK')}</div><div class="sub">${esc($('mapel').value)} • Kelas ${className($('kelas').value)} • Tahun Ajaran 2026/2027</div><div class="identity"><div class="idbox">Nama: ______________________________</div><div class="idbox">Kelas: ______</div><div class="idbox">Tanggal: ______</div></div></div><div class="instructions"><b>Petunjuk:</b> Bacalah setiap soal dengan teliti. Pilih satu jawaban yang paling tepat. Kerjakan dengan rapi dan percaya diri. ✨</div><div class="questions">${qs.map((q,i)=>`<div class="q"><div class="qnum">${i+1}. <span>${esc(q.question||'')}</span></div><div class="opts">${(q.options||[]).slice(0,4).map((o,j)=>`<div class="opt"><b>${String.fromCharCode(65+j)}.</b><span class="visual">${visualFor(o)}</span><span>${esc(typeof o==='string'?o:o.text||'')}</span></div>`).join('')}</div></div>`).join('')}</div><div class="footer"><span>Kerjakan dengan jujur • Semangat belajar!</span><span>${qs.length} soal • 1 halaman</span></div>`}
async function generate(){const token=localStorage.getItem('siAuthToken');if(!token){setStatus('❌ Sesi login ADM-SD tidak ditemukan. Login dulu di aplikasi utama.');return}const n=Number($('jumlah').value);const context=`Buat LKPD SD satu halaman dengan TEPAT ${n} soal pilihan ganda. Kelas ${className($('kelas').value)}, mapel ${$('mapel').value}, materi: ${$('materi').value||'materi umum sesuai kelas dan mapel'}. HASIL WAJIB berupa JSON valid tanpa markdown: {"title":"...","questions":[{"question":"...","options":["...","...","...","..."]}]}. Tepat ${n} item questions. Opsi harus singkat agar muat satu halaman. Jika soal cocok dengan gambar, tuliskan objek visual sederhana dalam teks opsi. Jangan membuat halaman kedua. Gaya ${$('gaya').value}.`;setStatus('🤖 AI sedang menyusun '+n+' soal dan mengatur layout satu halaman...');$('generate').disabled=true;try{const res=await fetch(API_BASE+'/ai/generate',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({jenis:'lkpd',rombel:$('kelas').value,mapel:$('mapel').value,fase:'Fase '+(Number(className($('kelas').value))<=2?'A':Number(className($('kelas').value))<=4?'B':'C'),tahun:'2026/2027',context,tujuan:'LKPD visual satu halaman',durasi:'40 menit',aktivitas:'Pilihan ganda dengan opsi visual',jumlahSoal:n,bentukSoal:'Pilihan Ganda'})});const p=await res.json();if(!res.ok||!p.ok)throw Error(p.message||'AI gagal.');render(normalizeAI(p.text,n));setStatus('✅ LKPD selesai: '+n+' soal dalam 1 halaman.');}catch(e){setStatus('❌ '+e.message)}finally{$('generate').disabled=false}}
function setStatus(t){$('status').textContent=t;$('status').classList.add('show')}
$('generate').onclick=generate;$('sample').onclick=()=>{$('materi').value='Bagian tumbuhan dan fungsinya. Gunakan soal sederhana untuk siswa SD dan beberapa opsi bergambar.';generate()};$('png').onclick=async()=>{if(!window.html2canvas){setStatus('❌ Mesin gambar belum siap.');return}setStatus('🖼️ Menyiapkan gambar LKPD...');const c=await html2canvas($('paper'),{scale:2,backgroundColor:'#fff',useCORS:true});const a=document.createElement('a');a.download='LKPD-Visual-'+Date.now()+'.png';a.href=c.toDataURL('image/png');a.click();setStatus('✅ Gambar LKPD berhasil dibuat.');};
</script>
</body></html>
