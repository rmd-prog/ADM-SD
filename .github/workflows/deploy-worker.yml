name: Deploy ADM-SD Worker

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: write

concurrency:
  group: adm-sd-worker-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: 1059f6c3f94755e9562d95cfd16ff6d1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recover existing D1 binding from account Worker metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, urllib.request
          account='${{ env.CLOUDFLARE_ACCOUNT_ID }}'; token='${{ secrets.CLOUDFLARE_API_TOKEN }}'; api=f'https://api.cloudflare.com/client/v4/accounts/{account}'
          def get(url):
              req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}'})
              with urllib.request.urlopen(req,timeout=20) as r:return json.load(r)
          def arr(obj):
              if isinstance(obj,list): return obj
              if isinstance(obj,dict):
                  for k in ('result','items','workers','scripts'):
                      if k in obj:
                          x=obj[k]
                          if isinstance(x,list): return x
                          if isinstance(x,dict):
                              y=arr(x)
                              if y:return y
              return []
          current=json.load(open('wrangler.jsonc')); found=None
          scripts=arr(get(api+'/workers/scripts').get('result',[]))
          for s in scripts:
              name=(s.get('id') or s.get('name')) if isinstance(s,dict) else None
              if not name: continue
              try:
                  settings=get(api+'/workers/scripts/'+name+'/settings').get('result',{})
                  for b in settings.get('bindings',[]) or []:
                      if isinstance(b,dict) and b.get('type')=='d1' and b.get('name') and b.get('database_id'):
                          found={'binding':b['name'],'database_id':b['database_id'],'database_name':b.get('database_name','')}; break
              except Exception: pass
              if found: break
          if not found: raise SystemExit('NO_D1_BINDING_FOUND_IN_ACCOUNT_WORKERS')
          print('RECOVERED D1 DATABASE ID:',found['database_id'])
          current.pop('keep_bindings',None); current['d1_databases']=[found]
          with open('wrangler.recovered.jsonc','w') as f: json.dump(current,f,indent=2)
          repo=json.load(open('wrangler.jsonc'))
          if repo.get('d1_databases') != [found]:
              repo.pop('keep_bindings',None); repo['d1_databases']=[found]
              with open('wrangler.jsonc','w') as f: json.dump(repo,f,indent=2); f.write('\n')
          PY
      - name: Deploy Worker with recovered D1 binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@latest deploy --config wrangler.recovered.jsonc --keep-vars
      - name: Commit recovered D1 binding
        run: |
          if git diff --quiet -- wrangler.jsonc; then echo 'No config persistence needed'; exit 0; fi
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wrangler.jsonc; git commit -m 'fix: restore production D1 binding in Wrangler config'; git push
