name: Force Login Loader
on:
  push:
    paths:
      - '.github/force-login-loader.trigger'
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject hard login loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./assets/login-direct-fallback-v1.js?v=10"></script>'
          if tag not in s:
              if '</body>' in s:
                  s=s.replace('</body>', tag+'\n</body>', 1)
              else:
                  s += '\n'+tag+'\n'
              p.write_text(s,encoding='utf-8')
              print('LOGIN_LOADER_INJECTED')
          else:
              print('LOGIN_LOADER_ALREADY_PRESENT')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
          else
            git commit -m 'fix: force load hard login fallback'
            git push
          fi
