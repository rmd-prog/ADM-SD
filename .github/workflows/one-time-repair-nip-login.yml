name: One-time repair NIP login
on:
  push:
    branches: ["feat-perangkat-pembelajaran-super-2026-09-10"]
  workflow_dispatch:
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Worker login to accept NIP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/index.js')
          s=p.read_text(encoding='utf-8')
          old='''        const user = await env.DB.prepare(\n          `SELECT id, username, password, nama, role, kelas, ${rombelExpr}, ${mapelExpr}\n           FROM users WHERE username = ?`\n        ).bind(username).first();'''
          new='''        const loginWhere = c.has("nip") ? "WHERE username = ? OR nip = ?" : "WHERE username = ?";\n        const loginStmt = env.DB.prepare(\n          `SELECT id, username, password, nama, role, kelas, ${rombelExpr}, ${mapelExpr}\n           FROM users ${loginWhere}`\n        );\n        const user = c.has("nip")\n          ? await loginStmt.bind(username, username).first()\n          : await loginStmt.bind(username).first();'''
          if old not in s:
              raise SystemExit('Expected login query block not found; refusing unsafe edit')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          print('NIP login patch applied; no D1 data mutation performed')
          PY
      - name: Validate Worker syntax
        run: node --check src/index.js
      - name: Commit repair and remove one-time workflow
        run: |
          rm -f .github/workflows/one-time-repair-nip-login.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.js .github/workflows/one-time-repair-nip-login.yml
          git commit -m 'fix: support NIP login without changing D1 data'
          git push
