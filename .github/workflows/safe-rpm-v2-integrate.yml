name: Safe RPM SUPER v2 Integrate
on:
  push:
    branches: [feat-perangkat-pembelajaran-super-2026-09-10]
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Safely add RPM v2 loader
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          tag='<script src="assets/perangkat-rpm-super-v2.js"></script>'
          if tag in s:
              print('RPM v2 loader already present'); raise SystemExit(0)
          anchor='<script src="assets/perangkat-rpm-super-v1.js"></script>'
          if anchor not in s:
              raise SystemExit('RPM v1 loader not found; refusing unsafe edit')
          s=s.replace(anchor,anchor+'\n'+tag,1)
          if s.count(tag)!=1: raise SystemExit('invalid loader count')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          test "$(grep -o 'assets/perangkat-rpm-super-v2.js' index.html | wc -l)" -eq 1
          node --check assets/perangkat-rpm-super-v2.js
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ci: load RPM SUPER v2 safely'
          git push