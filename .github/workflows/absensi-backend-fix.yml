name: Fix Absensi Backend
on:
  push:
    paths:
      - '.github/absensi-backend-trigger.txt'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch backend and validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/index.js')
          s=p.read_text()
          marker='function subjectAllowed(user, requestedMapel) {'
          helper='''function isGuruMapelAll(user) {\n  return user?.role === "guru_mapel" && cleanRombel(user?.rombel || user?.kelas) === "ALL";\n}\n\nfunction canAccessRombel(user, requested) {\n  if (!user || user.role === "admin") return true;\n  if (isGuruMapelAll(user)) return true;\n  return cleanRombel(requested) === cleanRombel(user.rombel || user.kelas);\n}\n\n'''
          if 'function canAccessRombel(user, requested)' not in s:
              if marker not in s: raise SystemExit('marker subjectAllowed tidak ditemukan')
              s=s.replace(marker,helper+marker,1)
              p.write_text(s)
          a=Path('assets/absensi.js')
          x=a.read_text()
          x=x.replace('j=await api(`?rombel=${encodeURIComponent(r)}&bulan=${encodeURIComponent(m)}`);','const j=await api(`?rombel=${encodeURIComponent(r)}&bulan=${encodeURIComponent(m)}`);')
          a.write_text(x)
          PY
          node --check src/index.js
          node --check assets/absensi.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.js assets/absensi.js
          git diff --cached --quiet || git commit -m 'fix: complete attendance access rules and JS validation [skip ci]'
          git push origin main
