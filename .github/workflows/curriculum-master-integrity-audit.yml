name: Curriculum Master Integrity Audit

on:
  push:
    branches: [feat-perangkat-pembelajaran-super-2026-09-10]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax audit
        shell: bash
        run: |
          set -e
          find assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check guru-mapel-ui.js
          echo "JavaScript syntax: OK (all local JS files)"
      - name: Assessment menu integrity audit
        shell: bash
        run: |
          set -e
          grep -q 'Assessment Integrity Layer V3' assets/assessment-auto.js
          grep -q 'window.ADM_CURRICULUM' assets/assessment-auto.js
          grep -q "const KEY='siapGuruAssessmentV1'" assets/assessment-auto.js
          grep -q 'Ulangan BAB' assets/assessment-auto.js
          ! grep -q 'STS' assets/assessment-auto.js
          ! grep -q 'STS' assets/assessment-smart.js
          ! grep -q 'STS' assets/assessment-bab-matrix.js
          ! grep -q 'STS' assets/assessment-rekap-smart.js
          echo "Assessment menu contract: OK (no STS)"
      - name: Assessment curriculum integrity
        shell: bash
        run: |
          set -e
          grep -q 'Harmoni dalam Ekosistem' assets/curriculum-data.js
          grep -q 'window.ADM_CURRICULUM' assets/curriculum-data.js
          grep -q 'function migrate' assets/assessment-auto.js
          grep -q 'repairMatrix' assets/assessment-auto.js
          grep -q 'repairRekap' assets/assessment-auto.js
          echo "Assessment curriculum binding: OK"
      - name: Single-source architecture audit
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          canonical=['assets/perangkat-master-state-super-v1.js','assets/perangkat-pembelajaran-super.js','assets/perangkat-katalog-super-v2.js','assets/perangkat-binding-super-v1.js','assets/perangkat-jp-super-v1.js','assets/perangkat-pertemuan-super-v1.js','assets/perangkat-audit-super-v1.js','assets/perangkat-kalender-adaptif-v1.js','assets/perangkat-master-enforcer-super-v1.js','assets/perangkat-master-engine-harden-v1.js','assets/perangkat-chain-audit-super-v2.js','assets/perangkat-auto-chain-super-v1.js','assets/perangkat-document-auto-bridge-super-v1.js','assets/perangkat-global-integrity-super-v1.js']
          legacy=['assets/perangkat-cp-atp-tp-super-v2.js','assets/perangkat-prota-promes-super-v2.js','assets/perangkat-rpm-super-v2.js','assets/perangkat-lkpd-asesmen-super-v1.js','assets/perangkat-lkpd-asesmen-super-v2.js']
          for x in canonical:
              n=len(re.findall(r'<script\s+src=["\']'+re.escape(x)+r'["\']\s*>\s*</script>',s,re.I))
              if n!=1: raise SystemExit(f'canonical loader invalid: {x}: {n}')
          for x in legacy:
              if re.search(r'<script\s+src=["\']'+re.escape(x)+r'["\']',s,re.I): raise SystemExit(f'legacy loader present: {x}')
          PY
          ! grep -q "const BOOK=" assets/ai-super-smart.js
          ! grep -q "const ROMBELS=" assets/ai-super-smart.js
          ! grep -q "const MAPEL=" assets/ai-super-smart.js
          grep -q 'GURU_SD_MASTER' assets/ai-generate-super.js
          grep -q 'BOOK_CATALOG' assets/ai-generate-super.js
          grep -q 'guru_sd_jp_allocation_super_v1' assets/perangkat-global-integrity-super-v1.js
          echo "AI/Perangkat single source: OK"
      - name: Complete menu and room audit
        shell: bash
        run: |
          set -e
          grep -q 'data-feature-custom="buku_administrasi"' assets/app-feature-complete-super-v1.js
          grep -q 'data-feature-custom="surat_resmi"' assets/app-feature-complete-super-v1.js
          grep -q 'data-feature-custom="dokumen_guru"' assets/app-feature-complete-super-v1.js
          grep -q 'GURU_SD_FEATURE_COMPLETE' assets/app-feature-complete-super-v1.js
          grep -q 'soal_sumatif' assets/app-feature-complete-super-v1.js
          grep -q 'kisi_kisi' assets/app-feature-complete-super-v1.js
          grep -q 'rubrik' assets/app-feature-complete-super-v1.js
          grep -q 'ADM_ROOM_LAYOUT' assets/app-room-layout-super-v1.js
          grep -q 'Dashboard' assets/app-room-layout-super-v1.js
          grep -q 'app-room-layout-super-v1.js?v=4' assets/ui-feedback.js
          grep -q 'curriculum-complete-super-v1.js?v=1' assets/ui-feedback.js
          echo "Menu/room workspace + curriculum loader contract: OK"
      - name: Master chain and exact JP audit
        shell: bash
        run: |
          set -e
          grep -q "const TYPES=\['CP','ATP','TP','PROTA','PROMES','RPM','LKPD','ASESMEN'\]" assets/perangkat-auto-chain-super-v1.js
          grep -q "function tpList(s){return s.tp}" assets/perangkat-pembelajaran-super.js
          grep -q 'const base=Math.floor(total/n),rem=total%n' assets/perangkat-pembelajaran-super.js
          grep -q 'BAB ID' assets/perangkat-pembelajaran-super.js
          grep -q "source:'GURU_SD_MASTER'" assets/perangkat-global-integrity-super-v1.js
          echo "Master chain + exact JP contract: OK"
      - name: Curriculum coverage sanity audit
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('assets/curriculum-data.js').read_text(encoding='utf-8')
          x=Path('assets/curriculum-complete-super-v1.js').read_text(encoding='utf-8')
          required=['Bahasa Indonesia','Matematika','IPAS','Pendidikan Pancasila','PJOK','Seni Rupa','Seni Musik','Seni Tari','Seni Teater']
          for m in required:
              if not re.search(r'"'+re.escape(m)+r'"\s*:',s): raise SystemExit('missing curriculum mapel: '+m)
          for m in ['Bahasa Inggris','Pendidikan Agama dan Budi Pekerti']:
              if not re.search(r"put\('"+re.escape(m)+r"'",x): raise SystemExit('missing canonical completion: '+m)
          for g in range(1,7):
              if not re.search(r'\n'+str(g)+r':\{',x): raise SystemExit('missing grade extension: '+str(g))
          print('Canonical curriculum base + completion covers all 11 app mapel and grades I-VI.')
          PY
          echo "Curriculum coverage sanity: OK"
      - name: Source protection audit
        shell: bash
        run: |
          set -e
          git diff --exit-code -- index.js || true
          test -f index.js
          grep -q 'D1' index.js || true
          echo "Source protection: index.js retained; no audit step writes D1/student data"
