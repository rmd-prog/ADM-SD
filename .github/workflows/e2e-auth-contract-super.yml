name: E2E Auth Contract SUPER
on:
  push:
    branches: ["feat-perangkat-pembelajaran-super-2026-09-10"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adm-sd-e2e-auth-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Check Worker auth boundary
        run: |
          code=$(curl -sS -o /tmp/api.json -w '%{http_code}' https://adm-sd.adm-sd.workers.dev/api/guru)
          test "$code" = "401" || test "$code" = "403"
          echo "Unauthenticated /api/guru => HTTP $code"
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start local site
        run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/adm-server.log 2>&1 &
      - name: Authenticated E2E contract
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:390,height:844},isMobile:true});
            const api='https://adm-sd.adm-sd.workers.dev/api';
            const calls=[];
            await p.route(api+'/**',async r=>{
              const u=new URL(r.request().url()), path=u.pathname.replace('/api','');
              const auth=r.request().headers().authorization||'';
              calls.push({path,method:r.request().method(),auth});
              const data=path.includes('login')?{ok:true,token:'e2e-token',user:{id:'e2e-guru',nama:'Guru E2E',nip:'E2E',role:'guru',rombel:'V',activeRombel:'V',mapel:['IPAS','Bahasa Indonesia']}}:path==='/siswa'||path==='/students'?{ok:true,data:[{id:'e2e-1',nama:'Siswa E2E',rombel:'V'}]}:{ok:true,data:[]};
              await r.fulfill({status:200,contentType:'application/json',body:JSON.stringify(data)});
            });
            const resp=await p.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle',timeout:30000});
            if(!resp?.ok())throw Error('index gagal dimuat');
            await p.waitForTimeout(2500);
            const shell=await p.evaluate(()=>({login:!!document.querySelector('.login'),app:!!document.querySelector('#app'),inputs:document.querySelectorAll('.login input').length,buttons:document.querySelectorAll('.login button').length,master:!!window.GURU_SD_MASTER,chain:!!window.GURU_SD_AUTO_CHAIN,engine:!!window.GURU_SD_PERANGKAT_ENGINE,room:!!window.ADM_ROOM_LAYOUT}));
            if(!shell.login||!shell.app||shell.inputs<2)throw Error('shell/login contract gagal: '+JSON.stringify(shell));
            const loginMock=await p.evaluate(async()=>{const r=await fetch('https://adm-sd.adm-sd.workers.dev/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({nip:'E2E',password:'E2E'})});return r.json()});
            if(!loginMock.ok||loginMock.token!=='e2e-token')throw Error('login contract gagal: '+JSON.stringify(loginMock));
            await p.evaluate(()=>{localStorage.setItem('siAuthToken','e2e-token');localStorage.setItem('siLogin',JSON.stringify({user:{id:'e2e-guru',nama:'Guru E2E',nip:'E2E',role:'guru',rombel:'V',activeRombel:'V',mapel:['IPAS','Bahasa Indonesia']}}));document.querySelector('.login')?.style.setProperty('display','none');document.querySelector('#app')?.style.setProperty('display','block')});
            await p.evaluate(()=>window.GURU_SD_MASTER.set({rombel:'V',mapel:'IPAS',babNo:2,material:'Harmoni dalam Ekosistem',semester:'1',jp:4,dpl:['mindful','meaningful','joyful'],modelPembelajaran:'Problem Based Learning'}));
            const state=await p.evaluate(()=>{const m=window.GURU_SD_MASTER.get();const chain=window.GURU_SD_AUTO_CHAIN.run();return {m,chainTypes:Object.keys(chain||{}),auth:localStorage.getItem('siAuthToken')};});
            if(state.auth!=='e2e-token')throw Error('token session gagal');
            if(state.m.material!=='Harmoni dalam Ekosistem'||state.m.rombel!=='V'||state.m.mapel!=='IPAS')throw Error('Master context gagal: '+JSON.stringify(state.m));
            if(!state.chainTypes.length)throw Error('auto-chain tidak menghasilkan dokumen');
            const alloc=await p.evaluate(()=>window.GURU_SD_PERANGKAT_ENGINE.allocate({jp:2,tp:[{no:1,text:'a'},{no:2,text:'b'},{no:3,text:'c'},{no:4,text:'d'}]}));
            if(alloc.reduce((s,x)=>s+x.jp,0)!==2||!alloc.some(x=>x.jp===0))throw Error('alokasi JP rusak: '+JSON.stringify(alloc));
            await p.evaluate(()=>window.ADM_ROOM_LAYOUT.activate({dataset:{page:'students'},innerText:'Daftar Siswa',textContent:'Daftar Siswa'}));
            const room=await p.evaluate(()=>document.querySelector('#students')?.dataset.admRoom||'');
            if(room!=='students:list')throw Error('room Data Siswa gagal: '+room);
            const protectedCall=await p.evaluate(async()=>{const r=await fetch('https://adm-sd.adm-sd.workers.dev/api/guru',{headers:{Authorization:'Bearer e2e-token'}});return {status:r.status,data:await r.json()}});
            if(protectedCall.status!==200||!protectedCall.data?.ok)throw Error('authorized API contract gagal: '+JSON.stringify(protectedCall));
            if(!calls.some(x=>x.path==='/login'&&x.method==='POST'))throw Error('login request tidak teramati');
            if(!calls.some(x=>x.auth==='Bearer e2e-token'))throw Error('Bearer authorization tidak pernah terkirim');
            console.log('AUTH E2E CONTRACT OK',JSON.stringify({shell,state,room,calls:calls.length,protectedCall}));
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
