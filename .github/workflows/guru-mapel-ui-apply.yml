name: Apply Guru Mapel stability patch
on:
  push:
    paths:
      - '.github/guru-mapel-ui-trigger.txt'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          # Keep exportHtml valid JavaScript: literal newline must be escaped inside the quoted string.
          bad='<script src="guru-mapel-ui.js"><\\/script>\n</body></html>'
          good='<script src="guru-mapel-ui.js"><\\/script>\\n</body></html>'
          s=s.replace(bad,good)
          old="""    const rombel=(t.role==='guru'||t.role==='guru_mapel')?normalizeRombel(t.rombel||t.kelas):'';
    const sp=await apiGet('/siswa',rombel?{rombel}:{});
    if(Array.isArray(sp.data)) db.students=sp.data.map(normalizeStudentRow).filter(s=>s.name);
    const classes=t.role==='admin'?ROMBELS:[rombel];"""
          new="""    const ownRombel=normalizeRombel(t.rombel||t.kelas||'');
    const rombel=t.role==='guru'?ownRombel:'';
    const classes=(t.role==='admin'||t.role==='guru_mapel')?ROMBELS:[rombel];
    if(t.role==='admin'){
      const sp=await apiGet('/siswa',{});
      if(Array.isArray(sp.data)) db.students=sp.data.map(normalizeStudentRow).filter(s=>s.name);
    }else if(t.role==='guru_mapel'){
      const all=[];
      for(const k of classes){try{const sp=await apiGet('/siswa',{rombel:k});if(Array.isArray(sp.data))all.push(...sp.data)}catch(e){console.warn('Sinkron siswa kelas '+k,e)}}
      const seen=new Map();all.map(normalizeStudentRow).filter(s=>s.name).forEach(s=>seen.set(String(s.nis||s.name)+'|'+s.rombel,s));db.students=[...seen.values()];
    }else{
      const sp=await apiGet('/siswa',rombel?{rombel}:{});
      if(Array.isArray(sp.data)) db.students=sp.data.map(normalizeStudentRow).filter(s=>s.name);
    }"""
          if old not in s: raise SystemExit('ABORT: syncRemoteData anchor not found')
          s=s.replace(old,new,1)
          s=s.replace("const rp=await apiGet('/rpm',{rombel:k});","const rp=await apiGet('/rpm',{rombel:k,mapel:t.role==='guru_mapel'?t.mapel:''});",1)
          p.write_text(s,encoding='utf-8')
          w=Path('src/index.js'); x=w.read_text(encoding='utf-8')
          old='user.role !== "admin" && requested && requested !== own'; new='user.role !== "admin" && requested && !canAccessRombel(user, requested)';
          if old in x:x=x.replace(old,new)
          w.write_text(x,encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
          node --check src/index.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html src/index.js
          git commit -m 'fix: Guru Mapel all-rombel sync [skip ci]' || exit 0
          git push origin main
