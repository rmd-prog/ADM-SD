name: Runtime Smoke SUPER
on:
  push:
    branches: ["feat-perangkat-pembelajaran-super-2026-09-10"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adm-sd-runtime-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Validate every local JavaScript file
        run: |
          find assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check guru-mapel-ui.js
      - name: Validate inline scripts from production source
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.on=False; self.buf=[]; self.typ=''; self.items=[]
              def handle_starttag(self,t,a):
                  if t.lower()=='script': self.on=True; self.buf=[]; self.typ=dict(a).get('type','').lower()
              def handle_data(self,d):
                  if self.on:self.buf.append(d)
              def handle_endtag(self,t):
                  if t.lower()=='script' and self.on:
                      x=''.join(self.buf)
                      if x.strip() and self.typ not in ('application/ld+json','application/json','importmap'): self.items.append(x)
                      self.on=False
          p=P();p.feed(Path('index.html').read_text(encoding='utf-8')); Path('/tmp/inline').mkdir(exist_ok=True)
          for i,t in enumerate(p.items,1):Path(f'/tmp/inline/{i}.js').write_text(t,encoding='utf-8')
          print('inline scripts:',len(p.items))
          PY
          for f in /tmp/inline/*.js; do node --check "$f"; done
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start local site
        run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/adm-server.log 2>&1 &
      - name: Browser smoke audit
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true});
            const errors=[];
            page.on('pageerror',e=>errors.push('pageerror: '+e.message));
            page.on('console',m=>{if(m.type()==='error'&&!/status of 401/i.test(m.text()))errors.push('console: '+m.text())});
            page.on('requestfailed',r=>errors.push('requestfailed: '+r.url()+' '+(r.failure()?.errorText||'')));
            const response=await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle',timeout:30000});
            if(!response?.ok())throw new Error('index.html did not load');
            await page.waitForTimeout(2500);
            const result=await page.evaluate(()=>({login:!!document.querySelector('.login'),app:!!document.querySelector('#app'),nav:document.querySelectorAll('.navbtn').length,pages:document.querySelectorAll('.page').length,feature:!!window.GURU_SD_FEATURE_COMPLETE,master:!!window.GURU_SD_MASTER,chain:!!window.GURU_SD_AUTO_CHAIN,room:!!window.ADM_ROOM_LAYOUT,engine:!!window.GURU_SD_PERANGKAT_ENGINE,runtime:window.GURU_SD_RUNTIME_INTEGRITY||null}));
            if(!result.login||!result.app||result.nav<1||result.pages<1)throw new Error('app shell missing: '+JSON.stringify(result));
            if(!result.feature||!result.master||!result.chain||!result.room||!result.engine)throw new Error('critical modules missing: '+JSON.stringify(result));
            if(result.runtime&&!result.runtime.ready)throw new Error('runtime integrity failed: '+JSON.stringify(result.runtime));
            await page.evaluate(()=>{document.querySelector('.login')?.style.setProperty('display','none');document.querySelector('#app')?.style.setProperty('display','block')});
            const aliases={report:'penilaianPro',scores:'penilaianPro'};
            const targets=await page.locator('.navbtn[data-page]').evaluateAll(bs=>[...new Set(bs.map(b=>b.dataset.page).filter(Boolean))]);
            for(const t of targets){await page.evaluate(x=>{const bs=[...document.querySelectorAll('.navbtn[data-page]')].filter(b=>b.dataset.page===x);const b=bs.find(y=>y.offsetParent!==null)||bs[0];b?.click()},t);await page.waitForTimeout(120);const a=await page.locator('.page.active').first().getAttribute('id');if(a!==(aliases[t]||t))throw new Error('navigation failed: '+t+' -> '+a)}
            const fake=(page,label)=>({dataset:{page},innerText:label,textContent:label});
            await page.evaluate(()=>window.ADM_ROOM_LAYOUT.clearRoom());
            await page.evaluate(f=>window.ADM_ROOM_LAYOUT.activate(f),fake('scores','Input Nilai')); await page.waitForTimeout(120);
            const input=await page.evaluate(()=>({active:!!document.querySelector('#penilaianPro')?.classList.contains('active'),room:document.querySelector('#penilaianPro')?.dataset.admRoom||''}));
            await page.evaluate(f=>window.ADM_ROOM_LAYOUT.activate(f),fake('scores','Rekap Nilai')); await page.waitForTimeout(120);
            const rekap=await page.evaluate(()=>({active:!!document.querySelector('#penilaianPro')?.classList.contains('active'),room:document.querySelector('#penilaianPro')?.dataset.admRoom||''}));
            await page.evaluate(f=>window.ADM_ROOM_LAYOUT.activate(f),fake('students','Daftar Siswa'));
            const students=await page.evaluate(()=>({active:!!document.querySelector('#students')?.classList.contains('active'),room:document.querySelector('#students')?.dataset.admRoom||''}));
            await page.evaluate(f=>window.ADM_ROOM_LAYOUT.activate(f),fake('aiGenerate','Generate Soal'));
            const ai=await page.evaluate(()=>({active:!!document.querySelector('#aiGenerate')?.classList.contains('active'),room:document.querySelector('#aiGenerate')?.dataset.admRoom||''}));
            if(!input.active||!rekap.active||input.room!==''||rekap.room!=='')throw new Error('Assessment room routing failed: '+JSON.stringify({input,rekap}));
            if(!students.active||students.room!=='students:list')throw new Error('Data Siswa room failed: '+JSON.stringify(students));
            if(!ai.active||!/^(ai:|custom:)/.test(ai.room))throw new Error('AI room failed: '+JSON.stringify(ai));
            const dashboard=await page.evaluate(()=>{const b=[...document.querySelectorAll('.navbtn[data-page]')].find(x=>x.dataset.page==='dashboard');b?.click();const p=document.querySelector('.page.active');const text=(p?.innerText||'').toLowerCase();return {id:p?.id||'',noise:/data siswa|ai generate|input nilai|rpm|lkpd/.test(text)};});
            if(dashboard.id!=='dashboard'||dashboard.noise)throw new Error('Dashboard room not clean: '+JSON.stringify(dashboard));
            const alloc=await page.evaluate(()=>window.GURU_SD_PERANGKAT_ENGINE.allocate({jp:2,tp:[{no:1,text:'a'},{no:2,text:'b'},{no:3,text:'c'},{no:4,text:'d'}]}));
            if(alloc.reduce((a,x)=>a+x.jp,0)!==2||!alloc.some(x=>x.jp===0))throw new Error('exact JP contract failed: '+JSON.stringify(alloc));
            if(errors.length)throw new Error(errors.join('\n'));
            console.log('runtime smoke OK:',JSON.stringify({targets:targets.length,rooms:{input,rekap,students,ai},dashboard,allocation:alloc.map(x=>x.jp)}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
