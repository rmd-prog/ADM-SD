name: Runtime Smoke SUPER
on:
  push:
    branches: ["feat-perangkat-pembelajaran-super-2026-09-10"]
  workflow_dispatch:
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate critical JavaScript
        run: |
          for f in \
            assets/ui-feedback.js \
            assets/app-global-integrity-super-v1.js \
            assets/app-feature-complete-super-v1.js \
            assets/app-runtime-integrity-super-v1.js \
            assets/perangkat-master-state-super-v1.js \
            assets/perangkat-pembelajaran-super.js \
            assets/perangkat-auto-chain-super-v1.js \
            assets/perangkat-document-auto-bridge-super-v1.js \
            assets/assessment-auto.js; do
            node --check "$f"
          done
      - name: Validate inline scripts
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.active=None; self.buf=[]; self.items=[]
              def handle_starttag(self,tag,attrs):
                  if tag.lower()=='script':
                      a=dict(attrs); self.active=a.get('type','').lower(); self.buf=[]
              def handle_data(self,data):
                  if self.active is not None:self.buf.append(data)
              def handle_endtag(self,tag):
                  if tag.lower()=='script' and self.active is not None:
                      typ=self.active; text=''.join(self.buf)
                      if text.strip() and typ not in ('application/ld+json','application/json','importmap'):
                          self.items.append(text)
                      self.active=None; self.buf=[]
          p=P();p.feed(Path('index.html').read_text(encoding='utf-8'))
          Path('/tmp/inline').mkdir(exist_ok=True)
          for i,text in enumerate(p.items,1): Path(f'/tmp/inline/{i}.js').write_text(text,encoding='utf-8')
          print('inline scripts:',len(p.items))
          PY
          for f in /tmp/inline/*.js; do node --check "$f"; done
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start local site
        run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/adm-server.log 2>&1 &
      - name: Browser smoke audit
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true});
            const errors=[];
            page.on('pageerror',e=>errors.push('pageerror: '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
            page.on('requestfailed',r=>errors.push('requestfailed: '+r.url()+' '+(r.failure()?.errorText||'')));
            const response=await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle',timeout:30000});
            if(!response || !response.ok()) throw new Error('index.html did not load');
            await page.waitForTimeout(2500);
            const result=await page.evaluate(()=>({title:document.title,login:!!document.querySelector('#login,.login'),app:!!document.querySelector('#app'),nav:document.querySelectorAll('.navbtn').length,pages:document.querySelectorAll('.page').length,runtime:window.GURU_SD_RUNTIME_INTEGRITY||null,feature:!!window.GURU_SD_FEATURE_COMPLETE,master:!!window.GURU_SD_MASTER,chain:!!window.GURU_SD_AUTO_CHAIN}));
            if(!result.login||!result.app||result.nav<1||result.pages<1)throw new Error('critical app shell missing: '+JSON.stringify(result));
            if(!result.feature||!result.master||!result.chain)throw new Error('critical runtime modules missing: '+JSON.stringify(result));
            if(result.runtime&&!result.runtime.ready)throw new Error('runtime integrity reported failed checks: '+JSON.stringify(result.runtime));
            if(errors.length)throw new Error(errors.join('\n'));
            console.log(JSON.stringify(result,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE