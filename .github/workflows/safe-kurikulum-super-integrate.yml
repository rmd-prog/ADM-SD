name: Safe Kurikulum Super Schedule Integrate
on:
  push:
    branches: [main]
    paths:
      - 'assets/kurikulum-super-schedule.js'
      - 'assets/kurikulum-super-schedule-multiday.js'
      - '.github/workflows/safe-kurikulum-super-integrate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Safely load schedule engines
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="assets/kurikulum-super-schedule.js"></script>'
          multi='<script src="assets/kurikulum-super-schedule-multiday.js"></script>'
          if tag not in s:
              marker='<script src="assets/ai-super-smart.js"></script>'
              if marker in s: s=s.replace(marker, marker+'\n'+tag, 1)
              else: s=s.replace('</body>', tag+'\n</body>', 1)
          if multi not in s:
              if tag in s: s=s.replace(tag, tag+'\n'+multi, 1)
              else: s=s.replace('</body>', multi+'\n</body>', 1)
          p.write_text(s,encoding='utf-8')
          if s.count(tag)!=1: raise SystemExit('Expected exactly one schedule loader')
          if s.count(multi)!=1: raise SystemExit('Expected exactly one multi-day loader')
          if s.index(multi)<s.index(tag): raise SystemExit('Multi-day loader order invalid')
          if '</script>' not in s: raise SystemExit('HTML script boundary missing')
          PY
      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'ci: load multi-day Kurikulum Super schedule layer'
          git push
