name: Fix Login
on:
  push:
    paths:
      - '.github/login-fix-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch login flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="""async function finishLogin(t){
  currentTeacher=t;
  document.body.classList.remove('v10-login');
  document.body.classList.add('v10-logged-in');
  window.scrollTo(0,0);document.documentElement.scrollTop=0;document.body.scrollTop=0;
  localStorage.setItem('siLogin',JSON.stringify(t));
  if(t.token) localStorage.setItem('siAuthToken',t.token); else localStorage.removeItem('siAuthToken');
  updateTeacherProfile(t);
  id('loginScreen').style.display='none';id('app').style.display='block';window.scrollTo({top:0,left:0,behavior:'auto'});document.documentElement.scrollTop=0;document.body.scrollTop=0;id('loginError').style.display='none';
  applyClassLock();syncRoleMenu();initAIGenerator();renderBookBasisStatus();renderStats();renderStudents();renderScores();renderReport();showPage((t.role==='guru'||t.role==='guru_mapel')?'students':'dashboard');
  // Sinkronisasi D1 berjalan di belakang layar agar login tidak tertahan.
  syncRemoteData(t).catch(err=>console.warn('Sinkronisasi D1 gagal:',err));
  setTimeout(()=>showWelcome(t),220);
}"""
          new="""async function finishLogin(t){
  currentTeacher=t;
  document.body.classList.remove('v10-login');
  document.body.classList.add('v10-logged-in');
  localStorage.setItem('siLogin',JSON.stringify(t));
  if(t.token) localStorage.setItem('siAuthToken',t.token); else localStorage.removeItem('siAuthToken');
  // Tampilkan aplikasi terlebih dahulu. Inisialisasi fitur tambahan tidak boleh membatalkan login.
  id('loginScreen').style.display='none';
  id('app').style.display='block';
  id('loginError').style.display='none';
  window.scrollTo(0,0);document.documentElement.scrollTop=0;document.body.scrollTop=0;
  try{updateTeacherProfile(t)}catch(e){console.warn('Profil guru gagal dimuat:',e)}
  try{applyClassLock();syncRoleMenu()}catch(e){console.warn('Role menu gagal dimuat:',e)}
  try{initAIGenerator()}catch(e){console.warn('AI init gagal:',e)}
  try{renderBookBasisStatus()}catch(e){console.warn('Basis buku gagal dimuat:',e)}
  try{renderStats();renderStudents();renderScores();renderReport()}catch(e){console.warn('Render data awal gagal:',e)}
  try{showPage((t.role==='guru'||t.role==='guru_mapel')?'students':'dashboard')}catch(e){console.warn('Halaman awal gagal dibuka:',e)}
  syncRemoteData(t).catch(err=>console.warn('Sinkronisasi D1 gagal:',err));
  setTimeout(()=>showWelcome(t),220);
}"""
          if old not in s:
              raise SystemExit('target finishLogin tidak ditemukan')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node -e "const fs=require('fs');const s=fs.readFileSync('index.html','utf8');const m=s.match(/<script>([\\s\\S]*?)<\\/script>/g);if(!m)process.exit(1);console.log('scripts',m.length)"
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: prevent noncritical init errors from blocking login [skip ci]'
          git push origin main
