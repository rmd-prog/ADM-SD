name: one-time auto chain UI patch
on:
  push:
    branches: [feat-perangkat-pembelajaran-super-2026-09-10]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Route document buttons to AUTO CHAIN
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=s
          marker='function renderStudents(){'
          start=s.index('function bindDocumentTools(){')
          end=s.index(marker,start)
          new=r'''function generateDocAuto(type){
            const master=window.GURU_SD_MASTER?.get?.();
            if(!master?.rombel||!master?.mapel||!master?.material){alert('Pilih kelas, mapel, BAB/Materi terlebih dahulu.');return false}
            const chain=window.GURU_SD_AUTO_CHAIN?.run?.()||window.GURU_SD_AUTO_CHAIN?.get?.();
            if(!chain||chain.material!==master.material||chain.babId!==master.babId){alert('Rantai Perangkat SUPER belum siap untuk BAB '+master.material+'. Coba pilih BAB sekali lagi.');return false}
            const meta=docMeta(type),key=String(type).toUpperCase(),text=String(chain.docs?.[key]||'').trim();
            if(!text){alert('Dokumen '+meta[0]+' belum tersedia pada AUTO CHAIN.');return false}
            id(meta[1]).value=normalizeRombel(master.rombel);id(meta[2]).value=String(master.mapel);id(meta[3]).value=text;
            setDocPreview(type,'✓ '+meta[0]+' otomatis dibuat dari Master BAB '+master.material+' • '+master.jp+' JP.');
            return true;
          }
          function ensureDoc(type){const meta=docMeta(type);if(!String(id(meta[3]).value||'').trim())generateDocAuto(type);return docPayload(type)}
          function bindDocumentTools(){['cp','tp','atp','prota','prosem'].forEach(t=>{const C=t[0].toUpperCase()+t.slice(1);id('generate'+C).onclick=()=>generateDocAuto(t);id('pdf'+C).onclick=()=>exportPDF(t);id('word'+C).onclick=()=>exportWord(t);id('excel'+C).onclick=()=>exportExcel(t);id('print'+C).onclick=()=>printDoc(t);id(t+'ResetContext').onclick=()=>id(t+'Context').value=''});id('generateRpm').onclick=()=>generateDocAuto('rpm');id('pdfRpm').onclick=()=>exportPDF('rpm');id('wordRpm').onclick=()=>exportWord('rpm');id('excelRpm').onclick=()=>exportExcel('rpm');id('printRpm').onclick=()=>printDoc('rpm');id('rpmResetContext').onclick=()=>id('rpmContext').value='';['cp','tp','atp','prota','prosem'].forEach(t=>setDocPreview(t));setDocPreview('rpm')}

'''
          s=s[:start]+new+s[end:]
          if s==old: raise SystemExit('no change')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q "function generateDocAuto(type)" index.html
          grep -q "generateDocAuto(t)" index.html
          grep -q "window.GURU_SD_AUTO_CHAIN" index.html
          test "$(grep -o "function bindDocumentTools()" index.html | wc -l)" -eq 1
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: route document buttons to deterministic auto chain"
          git push
          rm -f .github/workflows/one-time-auto-chain-ui-patch.yml
          git add .github/workflows/one-time-auto-chain-ui-patch.yml
          git commit -m "chore: remove one-time auto chain UI patch workflow"
          git push
