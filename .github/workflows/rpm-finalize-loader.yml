name: RPM Finalize Loader

on:
  push:
    branches: [main]
    paths:
      - 'assets/rpm-final-override.js'
      - 'index.html'
      - '.github/workflows/rpm-finalize-loader.yml'

permissions:
  contents: write

jobs:
  ensure-rpm-loader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure RPM final override is loaded
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<script src="assets/rpm-final-override.js"></script>'
          anchor='<script src="assets/auto-doc-super.js"></script>'
          if marker not in s:
              if anchor not in s:
                  raise SystemExit('RPM loader anchor not found')
              s=s.replace(anchor, anchor+'\n'+marker, 1)
              p.write_text(s, encoding='utf-8')
              print('RPM final override inserted.')
          else:
              print('RPM final override already loaded.')

      - name: Commit loader change
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: load RPM final override'
          git push
