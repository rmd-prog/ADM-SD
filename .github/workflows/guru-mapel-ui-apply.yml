name: Apply Guru Mapel UI and account API
on:
  push:
    paths:
      - '.github/guru-mapel-ui-trigger.txt'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Worker and frontend
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          w=Path('src/index.js'); s=w.read_text(encoding='utf-8')
          marker='''      // NILAI\n      if (url.pathname === "/api/nilai" && request.method === "GET") {'''
          endpoint='''      // CREATE GURU MAPEL — administrator only\n      if (url.pathname === "/api/guru" && request.method === "POST") {\n        if (user.role !== "admin") return json({ ok:false, message:"Khusus administrator." }, 403);\n        const body = await request.json();\n        const nama = String(body.nama || "").trim(); const username = String(body.username || "").trim(); const password = String(body.password || "");\n        const role = String(body.role || "guru_mapel").trim(); const rombel = cleanRombel(body.rombel || body.kelas || ""); const mapel = normalizeMapel(body.mapel || "");\n        if (!nama || !username || !password || !rombel || !mapel) return json({ok:false,message:"Nama, username, password, mapel, dan rombel wajib diisi."},400);\n        if (role !== "guru_mapel") return json({ok:false,message:"Endpoint ini khusus akun Guru Mapel."},400);\n        if (!["Pendidikan Agama dan Budi Pekerti","PJOK","Bahasa Inggris"].includes(mapel)) return json({ok:false,message:"Mata pelajaran Guru Mapel tidak valid."},400);\n        let c=await columns(env,"users"); if(!c.has("mapel")){try{await env.DB.prepare("ALTER TABLE users ADD COLUMN mapel TEXT").run()}catch{} c=await columns(env,"users")}\n        const exists=await env.DB.prepare("SELECT id FROM users WHERE username=?").bind(username).first(); if(exists)return json({ok:false,message:"Username sudah digunakan."},409);\n        const fields=[],binds=[]; const add=(n,v)=>{if(c.has(n)){fields.push(n);binds.push(v)}}; add("username",username);add("password",password);add("nama",nama);add("role",role);add("kelas",rombel);add("rombel",rombel);add("mapel",mapel);\n        const marks=fields.map(()=>"?").join(","); await env.DB.prepare(`INSERT INTO users (${fields.join(",")}) VALUES (${marks})`).bind(...binds).run();\n        const created=await env.DB.prepare("SELECT id,username,nama,role,kelas,rombel,mapel FROM users WHERE username=?").bind(username).first(); return json({ok:true,message:"Akun Guru Mapel berhasil dibuat.",data:created},201);\n      }\n\n'''
          if endpoint not in s:
              if marker not in s: raise SystemExit('Worker marker not found')
              s=s.replace(marker,endpoint+marker,1)
          # Backend subject enforcement for perangkat and RPM reads.
          a='''        const jenis = url.searchParams.get("jenis") || "";\n        const mapel = url.searchParams.get("mapel") || "";\n        if (user.role !== "admin" && requested && requested !== own) {'''; b='''        const jenis = url.searchParams.get("jenis") || "";\n        const mapel = url.searchParams.get("mapel") || "";\n        if (!subjectAllowed(user, mapel)) return json({ok:false,message:"Akses mata pelajaran ditolak."},403);\n        if (user.role !== "admin" && requested && requested !== own) {''';
          if a in s:s=s.replace(a,b,1)
          a='''        const mapel = url.searchParams.get("mapel") || "";\n        if (user.role !== "admin" && requested && requested !== own) {\n          return json({ ok: false, message: "Akses rombel ditolak." }, 403);\n        }\n        const c = await columns(env, "rpm");'''; b='''        const mapel = url.searchParams.get("mapel") || "";\n        if (!subjectAllowed(user, mapel)) return json({ok:false,message:"Akses mata pelajaran ditolak."},403);\n        if (user.role !== "admin" && requested && requested !== own) {\n          return json({ ok: false, message: "Akses rombel ditolak." }, 403);\n        }\n        const c = await columns(env, "rpm");''';
          if a in s:s=s.replace(a,b,1)
          w.write_text(s,encoding='utf-8')

          p=Path('index.html'); h=p.read_text(encoding='utf-8')
          # Preserve Guru Mapel role and subject from login response.
          old="""  const roleRaw=raw.role||raw.peran||raw.user_role||raw.type||'';\n  const role=String(roleRaw).toLowerCase().includes('admin')?'admin':'guru';\n  const kelas=normalizeRombel(raw.rombel??raw.kelas??raw.class??raw.class_id??raw.kelas_id??raw.assigned_class??'');\n  return {username:String(raw.username??raw.user??username),name:String(raw.name??raw.nama??raw.full_name??raw.nama_guru??username),role,kelas,rombel:kelas,token:payload?.token||payload?.access_token||raw.token||raw.access_token||''};"""
          new="""  const roleRaw=String(raw.role||raw.peran||raw.user_role||raw.type||'').toLowerCase();\n  const role=roleRaw.includes('admin')?'admin':(roleRaw.includes('guru_mapel')||roleRaw.includes('guru mapel')?'guru_mapel':'guru');\n  const kelas=normalizeRombel(raw.rombel??raw.kelas??raw.class??raw.class_id??raw.kelas_id??raw.assigned_class??'');\n  return {username:String(raw.username??raw.user??username),name:String(raw.name??raw.nama??raw.full_name??raw.nama_guru??username),role,kelas,rombel:kelas,mapel:String(raw.mapel||''),token:payload?.token||payload?.access_token||raw.token||raw.access_token||''};"""
          if old in h:h=h.replace(old,new,1)
          h=h.replace("function isGuruKelas(){return !!currentTeacher && currentTeacher.role==='guru'}\nfunction allowedClass(){return isGuruKelas()?normalizeRombel(currentTeacher.rombel||currentTeacher.kelas||''):''}","function isGuruKelas(){return !!currentTeacher && currentTeacher.role==='guru'}\nfunction isGuruMapel(){return !!currentTeacher && currentTeacher.role==='guru_mapel'}\nfunction allowedClass(){return (isGuruKelas()||isGuruMapel())?normalizeRombel(currentTeacher.rombel||currentTeacher.kelas||''):''}\nfunction allowedMapel(){return isGuruMapel()?String(currentTeacher.mapel||''):''}",1)
          h=h.replace("function syncRoleMenu(){const admin=!isGuruKelas();","function syncRoleMenu(){const admin=!isGuruKelas()&&!isGuruMapel();",1)
          h=h.replace("if(isGuruKelas()&&['teachers','importScores','backup'].includes(p))p='dashboard';","if((isGuruKelas()||isGuruMapel())&&['teachers','importScores','backup'].includes(p))p='dashboard';",1)
          h=h.replace("showPage(t.role==='guru'?'students':'dashboard');","showPage((t.role==='guru'||t.role==='guru_mapel')?'students':'dashboard');",1)
          h=h.replace("const rombel=t.role==='guru'?normalizeRombel(t.rombel||t.kelas):'';","const rombel=(t.role==='guru'||t.role==='guru_mapel')?normalizeRombel(t.rombel||t.kelas):'';",1)
          h=h.replace("apiGet('/nilai',{rombel:k,semester:1})","apiGet('/nilai',{rombel:k,semester:1,mapel:t.role==='guru_mapel'?t.mapel:''})",1)
          h=h.replace("apiGet('/perangkat',{rombel:k})","apiGet('/perangkat',{rombel:k,mapel:t.role==='guru_mapel'?t.mapel:''})",1)
          old="""function fillMapels(){\n['rpmMapel','scoreMapel','cpMapel','tpMapel','atpMapel','protaMapel','prosemMapel'].forEach(k=>id(k).innerHTML=MAPEL.map(x=>'<option>'+esc(x)+'</option>').join(''));\n['sClass','scoreKelas','rpmKelas','cpKelas','tpKelas','atpKelas','protaKelas','prosemKelas','tClass'].forEach(k=>id(k).innerHTML=ROMBELS.map(x=>'<option value=\"'+x+'\">'+x+'</option>').join(''));\nupdateBab(); loadDocFields();\n}"""
          new="""function fillMapels(){\nconst maps=isGuruMapel()?[allowedMapel()]:MAPEL;\n['rpmMapel','scoreMapel','cpMapel','tpMapel','atpMapel','protaMapel','prosemMapel','aiMapel'].forEach(k=>{const e=id(k);if(e)e.innerHTML=maps.filter(Boolean).map(x=>'<option value=\"'+esc(x)+'\">'+esc(x)+'</option>').join('')});\n['sClass','scoreKelas','rpmKelas','cpKelas','tpKelas','atpKelas','protaKelas','prosemKelas','tClass'].forEach(k=>{const e=id(k);if(e)e.innerHTML=ROMBELS.map(x=>'<option value=\"'+x+'\">'+x+'</option>').join('')});\napplyClassLock();updateBab();loadDocFields();\n}"""
          if old in h:h=h.replace(old,new,1)
          p.write_text(h,encoding='utf-8')
          PY
          node --check src/index.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.js index.html guru-mapel-ui.js .github/guru-mapel-ui-trigger.txt
          git commit -m 'feat: finalize Guru Mapel role and subject restrictions [skip ci]'
          git push origin main
