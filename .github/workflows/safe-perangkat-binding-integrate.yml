name: Safe Perangkat Binding Integrate
on:
  push:
    branches: [feat-perangkat-pembelajaran-super-2026-09-10]
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Insert binding loader safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          loader='<script src="assets/perangkat-binding-super-v1.js"></script>'
          if loader in s:
              print('Binding loader already present'); raise SystemExit(0)
          anchor='<script src="assets/perangkat-katalog-super-v2.js"></script>'
          if anchor not in s:
              raise SystemExit('Katalog loader not found; refusing unsafe integration')
          s=s.replace(anchor,anchor+'\n'+loader,1)
          if s.count(loader)!=1: raise SystemExit('Invalid binding loader count')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          test "$(grep -o 'assets/perangkat-binding-super-v1.js' index.html | wc -l)" -eq 1
          test "$(grep -o 'assets/perangkat-katalog-super-v2.js' index.html | wc -l)" -eq 1
      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet -- index.html; then echo 'No integration changes'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'ci: load perangkat binding overlay'
          git push