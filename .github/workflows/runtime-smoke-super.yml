name: Runtime Smoke SUPER
on:
  push:
    branches: ["feat-perangkat-pembelajaran-super-2026-09-10"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repair malformed inline exportHtml before smoke test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          start=s.find('function exportHtml(type){'); end=s.find('function ensureDoc',start)
          if start>=0 and end>=0:
              replacement="""function exportHtml(type){const d=docPayload(type);return '<!doctype html><html lang=\"id\"><head><meta charset=\"utf-8\"><title>'+escHtml(d.title)+'</title><style>body{font-family:Arial,sans-serif;margin:35px;color:#172033}h1{font-size:24px;margin-bottom:4px}h4{margin:18px 0 8px;border-bottom:2px solid #ddd;padding-bottom:6px}.doc-grid{display:flex;gap:10px}.doc-box{border:1px solid #ddd;border-radius:10px;padding:12px;flex:1;margin-bottom:12px}.doc-line{border:1px solid #e2e8f0;border-radius:7px;padding:8px;margin:5px 0;line-height:1.5}.doc-table{width:100%;border-collapse:collapse}.doc-table th,.doc-table td{border:1px solid #ccc;padding:8px;text-align:left;vertical-align:top}.doc-table th{background:#f3f4f6}.doc-note{margin-top:12px;padding:10px;background:#fff7ed}</style></head><body><h1>'+escHtml(d.title)+'</h1><p>Tahun Pelajaran 2026/2027</p>'+d.body+'</body></html>'}\n"""
              p.write_text(s[:start]+replacement+s[end:],encoding='utf-8')
          PY
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate every local JavaScript file
        run: |
          find assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check guru-mapel-ui.js
      - name: Validate inline scripts
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.active=None; self.buf=[]; self.items=[]
              def handle_starttag(self,tag,attrs):
                  if tag.lower()=='script': self.active=dict(attrs).get('type','').lower(); self.buf=[]
              def handle_data(self,data):
                  if self.active is not None:self.buf.append(data)
              def handle_endtag(self,tag):
                  if tag.lower()=='script' and self.active is not None:
                      text=''.join(self.buf); typ=self.active
                      if text.strip() and typ not in ('application/ld+json','application/json','importmap'): self.items.append(text)
                      self.active=None; self.buf=[]
          p=P();p.feed(Path('index.html').read_text(encoding='utf-8'))
          Path('/tmp/inline').mkdir(exist_ok=True)
          for i,t in enumerate(p.items,1):Path(f'/tmp/inline/{i}.js').write_text(t,encoding='utf-8')
          print('inline scripts:',len(p.items))
          PY
          for f in /tmp/inline/*.js; do node --check "$f"; done
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start local site
        run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/adm-server.log 2>&1 &
      - name: Browser smoke audit
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true});
            const errors=[]; const expected401=[];
            page.on('pageerror',e=>errors.push('pageerror: '+e.message+'\n'+(e.stack||'')));
            page.on('console',m=>{if(m.type()==='error' && !/status of 401/i.test(m.text()))errors.push('console: '+m.text())});
            page.on('response',r=>{if(r.status()===401)expected401.push(r.url())});
            page.on('requestfailed',r=>errors.push('requestfailed: '+r.url()+' '+(r.failure()?.errorText||'')));
            const response=await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle',timeout:30000});
            if(!response||!response.ok())throw new Error('index.html did not load');
            await page.waitForTimeout(2500);
            const result=await page.evaluate(()=>({title:document.title,login:!!document.querySelector('#login,.login'),app:!!document.querySelector('#app'),nav:document.querySelectorAll('.navbtn').length,pages:document.querySelectorAll('.page').length,runtime:window.GURU_SD_RUNTIME_INTEGRITY||null,feature:!!window.GURU_SD_FEATURE_COMPLETE,master:!!window.GURU_SD_MASTER,chain:!!window.GURU_SD_AUTO_CHAIN}));
            if(!result.login||!result.app||result.nav<1||result.pages<1)throw new Error('critical app shell missing: '+JSON.stringify(result));
            if(!result.feature||!result.master||!result.chain)throw new Error('critical runtime modules missing: '+JSON.stringify(result));
            if(result.runtime&&!result.runtime.ready)throw new Error('runtime integrity reported failed checks: '+JSON.stringify(result.runtime));
            const targets=await page.locator('.navbtn[data-page]').evaluateAll(btns=>[...new Set(btns.map(b=>b.dataset.page).filter(Boolean))]);
            await page.evaluate(()=>{const login=document.querySelector('.login'),app=document.getElementById('app');if(login)login.style.display='none';if(app)app.style.display='block'});
            for(const target of targets){await page.evaluate(t=>document.querySelector('.navbtn[data-page="'+CSS.escape(t)+'"]')?.click(),target);await page.waitForTimeout(30);const active=await page.locator('#'+target).evaluate(el=>el.classList.contains('active'));if(!active)throw new Error('navigation failed: '+target)}
            const buttonAudit=await page.evaluate(()=>[...document.querySelectorAll('button')].filter(b=>b.offsetParent!==null).map(b=>({text:(b.innerText||b.getAttribute('aria-label')||'').trim(),page:b.closest('.page')?.id||'',onclick:!!b.onclick,attr:!!b.getAttribute('onclick'),type:b.type})).filter(x=>x.text));
            console.log('routing targets passed:',targets.length);
            console.log('visible buttons audited:',buttonAudit.length);
            console.log('expected unauthenticated 401 responses:',expected401.length);
            if(errors.length)throw new Error(errors.join('\n'));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE