name: Penilaian SUPER V14 Fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Penilaian SUPER
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Rapikan link menu Penilaian agar menuju halaman yang benar.
          s=s.replace('data-page="aiGenerate">📈 Analisis Hasil', 'data-page="analysis">📈 Analisis Hasil')
          s=s.replace('data-page="aiGenerate">🔄 Remedial', 'data-page="remedial">🔄 Remedial')
          s=s.replace('data-page="aiGenerate">🚀 Pengayaan', 'data-page="enrichment">🚀 Pengayaan')
          if 'data-page="report">🖨️ Cetak / Export' not in s:
              s=s.replace('data-page="report">📊 Rekap / Rapor</button>', 'data-page="report">📊 Rekap / Rapor</button>\n<button type="button" class="navbtn" data-page="report">🖨️ Cetak / Export</button>')

          # Upgrade Input Nilai: tabel 4 kolom, tanpa menyentuh struktur DB/D1.
          scores_start=s.find('<section id="scores"')
          if scores_start < 0: raise SystemExit('scores section not found')
          scores_end=s.find('</section>', scores_start)
          if scores_end < 0: raise SystemExit('scores section end not found')
          scores='''<section id="scores" class="page">
    <div class="doc-hero"><div class="doc-title-row"><div><div class="doc-kicker">PENILAIAN SUPER</div><div class="doc-title">✍️ Input Nilai</div><div class="doc-sub">Input nilai per siswa dan BAB/Unit. STS tidak digunakan.</div></div><div class="doc-actions"><button class="btn secondary" type="button" onclick="window.print()">🖨 Cetak</button></div></div></div>
    <div class="card panel">
      <div class="doc-controls"><select id="scoreMapel"></select><select id="scoreKelas"></select></div>
      <select id="scoreBab" style="margin-top:10px"></select>
      <div class="tablewrap" style="margin-top:12px"><table class="table"><thead><tr><th>No</th><th>Nama Siswa</th><th>Nilai</th><th>Catatan</th></tr></thead><tbody id="scoreTable"></tbody></table></div>
      <button class="btn success" id="saveScores" style="margin-top:12px">💾 Simpan Nilai</button>
    </div>
  </section>'''
          s=s[:scores_start]+scores+s[scores_end+10:]

          # Upgrade Rekap/Rapor sebagai pusat rekap nilai.
          report_start=s.find('<section id="report"')
          if report_start < 0: raise SystemExit('report section not found')
          report_end=s.find('</section>', report_start)
          if report_end < 0: raise SystemExit('report section end not found')
          report='''<section id="report" class="page">
    <div class="doc-hero"><div class="doc-title-row"><div><div class="doc-kicker">PENILAIAN SUPER</div><div class="doc-title">📊 Rekap / Rapor</div><div class="doc-sub">Ringkasan nilai siswa, ketuntasan, dan detail per siswa.</div></div><div class="doc-actions"><button class="btn secondary" type="button" onclick="window.print()">🖨 Cetak / Export</button></div></div></div>
    <div class="card panel"><div class="doc-controls"><select id="reportMapel"></select><select id="reportKelas"></select></div>
      <div id="reportSummary" class="mini-stat" style="margin-top:12px"></div>
      <div class="tablewrap" style="margin-top:12px"><table class="table"><thead><tr><th>No</th><th>Nama Siswa</th><th>Nilai Tersimpan</th><th>Rata-rata</th><th>Status</th></tr></thead><tbody id="reportTable"></tbody></table></div>
      <div style="margin-top:14px"><label>Detail Siswa</label><select id="reportStudent"></select><div id="reportResult" style="margin-top:12px"></div></div>
    </div>
  </section>'''
          s=s[:report_start]+report+s[report_end+10:]

          # Tambahkan halaman Analisis/Remedial/Pengayaan bila belum ada.
          if 'id="analysis"' not in s:
              teacher_start=s.find('<section id="teachers"')
              if teacher_start < 0: raise SystemExit('teachers section not found')
              extra='''
  <section id="analysis" class="page"><div class="doc-hero"><div class="doc-title-row"><div><div class="doc-kicker">PENILAIAN SUPER</div><div class="doc-title">📈 Analisis Hasil Penilaian</div><div class="doc-sub">Ketuntasan, rata-rata, dan BAB/Unit yang perlu mendapat perhatian.</div></div><div class="doc-actions"><button class="btn secondary" type="button" onclick="window.print()">🖨 Cetak</button></div></div></div><div class="card panel"><div class="doc-controls"><select id="analysisMapel"></select><select id="analysisKelas"></select></div><div id="analysisCards" class="grid" style="margin-top:14px"></div><div class="tablewrap" style="margin-top:14px"><table class="table"><thead><tr><th>BAB/Unit</th><th>Nilai</th><th>Rata-rata</th><th>Tuntas</th><th>Belum</th></tr></thead><tbody id="analysisTable"></tbody></table></div><div id="analysisNote" class="doc-note"></div></div></section>

  <section id="remedial" class="page"><div class="doc-hero"><div class="doc-title-row"><div><div class="doc-kicker">PENILAIAN SUPER</div><div class="doc-title">🔄 Remedial</div><div class="doc-sub">Daftar siswa yang memerlukan tindak lanjut berdasarkan nilai BAB/Unit.</div></div></div></div><div class="card panel"><div class="doc-controls"><select id="remedialMapel"></select><select id="remedialKelas"></select></div><select id="remedialBab" style="margin-top:10px"></select><div class="tablewrap" style="margin-top:12px"><table class="table"><thead><tr><th>No</th><th>Nama Siswa</th><th>Nilai</th><th>Tindak Lanjut</th></tr></thead><tbody id="remedialTable"></tbody></table></div><div id="remedialEmpty" class="doc-note"></div></div></section>

  <section id="enrichment" class="page"><div class="doc-hero"><div class="doc-title-row"><div><div class="doc-kicker">PENILAIAN SUPER</div><div class="doc-title">🚀 Pengayaan</div><div class="doc-sub">Daftar siswa tuntas untuk tantangan belajar lanjutan.</div></div></div></div><div class="card panel"><div class="doc-controls"><select id="enrichMapel"></select><select id="enrichKelas"></select></div><select id="enrichBab" style="margin-top:10px"></select><div class="tablewrap" style="margin-top:12px"><table class="table"><thead><tr><th>No</th><th>Nama Siswa</th><th>Nilai</th><th>Ide Pengayaan</th></tr></thead><tbody id="enrichTable"></tbody></table></div><div id="enrichEmpty" class="doc-note"></div></div></section>
'''
              s=s[:teacher_start]+extra+s[teacher_start:]

          # Override fungsi di bagian paling akhir agar tidak kalah oleh fungsi lama.
          if '/* ===== PENILAIAN SUPER V14 FINAL ===== */' not in s:
              js=r'''/* ===== PENILAIAN SUPER V14 FINAL ===== */
(function(){
  const E=id;
  const getStudents=k=>db.students.filter(s=>normalizeRombel(s.rombel||s.kelas)===normalizeRombel(k));
  const scoreValues=(nis,m,k)=>Object.entries(db.scores||{}).filter(([key,v])=>{const a=key.split('|');return a[0]===String(nis)&&a[1]===m&&normalizeRombel(a[2])===normalizeRombel(k)&&Number.isFinite(Number(v&&v.nilai))}).map(x=>Number(x[1].nilai));
  const fill=()=>{
    const mapel=E('scoreMapel')?.innerHTML||'';
    ['reportMapel','analysisMapel','remedialMapel','enrichMapel'].forEach(x=>{if(E(x)&&mapel)E(x).innerHTML=mapel});
    const rom=ROMBELS.map(r=>'<option value="'+esc(r)+'">Rombel '+esc(r)+'</option>').join('');
    ['reportKelas','analysisKelas','remedialKelas','enrichKelas'].forEach(x=>{if(E(x))E(x).innerHTML=rom});
    if(isGuruKelas())['reportKelas','analysisKelas','remedialKelas','enrichKelas'].forEach(x=>{if(E(x))E(x).value=allowedClass()});
    const bab=E('scoreBab')?.innerHTML||'';
    ['remedialBab','enrichBab'].forEach(x=>{if(E(x)&&bab)E(x).innerHTML=bab});
  };
  window.renderScores=function(){const k=isGuruKelas()?allowedClass():(E('scoreKelas')?.value||ROMBELS[0]);if(E('scoreKelas'))E('scoreKelas').value=k;const ss=getStudents(k),m=E('scoreMapel')?.value||'',b=E('scoreBab')?.value||'';if(E('scoreTable'))E('scoreTable').innerHTML=ss.map((s,i)=>{const key=s.nis+'|'+m+'|'+k+'|'+b,v=db.scores?.[key]||{};return '<tr><td>'+(i+1)+'</td><td><b>'+esc(s.name)+'</b><div class="muted" style="font-size:12px">NIS '+esc(s.nis||'-')+'</div></td><td><input class="scoreInput" data-key="'+esc(key)+'" type="number" min="0" max="100" value="'+esc(v.nilai??'')+'" inputmode="numeric"></td><td><input class="noteInput" data-key="'+esc(key)+'" value="'+esc(v.catatan||'')+'" placeholder="Catatan"></td></tr>'}).join('')||'<tr><td colspan="4" class="muted">Belum ada siswa di kelas ini.</td></tr>'};
  window.renderReport=function(){const m=E('reportMapel')?.value||E('scoreMapel')?.value||'',k=isGuruKelas()?allowedClass():(E('reportKelas')?.value||ROMBELS[0]);if(E('reportKelas'))E('reportKelas').value=k;const ss=getStudents(k),rows=ss.map(s=>{const a=scoreValues(s.nis,m,k),avg=a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;return{s,avg,count:a.length}}),t=rows.filter(x=>x.count&&x.avg>=75).length,n=rows.filter(x=>x.count&&x.avg<75).length;if(E('reportSummary'))E('reportSummary').innerHTML='<span class="badge">👥 '+rows.length+' siswa</span><span class="badge">✅ Tuntas '+t+'</span><span class="badge">🔄 Perlu tindak lanjut '+n+'</span>';if(E('reportTable'))E('reportTable').innerHTML=rows.map((x,i)=>'<tr><td>'+(i+1)+'</td><td><b>'+esc(x.s.name)+'</b></td><td>'+x.count+' nilai</td><td><b>'+x.avg+'</b></td><td>'+(x.count?(x.avg>=75?'<span class="badge">Tuntas</span>':'<span class="badge">Perlu tindak lanjut</span>'):'<span class="muted">Belum dinilai</span>')+'</td></tr>').join('')||'<tr><td colspan="5" class="muted">Belum ada data.</td></tr>';if(E('reportStudent'))E('reportStudent').innerHTML='<option value="">Pilih siswa</option>'+rows.map(x=>'<option value="'+esc(x.s.nis)+'">'+esc(x.s.name)+'</option>').join('')};
  const detail=()=>{const nis=E('reportStudent')?.value;if(!nis){if(E('reportResult'))E('reportResult').innerHTML='';return}const s=db.students.find(x=>String(x.nis)===String(nis)),a=Object.entries(db.scores||{}).filter(([k,v])=>k.startsWith(nis+'|')&&Number.isFinite(Number(v&&v.nilai))).map(x=>Number(x[1].nilai)),avg=a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;if(E('reportResult'))E('reportResult').innerHTML='<div class="doc-box"><h4>'+esc(s?.name||'Siswa')+'</h4><p>Jumlah nilai: <b>'+a.length+'</b> · Rata-rata: <b>'+avg+'</b> · Status: <b>'+(a.length?(avg>=75?'Tuntas':'Perlu tindak lanjut'):'Belum dinilai')+'</b></p></div>'};
  window.renderAnalysis=function(){const m=E('analysisMapel')?.value||'',k=isGuruKelas()?allowedClass():(E('analysisKelas')?.value||ROMBELS[0]);if(E('analysisKelas'))E('analysisKelas').value=k;const map=new Map();Object.entries(db.scores||{}).forEach(([key,v])=>{const a=key.split('|'),n=Number(v&&v.nilai);if(a[1]===m&&normalizeRombel(a[2])===normalizeRombel(k)&&Number.isFinite(n)){if(!map.has(a[3]))map.set(a[3],[]);map.get(a[3]).push(n)}});const all=[...map.values()].flat(),avg=all.length?Math.round(all.reduce((x,y)=>x+y,0)/all.length):0,pass=all.filter(n=>n>=75).length;if(E('analysisCards'))E('analysisCards').innerHTML='<div class="stat card"><span>Rata-rata</span><b>'+avg+'</b></div><div class="stat card"><span>Nilai tersimpan</span><b>'+all.length+'</b></div><div class="stat card"><span>Tuntas</span><b>'+pass+'</b></div><div class="stat card"><span>Belum</span><b>'+Math.max(0,all.length-pass)+'</b></div>';if(E('analysisTable'))E('analysisTable').innerHTML=[...map.entries()].map(([b,a])=>{const av=Math.round(a.reduce((x,y)=>x+y,0)/a.length),p=a.filter(n=>n>=75).length;return '<tr><td>'+esc(b)+'</td><td>'+a.length+'</td><td><b>'+av+'</b></td><td>'+p+'</td><td>'+Math.max(0,a.length-p)+'</td></tr>'}).join('')||'<tr><td colspan="5" class="muted">Belum ada nilai untuk dianalisis.</td></tr>';if(E('analysisNote'))E('analysisNote').textContent=all.length?'Batas ketuntasan tampilan: 75.':'Masukkan dan simpan nilai terlebih dahulu.'};
  const follow=kind=>{const pre=kind==='remedial'?'remedial':'enrich',m=E(pre+'Mapel')?.value||'',k=isGuruKelas()?allowedClass():(E(pre+'Kelas')?.value||ROMBELS[0]),b=E(kind==='remedial'?'remedialBab':'enrichBab')?.value||'',ss=getStudents(k).map(s=>({s,n:Number((db.scores?.[s.nis+'|'+m+'|'+k+'|'+b]||{}).nilai)})).filter(x=>Number.isFinite(x.n)&&(kind==='remedial'?x.n<75:x.n>=75)),tb=E(kind==='remedial'?'remedialTable':'enrichTable');if(tb)tb.innerHTML=ss.map((x,i)=>'<tr><td>'+(i+1)+'</td><td><b>'+esc(x.s.name)+'</b></td><td><b>'+x.n+'</b></td><td>'+(kind==='remedial'?'Penguatan materi, latihan terarah, bimbingan, lalu asesmen ulang.':'Tantangan lanjutan, proyek mini, eksplorasi, atau soal HOTS sesuai materi.')+'</td></tr>').join('')||'<tr><td colspan="4" class="muted">Tidak ada siswa pada kategori ini.</td></tr>';if(E(kind==='remedial'?'remedialEmpty':'enrichEmpty'))E(kind==='remedial'?'remedialEmpty':'enrichEmpty').textContent=ss.length?(kind==='remedial'?ss.length+' siswa perlu remedial.':ss.length+' siswa dapat mengikuti pengayaan.'):'Belum ada siswa yang memenuhi kriteria.'};
  const init=()=>{fill();['reportMapel','reportKelas'].forEach(x=>E(x)?.addEventListener('change',window.renderReport));E('reportStudent')?.addEventListener('change',detail);['analysisMapel','analysisKelas'].forEach(x=>E(x)?.addEventListener('change',window.renderAnalysis));['remedialMapel','remedialKelas','remedialBab'].forEach(x=>E(x)?.addEventListener('change',()=>follow('remedial')));['enrichMapel','enrichKelas','enrichBab'].forEach(x=>E(x)?.addEventListener('change',()=>follow('enrich')));window.renderReport();window.renderAnalysis();follow('remedial');follow('enrich');const oldShow=window.showPage;if(oldShow&&!oldShow.__v14){const wrapped=function(p){oldShow(p);if(p==='analysis')window.renderAnalysis();if(p==='remedial')follow('remedial');if(p==='enrichment')follow('enrich');if(p==='report')window.renderReport()};wrapped.__v14=true;window.showPage=wrapped}};
  setTimeout(init,0);
})();
'''
              close=s.rfind('</script>')
              if close<0: raise SystemExit('script close not found')
              s=s[:close]+'\n'+js+s[close:]

          p.write_text(s,encoding='utf-8')
      - name: Commit and remove one-time workflows
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then echo 'No index changes'; else git commit -m 'Penilaian SUPER V14 final'; git push; fi
          rm -f .github/workflows/penilaian-v14-fix.yml .github/workflows/penilaian-v14.yml
          git add .github/workflows/penilaian-v14-fix.yml .github/workflows/penilaian-v14.yml
          if git diff --cached --quiet; then echo 'No workflow cleanup'; else git commit -m 'Remove one-time Penilaian V14 workflows'; git push; fi
