name: Repair Runtime Inline Syntax
on:
  push:
    branches: ["feat-perangkat-pembelajaran-super-2026-09-10"]
  workflow_dispatch:
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_ACCOUNT_ID: 1059f6c3f94755e9562d95cfd16ff6d1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Discover production D1 binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest d1 list --json > /tmp/d1.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/d1.json'))
          for x in data:
              print(f"D1: name={x.get('name','')} id={x.get('uuid') or x.get('database_id','')}")
          PY
      - name: Repair malformed exportHtml function
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          start=s.find('function exportHtml(type){')
          end=s.find('function ensureDoc',start)
          if start<0 or end<0: raise SystemExit('exportHtml boundaries not found')
          replacement="""function exportHtml(type){const d=docPayload(type);return '<!doctype html><html lang=\"id\"><head><meta charset=\"utf-8\"><title>'+escHtml(d.title)+'</title><style>body{font-family:Arial,sans-serif;margin:35px;color:#172033}h1{font-size:24px;margin-bottom:4px}h4{margin:18px 0 8px;border-bottom:2px solid #ddd;padding-bottom:6px}.doc-grid{display:flex;gap:10px}.doc-box{border:1px solid #ddd;border-radius:10px;padding:12px;flex:1;margin-bottom:12px}.doc-line{border:1px solid #e2e8f0;border-radius:7px;padding:8px;margin:5px 0;line-height:1.5}.doc-table{width:100%;border-collapse:collapse}.doc-table th,.doc-table td{border:1px solid #ccc;padding:8px;text-align:left;vertical-align:top}.doc-table th{background:#f3f4f6}.doc-note{margin-top:12px;padding:10px;background:#fff7ed}</style></head><body><h1>'+escHtml(d.title)+'</h1><p>Tahun Pelajaran 2026/2027</p>'+d.body+'</body></html>'}\n"""
          p.write_text(s[:start]+replacement+s[end:],encoding='utf-8')
          print('exportHtml patched')
          PY
      - name: Validate inline scripts after repair
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.active=None; self.buf=[]; self.items=[]
              def handle_starttag(self,tag,attrs):
                  if tag.lower()=='script': self.active=dict(attrs).get('type','').lower(); self.buf=[]
              def handle_data(self,data):
                  if self.active is not None:self.buf.append(data)
              def handle_endtag(self,tag):
                  if tag.lower()=='script' and self.active is not None:
                      text=''.join(self.buf); typ=self.active
                      if text.strip() and typ not in ('application/ld+json','application/json','importmap'): self.items.append(text)
                      self.active=None; self.buf=[]
          p=P();p.feed(Path('index.html').read_text(encoding='utf-8'))
          Path('/tmp/inline').mkdir(exist_ok=True)
          for i,t in enumerate(p.items,1):Path(f'/tmp/inline/{i}.js').write_text(t,encoding='utf-8')
          print('inline scripts:',len(p.items))
          PY
          for f in /tmp/inline/*.js; do node --check "$f"; done
      - name: Commit repair
        run: |
          if git diff --quiet -- index.html; then echo 'No repair commit needed'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: repair malformed exportHtml inline function'
          git push
