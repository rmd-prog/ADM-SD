name: Fix login session rollback

on:
  push:
    paths:
      - '.github/workflows/fix-login-session-rollback.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch login rollback guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = """try{if(typeof window.__ADM_LOGIN!=='function')throw Error('Modul login belum siap. Muat ulang halaman.');await window.__ADM_LOGIN(u.value.trim(),p.value)}catch(x){console.error(x);$('#loginScreen').style.display='grid';$('#app').style.display='none';error(x.message||'Login gagal. Periksa akun dan Worker.')}finally{if(b){b.disabled=false;b.textContent='MASUK KE SISTEM'}}"""
          new = """let authCommitted=false;try{if(typeof window.__ADM_LOGIN!=='function')throw Error('Modul login belum siap. Muat ulang halaman.');await window.__ADM_LOGIN(u.value.trim(),p.value);authCommitted=!!String(localStorage.getItem('siAuthToken')||'').trim()}catch(x){console.error(x);const tokenNow=String(localStorage.getItem('siAuthToken')||'').trim();if(!tokenNow&&!authCommitted){$('#loginScreen').style.display='grid';$('#app').style.display='none';error(x.message||'Login gagal. Periksa akun dan Worker.')}else{console.warn('Login berhasil tetapi ada error UI pasca-auth; sesi dipertahankan.',x)}}finally{if(b){b.disabled=false;b.textContent='MASUK KE SISTEM'}}"""
          if old not in s:
              raise SystemExit('V12 login block not found')
          s = s.replace(old, new, 1)
          old2 = """try{const saved=JSON.parse(localStorage.getItem('siLogin')||'null');const token=localStorage.getItem('siAuthToken');if(saved&&saved.username&&token){if(saved.role==='guru'&&!ROMBELS.includes(normalizeRombel(saved.rombel||saved.kelas||''))){localStorage.removeItem('siLogin');localStorage.removeItem('siAuthToken')}else finishLogin(saved)}}catch(e){localStorage.removeItem('siLogin');localStorage.removeItem('siAuthToken')}"""
          new2 = """try{const saved=JSON.parse(localStorage.getItem('siLogin')||'null');const token=localStorage.getItem('siAuthToken');if(saved&&saved.username&&token){if(saved.role==='guru'&&!ROMBELS.includes(normalizeRombel(saved.rombel||saved.kelas||''))){localStorage.removeItem('siLogin');localStorage.removeItem('siAuthToken')}else finishLogin(saved)}}catch(e){console.warn('Pemulihan sesi gagal pada UI, token dipertahankan:',e);if(!localStorage.getItem('siAuthToken')){localStorage.removeItem('siLogin')}}"""
          if old2 not in s:
              raise SystemExit('session restore block not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: keep authenticated session after login UI errors'
          git push
