name: Permanent Inline Script Boundary Guard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sanitize inline app script
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          start_marker = "<script>\n(function(){\n'use strict';"
          start = s.find(start_marker)
          if start < 0:
              raise SystemExit('Main inline app script marker not found; aborting safely.')

          end_marker = '<script src="assets/absensi.js"'
          end = s.find(end_marker, start)
          if end < 0:
              raise SystemExit('Main inline app script end marker not found; aborting safely.')

          block = s[start:end]
          # The final </script> is the real HTML boundary. Any earlier literal
          # </script> inside JavaScript strings would make the browser terminate
          # the inline script early and leak the remaining source onto the page.
          if block.count('</script>') == 0:
              raise SystemExit('Main inline app script has no closing boundary; aborting safely.')

          head, tail = block.rsplit('</script>', 1)
          safe_head = head.replace('</script>', '<\\/script>')
          safe_block = safe_head + '</script>' + tail

          # exportHtml no longer needs to inject a script into generated documents.
          # Remove that optional loader from the export string to eliminate another
          # recurring script-boundary hazard permanently.
          safe_block = safe_block.replace("+d.body+'<script src=\\\"guru-mapel-ui.js\\\"><\\/script>\\\n</body></html>'", "+d.body+'</body></html>'")

          if safe_block != block:
              p.write_text(s[:start] + safe_block + s[end:], encoding='utf-8')
              print('Sanitized inline app script boundary.')
          else:
              print('No boundary repair needed.')

      - name: Validate HTML script boundaries
        shell: python
        run: |
          from pathlib import Path
          import re

          s = Path('index.html').read_text(encoding='utf-8')
          start_marker = "<script>\n(function(){\n'use strict';"
          start = s.find(start_marker)
          end = s.find('<script src="assets/absensi.js"', start)
          if start < 0 or end < 0:
              raise SystemExit('Cannot locate main inline app script.')
          block = s[start:end]
          # No raw closing tag may exist before the real final boundary.
          if re.search(r'</script>', block[:-9]):
              raise SystemExit('UNSAFE: raw </script> remains inside the main inline script.')
          if block.count('</script>') != 1:
              raise SystemExit('UNSAFE: main inline script must have exactly one closing boundary.')
          if '<\\/script>' in block:
              print('Escaped script literals detected: safe.')
          print('PASS: inline script boundary is safe.')

      - name: Commit repair if needed
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No repair commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: sanitize inline script boundary"
          git push