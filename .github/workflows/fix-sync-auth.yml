name: Fix sync auth bridge

on:
  push:
    branches:
      - main
    paths:
      - '.github/sync-auth-trigger.txt'
      - '.github/workflows/fix-sync-auth.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch frontend auth bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = "let currentTeacher=null;"
          helper = "let currentTeacher=null;\nfunction getAuthToken(){try{const t=localStorage.getItem('siAuthToken')||sessionStorage.getItem('siAuthToken')||'';if(t)return String(t).trim()}catch(e){}try{const x=JSON.parse(localStorage.getItem('siLogin')||'null');const t=String(x?.token||x?.user?.token||'').trim();if(t)return t}catch(e){}return String(currentTeacher?.token||'').trim()}"
          if marker not in s:
              raise SystemExit('currentTeacher marker not found')
          if "function getAuthToken()" not in s:
              s = s.replace(marker, helper, 1)
          # Preserve the helper's own storage reads, then normalize the rest of the app.
          helper_start = s.find('function getAuthToken()')
          helper_end = s.find('}', helper_start)
          if helper_start < 0 or helper_end < 0:
              raise SystemExit('auth helper not found')
          head = s[:helper_start]
          helper_text = s[helper_start:helper_end+1]
          tail = s[helper_end+1:]
          tail = tail.replace("localStorage.getItem('siAuthToken')||''", "getAuthToken()")
          tail = tail.replace("sessionStorage.getItem('siAuthToken')||''", "getAuthToken()")
          s = head + helper_text + tail
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'function getAuthToken()' in s
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/index-inline.js

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No sync auth patch needed'
            exit 0
          fi
          git commit -m 'fix: robust JWT bridge for D1 sync [skip ci]'
          git push origin main
