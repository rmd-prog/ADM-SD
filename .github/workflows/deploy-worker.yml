name: Deploy ADM-SD Worker

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 1059f6c3f94755e9562d95cfd16ff6d1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect Worker versions for D1 binding metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import os,json,urllib.request
          a=os.environ['CLOUDFLARE_ACCOUNT_ID']; t=os.environ['CLOUDFLARE_API_TOKEN']
          base=f'https://api.cloudflare.com/client/v4/accounts/{a}/workers/scripts/adm-sd'
          for suffix in ['/versions','/deployments']:
            u=base+suffix; req=urllib.request.Request(u,headers={'Authorization':'Bearer '+t})
            try:
              with urllib.request.urlopen(req,timeout=20) as r: d=json.load(r)
              print('CF',suffix,'HTTP',r.status)
              def walk(x):
                if isinstance(x,dict):
                  for k,v in x.items():
                    if 'database' in k.lower() or k.lower() in ('bindings','binding'):
                      print('META',k, json.dumps(v)[:4000])
                    walk(v)
                elif isinstance(x,list):
                  for v in x: walk(v)
              walk(d.get('result',d))
            except Exception as e: print('CF_ERROR',suffix,str(e)[:200])
          PY
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc --keep-vars
