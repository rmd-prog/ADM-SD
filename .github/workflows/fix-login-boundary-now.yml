name: Fix Login Boundary Now
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair closing script boundary
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.find("<script>\n(function(){\n'use strict';")
          end=s.find('<script src="assets/absensi.js"', start)
          if start<0 or end<0:
              raise SystemExit('main inline script not found')
          block=s[start:end]
          bad='<\\/script>'
          if block.rstrip().endswith(bad):
              pos=block.rfind(bad)
              block=block[:pos]+'</script>'+block[pos+len(bad):]
          else:
              raise SystemExit('expected escaped final script boundary not found')
          p.write_text(s[:start]+block+s[end:],encoding='utf-8')
      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.find("<script>\n(function(){\n'use strict';")
          end=s.find('<script src="assets/absensi.js"', start)
          block=s[start:end]
          if not block.rstrip().endswith('</script>'):
              raise SystemExit('FAIL: final inline script boundary is not raw </script>')
          print('PASS: login script boundary restored')
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: restore executable login script boundary"
          git push
