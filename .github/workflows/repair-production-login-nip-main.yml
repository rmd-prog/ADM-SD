name: Repair Production Login NIP Contract Main
on:
  push:
    branches: ["main"]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch login request contract
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "body:JSON.stringify({username:String(username),password:String(password)})"
          new = "body:JSON.stringify({nip:String(username),username:String(username),password:String(password)})"
          if new in s:
              print('PASS: NIP login contract already present')
          elif old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('PASS: patched production login to send NIP + username')
          else:
              raise SystemExit('FAIL: expected login request contract not found')
      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert "body:JSON.stringify({nip:String(username),username:String(username),password:String(password)})" in s
          assert 'E2E_ADMIN_PASSWORD' not in s
          print('PASS: production login patch validated')
      - name: Commit patch and remove repair workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/repair-production-login-nip-main.yml
          git commit -m "fix: align production login with NIP auth contract"
          git push
