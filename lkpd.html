<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LKPD Visual AI — SI-NILAI SD V8</title><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#eef2ff;color:#172033;font-family:system-ui,Arial}.wrap{max-width:1180px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dbe4f0;border-radius:18px;box-shadow:0 10px 30px #0f172a12}.top{padding:18px 20px;margin-bottom:12px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff}.top h1{margin:0;font-size:23px}.top p{margin:5px 0;opacity:.9}.controls{padding:16px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.field label{display:block;font-weight:800;font-size:12px;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:900;cursor:pointer}.primary{background:#2563eb;color:#fff}.secondary{background:#e2e8f0}.success{background:#16a34a;color:#fff}.status{display:none;margin-top:9px;padding:9px;border-radius:9px;background:#eff6ff;color:#1e40af}.status.show{display:block}.stage{padding:16px;margin-top:12px;overflow:auto}.paper{width:794px;height:1123px;margin:auto;background:#fff;position:relative;padding:18px;overflow:hidden;border:1px solid #cbd5e1;font-family:Arial,sans-serif}.paper:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 4% 4%,#dbeafe 0 42px,transparent 43px),radial-gradient(circle at 97% 94%,#fef3c7 0 48px,transparent 49px);pointer-events:none}.head{position:relative;border:2px solid var(--accent);border-radius:15px;padding:8px 10px;margin-bottom:5px;background:linear-gradient(135deg,var(--soft),#fff);display:grid;grid-template-columns:145px 1fr;gap:9px}.hero{width:145px;height:72px;border-radius:9px;overflow:hidden;background:#fff;border:1px solid #dbe4f0}.hero svg,.qimg svg,.opti svg{width:100%;height:100%;display:block}.badge{display:inline-block;background:var(--accent);color:#fff;padding:3px 7px;border-radius:99px;font-size:7px;font-weight:900}.title{font-size:18px;font-weight:900;margin:3px 0}.sub{font-size:8px;color:#475569}.identity{grid-column:1/-1;display:grid;grid-template-columns:1.5fr .8fr .8fr;gap:6px}.id{border-bottom:1px solid #64748b;font-size:8px;padding:3px}.instructions{position:relative;margin:4px 0;padding:5px 7px;border-left:4px solid var(--accent);background:var(--soft);font-size:7.5px;border-radius:6px}.questions{position:relative;display:grid;gap:4px 5px;align-content:start}.q{border:1px solid #dbe4f0;border-radius:6px;padding:4px 5px;background:#fff;overflow:hidden}.q.visual{background:linear-gradient(135deg,#fff,var(--soft))}.qnum{font-size:7.8px;font-weight:900}.tag{float:right;background:var(--accent);color:#fff;border-radius:99px;padding:1px 4px;font-size:5px}.qt{font-size:7.2px;line-height:1.18;margin:2px 0}.qimg{height:42px;margin:2px 0 3px;border:1px solid #e2e8f0;border-radius:5px;overflow:hidden}.opts{display:grid;grid-template-columns:1fr 1fr;gap:2px}.opt{font-size:6.5px;min-height:17px;padding:2px;border:1px solid #e2e8f0;border-radius:4px;display:flex;gap:2px;align-items:center}.opti{width:16px;height:16px;flex:none}.line{height:15px;border-bottom:1px solid #64748b}.essay{height:30px;margin-top:2px;background:repeating-linear-gradient(to bottom,transparent 0 8px,#94a3b8 9px 10px)}.foot{position:absolute;bottom:7px;left:18px;right:18px;border-top:1px dashed #cbd5e1;padding-top:3px;display:flex;justify-content:space-between;font-size:6.5px;color:#64748b}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.paper{margin-left:0}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:10px}}@media print{body{background:#fff}.top,.controls{display:none}.stage{padding:0;border:0;box-shadow:none}.paper{border:0;margin:0}}</style></head><body><div class="wrap"><div class="top card"><h1>🎨 LKPD Visual AI</h1><p>Visual sesuai materi & pertanyaan • PG + Isian + Essay • tepat jumlah • 1 halaman A4</p></div><div class="controls card"><div class="grid"><div class="field"><label>Kelas</label><select id="kelas"><option value="IA">Kelas 1</option><option value="IB">Kelas 1B</option><option value="IIA">Kelas 2</option><option value="IIB">Kelas 2B</option><option value="IIIA">Kelas 3</option><option value="IIIB">Kelas 3B</option><option value="IVA" selected>Kelas 4</option><option value="IVB">Kelas 4B</option><option value="V">Kelas 5</option><option value="VI">Kelas 6</option></select></div><div class="field"><label>Mapel</label><input id="mapel" value="IPAS"></div><div class="field"><label>Jumlah soal</label><select id="jumlah"><option>10</option><option>15</option><option selected>20</option><option>25</option><option>30</option></select></div><div class="field"><label>Komposisi</label><select id="komposisi"><option value="campur">Campuran PG + Isian + Essay</option><option value="pg">PG dominan</option><option value="isian">Isian dominan</option><option value="essay">Essay dominan</option></select></div><div class="field"><label>Gaya</label><select id="gaya"><option value="ceria">Ceria</option><option value="alam">Alam</option><option value="minimal">Minimal</option><option value="warna">Warna-warni</option></select></div><div class="field full"><label>Materi / permintaan</label><textarea id="materi" rows="3" placeholder="Contoh: Ekosistem. 30 soal campuran. Beberapa soal memakai gambar ekosistem, rantai makanan, hewan/tumbuhan yang benar-benar sesuai pertanyaan."></textarea></div></div><div class="actions"><button class="btn primary" id="generate">✨ Generate LKPD</button><button class="btn secondary" id="sample">Contoh cepat</button><button class="btn success" id="png">🖼️ Simpan PNG</button><button class="btn secondary" onclick="window.print()">🖨️ Cetak</button></div><div id="status" class="status"></div></div><div class="stage card"><div id="paper" class="paper"><div style="height:100%;display:grid;place-items:center;color:#94a3b8;text-align:center"><div>🧩<br><b>LKPD akan muncul di sini</b><br><small>Masukkan materi lalu Generate.</small></div></div></div></div></div><script>
const API_BASE=localStorage.getItem('siApiBase')||'https://adm-sd.adm-sd.workers.dev/api', $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]));const themes={ceria:['#2563eb','#eff6ff'],alam:['#15803d','#dcfce7'],minimal:['#334155','#f1f5f9'],warna:['#db2777','#fce7f3']};
function cn(v){return({IA:'1',IB:'1B',IIA:'2',IIB:'2B',IIIA:'3',IIIB:'3B',IVA:'4',IVB:'4B',V:'5',VI:'6'})[v]||v}function kind(s){s=String(s||'').toLowerCase();if(/ekosistem|biotik|abiotik|rantai makanan|habitat|sawah|kolam/.test(s))return'eco';if(/tumbuhan|daun|akar|batang|bunga|fotosint/.test(s))return'plant';if(/tata surya|planet|bulan|matahari|gerhana/.test(s))return'space';if(/pecahan|persegi|segitiga|bangun|sudut|geometri|keliling|luas/.test(s))return'math';if(/air|siklus air|hujan|sungai|laut/.test(s))return'water';if(/hewan|ikan|burung|serangga|mamalia|katak|kupu/.test(s))return'animal';if(/peta|provinsi|indonesia|pulau/.test(s))return'map';if(/cuaca|awan|angin|musim/.test(s))return'weather';return'edu'}
function pic(label){const k=kind(label),b='<rect width="300" height="120" fill="#f8fafc"/>';if(k==='eco')return`<svg viewBox="0 0 300 120">${b}<circle cx="255" cy="25" r="16" fill="#facc15"/><path d="M0 85Q75 62 150 86T300 78V120H0Z" fill="#86efac"/><rect x="48" y="50" width="8" height="43" fill="#92400e"/><circle cx="52" cy="42" r="25" fill="#22c55e"/><path d="M95 94q18-30 36 0" fill="#60a5fa"/><circle cx="112" cy="80" r="5" fill="#0ea5e9"/><path d="M205 43q15-12 28 0" stroke="#334155" fill="none" stroke-width="3"/></svg>`;if(k==='plant')return`<svg viewBox="0 0 300 120">${b}<path d="M150 103V48" stroke="#15803d" stroke-width="7"/><path d="M150 66Q105 35 88 60Q118 82 150 68M150 57Q190 25 210 50Q180 70 150 62" fill="#22c55e"/><circle cx="150" cy="37" r="14" fill="#f472b6"/><path d="M115 103Q150 88 185 103" stroke="#92400e" stroke-width="5" fill="none"/></svg>`;if(k==='space')return`<svg viewBox="0 0 300 120">${b}<circle cx="150" cy="60" r="28" fill="#facc15"/><circle cx="70" cy="38" r="9" fill="#60a5fa"/><circle cx="230" cy="82" r="13" fill="#fb7185"/><path d="M35 105Q150 8 270 105" stroke="#94a3b8" fill="none" stroke-dasharray="5 5"/></svg>`;if(k==='math')return`<svg viewBox="0 0 300 120">${b}<path d="M90 25h100v70H90z" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/><path d="M90 60h100M140 25v70" stroke="#2563eb" stroke-width="3"/><circle cx="115" cy="42" r="5" fill="#f97316"/><circle cx="165" cy="78" r="5" fill="#22c55e"/></svg>`;if(k==='water')return`<svg viewBox="0 0 300 120">${b}<circle cx="245" cy="25" r="16" fill="#facc15"/><path d="M0 70Q55 45 110 70T220 70T330 65V120H0Z" fill="#60a5fa"/><path d="M75 40Q88 20 101 40M125 38Q138 18 151 38" stroke="#94a3b8" stroke-width="4" fill="none"/></svg>`;if(k==='animal')return`<svg viewBox="0 0 300 120">${b}<ellipse cx="150" cy="68" rx="48" ry="28" fill="#f59e0b"/><circle cx="115" cy="55" r="20" fill="#fbbf24"/><path d="M105 42l-10-17 18 10M122 38l10-17 2 22" fill="#f59e0b"/><circle cx="110" cy="54" r="3"/><circle cx="120" cy="54" r="3"/></svg>`;if(k==='map')return`<svg viewBox="0 0 300 120">${b}<path d="M55 25l60 15 70-18 60 20-5 62-60-18-65 20-65-17z" fill="#bbf7d0" stroke="#15803d" stroke-width="3"/><circle cx="150" cy="65" r="8" fill="#ef4444"/></svg>`;if(k==='weather')return`<svg viewBox="0 0 300 120">${b}<circle cx="90" cy="40" r="22" fill="#facc15"/><path d="M120 78h85a22 22 0 0 0 0-44 30 30 0 0 0-55 10 20 20 0 0 0-30 34z" fill="#cbd5e1"/><path d="M145 88l-5 18M175 88l-5 18M205 88l-5 18" stroke="#60a5fa" stroke-width="4"/></svg>`;return`<svg viewBox="0 0 300 120">${b}<circle cx="150" cy="52" r="30" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><path d="M135 48h30M140 60h20" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/></svg>`}
function comp(n){let c=$('komposisi').value;if(c==='pg')return[Math.ceil(n*.6),Math.floor(n*.25),n-Math.ceil(n*.6)-Math.floor(n*.25)];if(c==='isian')return[Math.floor(n*.25),Math.ceil(n*.5),n-Math.floor(n*.25)-Math.ceil(n*.5)];if(c==='essay')return[Math.floor(n*.25),Math.floor(n*.25),n-Math.floor(n*.25)-Math.floor(n*.25)];return[Math.round(n*.5),Math.round(n*.25),n-Math.round(n*.5)-Math.round(n*.25)]}
function parse(raw){if(typeof raw!=='string')return raw;let a=raw.indexOf('{'),b=raw.lastIndexOf('}');if(a>=0&&b>a)try{return JSON.parse(raw.slice(a,b+1))}catch{}return null}function norm(d){if(!d||!Array.isArray(d.questions))return{title:'LKPD '+$('mapel').value,questions:[]};return{title:d.title||'LKPD '+$('mapel').value,questions:d.questions.map(q=>({type:String(q.type||q.jenis||'pilihan_ganda').toLowerCase().replace('pilihan ganda','pilihan_ganda'),question:q.question||q.pertanyaan||'',options:Array.isArray(q.options)?q.options.map(o=>typeof o==='string'?o:o.text||''):[],visual:!!(q.visual||q.gambar||q.image),visual_type:q.visual_type||q.tipe_gambar||'',visual_description:q.visual_description||q.deskripsi_gambar||''}))}}
async function ask(token,count,start){const n=+$('jumlah').value,[pg,is,es]=comp(n),m=$('materi').value||'materi sesuai mapel dan kelas';const context=`Buat TEPAT ${count} soal LKPD SD bagian ${start+1}-${start+count}. Kelas ${cn($('kelas').value)}, mapel ${$('mapel').value}, materi: ${m}. Komposisi total: ${pg} pilihan_ganda, ${is} isian, ${es} essay. JSON valid tanpa markdown: {"title":"judul","questions":[{"type":"pilihan_ganda|isian|essay","question":"pertanyaan","options":["A","B","C","D"],"visual":true,"visual_type":"ecosystem|plant|animal|space|water|math|map|weather|education","visual_description":"gambar spesifik yang benar-benar mendukung pertanyaan"}]}. Isian/essay options=[]. Hanya beberapa soal visual, jangan semua. Jangan ulang soal. Tepat ${count} questions.`;const r=await fetch(API_BASE+'/ai/generate',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({jenis:'lkpd',rombel:$('kelas').value,mapel:$('mapel').value,fase:'Fase '+(+$('kelas').value<=2?'A':+$('kelas').value<=4?'B':'C'),tahun:'2026/2027',context,tujuan:'LKPD visual satu halaman',durasi:'40 menit',aktivitas:'campuran PG isian essay dengan visual relevan',jumlahSoal:count,bentukSoal:'Campuran'})});const p=await r.json();if(!r.ok||!p.ok)throw Error(p.message||'AI gagal');return norm(parse(p.text))}
function render(d){const n=+$('jumlah').value,[ac,soft]=themes[$('gaya').value];document.documentElement.style.setProperty('--accent',ac);document.documentElement.style.setProperty('--soft',soft);const qs=d.questions.slice(0,n),cols=n>=25?3:2;let html=`<div class="head"><div class="hero">${pic($('materi').value)}</div><div><span class="badge">LKPD • KURIKULUM MERDEKA</span><div class="title">${esc(d.title)}</div><div class="sub">${esc($('mapel').value)} • Kelas ${cn($('kelas').value)} • Tahun Ajaran 2026/2027</div></div><div class="identity"><div class="id">Nama: _______________________</div><div class="id">Kelas: ______</div><div class="id">Tanggal: ______</div></div></div><div class="instructions"><b>Petunjuk:</b> PG pilih satu jawaban; isian tulis jawaban singkat; essay jawab jelas.</div><div class="questions" style="grid-template-columns:repeat(${cols},1fr)">`;qs.forEach((q,i)=>{let t=q.type==='essay'?'ESSAY':q.type==='isian'?'ISIAN':'PG',has=q.visual&&q.visual_description;html+=`<div class="q ${has?'visual':''}"><div class="qnum">${i+1}. <span class="tag">${t}</span></div><div class="qt">${esc(q.question)}</div>${has?`<div class="qimg">${pic(q.visual_description+' '+q.question)}</div>`:''}`;if(t==='PG')html+=`<div class="opts">${q.options.slice(0,4).map((o,j)=>`<div class="opt"><b>${String.fromCharCode(65+j)}.</b><span>${esc(o)}</span></div>`).join('')}</div>`;else if(t==='ISIAN')html+='<div class="line"></div>';else html+='<div class="essay"></div>';html+='</div>'});html+=`</div><div class="foot"><span>Kerjakan dengan jujur • Semangat belajar!</span><span>${qs.length} soal • 1 halaman</span></div>`;$('paper').innerHTML=html}
function status(t){$('status').textContent=t;$('status').classList.add('show')}async function generate(){const token=localStorage.getItem('siAuthToken');if(!token)return status('❌ Sesi login ADM-SD tidak ditemukan. Login dulu di aplikasi utama.');const n=+$('jumlah').value;$('generate').disabled=true;status('🤖 Membuat tepat '+n+' soal dan memilih visual sesuai pertanyaan...');try{let all=[],title='';for(let pass=0;pass<3&&all.length<n;pass++){let d=await ask(token,n-all.length,all.length);if(!title)title=d.title;for(const q of d.questions){if(q.question&&!all.some(x=>x.question.trim().toLowerCase()===q.question.trim().toLowerCase()))all.push(q);if(all.length>=n)break}}if(all.length!==n)throw Error('AI baru menghasilkan '+all.length+' dari '+n+' soal. Tekan Generate lagi.');render({title,questions:all});status('✅ Selesai: tepat '+n+' soal, campuran PG + Isian + Essay, visual mengikuti materi.')}catch(e){status('❌ '+e.message)}finally{$('generate').disabled=false}}$('generate').onclick=generate;$('sample').onclick=()=>{$('materi').value='Ekosistem: komponen biotik dan abiotik, rantai makanan di sawah dan kolam. Buat beberapa soal dengan gambar yang benar-benar sesuai pertanyaan.';generate()};$('png').onclick=async()=>{if(!window.html2canvas)return status('❌ Mesin PNG belum siap.');status('🖼️ Menyiapkan PNG...');const c=await html2canvas($('paper'),{scale:2,backgroundColor:'#fff'}),a=document.createElement('a');a.download='LKPD-Visual-'+Date.now()+'.png';a.href=c.toDataURL('image/png');a.click();status('✅ PNG berhasil dibuat.')};</script></body></html>
