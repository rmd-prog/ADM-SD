name: Login Hardening
on:
  push:
    paths:
      - '.github/login-hardening-trigger.txt'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch finishLogin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="""  updateTeacherProfile(t);
  id('loginScreen').style.display='none';id('app').style.display='block';window.scrollTo({top:0,left:0,behavior:'auto'});document.documentElement.scrollTop=0;document.body.scrollTop=0;id('loginError').style.display='none';
  applyClassLock();syncRoleMenu();initAIGenerator();renderBookBasisStatus();renderStats();renderStudents();renderScores();renderReport();showPage((t.role==='guru'||t.role==='guru_mapel')?'students':'dashboard');
  // Sinkronisasi D1 berjalan di belakang layar agar login tidak tertahan.
  syncRemoteData(t).catch(err=>console.warn('Sinkronisasi D1 gagal:',err));
  setTimeout(()=>showWelcome(t),220);"""
          new="""  // Tampilkan aplikasi lebih dulu. Fitur tambahan tidak boleh membuat login terlihat macet.
  id('loginScreen').style.display='none';
  id('app').style.display='block';
  id('loginError').style.display='none';
  window.scrollTo(0,0);document.documentElement.scrollTop=0;document.body.scrollTop=0;
  try{updateTeacherProfile(t)}catch(e){console.warn('Profil guru gagal dimuat:',e)}
  try{applyClassLock()}catch(e){console.warn('Class lock gagal:',e)}
  try{syncRoleMenu()}catch(e){console.warn('Role menu gagal:',e)}
  try{initAIGenerator()}catch(e){console.warn('AI init gagal:',e)}
  try{renderBookBasisStatus()}catch(e){console.warn('Basis buku gagal:',e)}
  try{renderStats()}catch(e){console.warn('Statistik gagal:',e)}
  try{renderStudents()}catch(e){console.warn('Siswa gagal:',e)}
  try{renderScores()}catch(e){console.warn('Nilai gagal:',e)}
  try{renderReport()}catch(e){console.warn('Rapor gagal:',e)}
  try{showPage((t.role==='guru'||t.role==='guru_mapel')?'students':'dashboard')}catch(e){console.warn('Halaman awal gagal:',e)}
  syncRemoteData(t).catch(err=>console.warn('Sinkronisasi D1 gagal:',err));
  setTimeout(()=>showWelcome(t),220);"""
          if old not in s:
              raise SystemExit('finishLogin target tidak ditemukan')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check src/index.js
          grep -q "Tampilkan aplikasi lebih dulu" index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: prevent login init errors from blocking entry [skip ci]'
          git push origin main
