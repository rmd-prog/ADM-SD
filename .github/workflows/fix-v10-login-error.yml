name: Fix V10 login without hard lock

on:
  push:
    paths:
      - '.github/workflows/fix-v10-login-error.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore known working index and apply safe CSS
        run: |
          git checkout 9221283d48e344d7ca5b5ba9852b5a97c64d025a -- index.html
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '''
/* V10 SAFE LOGIN VIEWPORT */
.login{min-height:100svh!important;height:100svh!important;overflow:hidden!important;padding:14px!important}
.login-card{max-height:calc(100svh - 28px);overflow:auto}
'''
          marker = '</style>'
          if marker not in s:
              raise SystemExit('style marker not found')
          s = s.replace(marker, css + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit stable fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: restore stable V10 login viewport' || exit 0
          git push
