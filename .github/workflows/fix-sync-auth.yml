name: Fix sync auth bridge

on:
  push:
    branches:
      - main
    paths:
      - '.github/sync-auth-trigger.txt'
      - '.github/workflows/fix-sync-auth.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch frontend auth bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = "let currentTeacher=null;"
          helper = "let currentTeacher=null;\nfunction getAuthToken(){try{const t=localStorage.getItem('siAuthToken')||sessionStorage.getItem('siAuthToken')||'';if(t)return t}catch(e){}try{const x=JSON.parse(localStorage.getItem('siLogin')||'null');const t=String(x?.token||x?.user?.token||'').trim();if(t)return t}catch(e){}return String(currentTeacher?.token||'').trim()}"
          if marker not in s:
              raise SystemExit('currentTeacher marker not found')
          if "function getAuthToken()" in s:
              import re
              s = re.sub(r"function getAuthToken\(\)\{.*?\}", helper.split('\n',1)[1], s, count=1)
          else:
              s = s.replace(marker, helper, 1)
          # Replace token reads while preserving the helper's own storage lookup.
          placeholder = "__AUTH_HELPER_LOCALSTORAGE__"
          s = s.replace("localStorage.getItem('siAuthToken')||sessionStorage.getItem('siAuthToken')||''", placeholder, 1)
          s = s.replace("localStorage.getItem('siAuthToken')||''", "getAuthToken()")
          s = s.replace("sessionStorage.getItem('siAuthToken')||''", "getAuthToken()")
          s = s.replace(placeholder, "localStorage.getItem('siAuthToken')||sessionStorage.getItem('siAuthToken')||''", 1)
          # Keep the JWT available in the in-memory teacher object whenever login stores it.
          s = s.replace("localStorage.setItem('siAuthToken',t.token);", "localStorage.setItem('siAuthToken',t.token);try{if(currentTeacher)currentTeacher.token=t.token}catch(e){}")
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'function getAuthToken()' in s
          assert "getAuthToken()" in s
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/index-inline.js

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No sync auth patch needed'
            exit 0
          fi
          git commit -m 'fix: robust JWT bridge for D1 sync [skip ci]'
          git push origin main
