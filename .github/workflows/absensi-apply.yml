name: Apply Absensi
on:
  push:
    paths:
      - '.github/absensi-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/apply_absensi.py
      - name: Validate
        run: |
          node --check src/index.js
          node --check assets/absensi.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.js index.html assets/absensi.js
          git diff --cached --quiet || git commit -m 'feat: add complete attendance API and UI [skip ci]'
          git push origin main
