name: Normalize SIAP GURU brand

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize-brand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize brand and repair inline script leak
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          if not p.exists():
              raise SystemExit('index.html tidak ditemukan')

          s = p.read_text(encoding='utf-8')

          # Perbaiki brand login yang masih membawa label lama/V11.
          s = s.replace('GURU<b>+</b> SD', 'SIAP GURU')
          s = s.replace('GURU+ SD', 'SIAP GURU')
          s = s.replace('TA 2026/2027 • V11', 'TA 2026/2027')
          s = s.replace('SIAP GURU V11', 'SIAP GURU')

          # BIANG BUG TEKS CODING:
          # Ada tag <script src=...> yang tersisip DI DALAM blok JavaScript utama.
          # Browser menutup <script> di tengah fungsi lalu merender sisa JS sebagai teks.
          # Simpan hanya tag pemuatan yang benar-benar berada di bagian akhir dokumen.
          tags = [
              '<script src="assets/siap-guru-brand-cleanup.js"></script>',
              '<script src="assets/siap-guru-new-ui.js"></script>',
              '<script src="assets/siap-guru-login-ui-v2.js"></script>',
          ]
          for tag in tags:
              count = s.count(tag)
              if count > 1:
                  # Pertahankan kemunculan terakhir (loader resmi di akhir body),
                  # hapus semua kemunculan yang tersisip di JS utama.
                  first = s.find(tag)
                  while first != -1 and count > 1:
                      s = s[:first] + s[first + len(tag):]
                      count -= 1
                      first = s.find(tag)

          p.write_text(s, encoding='utf-8')
          print('index.html repaired')
          PY

      - name: Verify no inline script tags remain inside main JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          s = Path('index.html').read_text(encoding='utf-8')
          opens = [m.start() for m in re.finditer(r'<script(?:\s[^>]*)?>', s, re.I)]
          closes = [m.start() for m in re.finditer(r'</script\s*>', s, re.I)]
          if len(opens) != len(closes):
              raise SystemExit(f'Script tag mismatch: {len(opens)} open vs {len(closes)} close')

          # Tidak boleh ada pemanggilan asset loader di antara pembuka dan penutup
          # script inline utama.
          main_start = s.find('<script>\n(function(){')
          main_end = s.find('</script>', main_start)
          if main_start >= 0 and main_end > main_start:
              main = s[main_start:main_end]
              bad = [
                  'assets/siap-guru-brand-cleanup.js',
                  'assets/siap-guru-new-ui.js',
                  'assets/siap-guru-login-ui-v2.js',
              ]
              leaked = [x for x in bad if x in main]
              if leaked:
                  raise SystemExit('Masih ada loader asset di dalam JS utama: ' + ', '.join(leaked))

          if 'GURU<b>+</b> SD' in s or 'SIAP GURU V11' in s:
              raise SystemExit('Brand lama masih tersisa')
          print('VERIFY OK: script tags balanced, no inline loader leak, brand clean')
          PY

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'Tidak ada perubahan.'
            exit 0
          fi
          git add index.html
          git commit -m 'fix: clean SIAP GURU login and script leak'
          git push
