name: Fix sync auth bridge

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch frontend auth token fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = "let currentTeacher=null;"
          helper = "let currentTeacher=null;\nfunction getAuthToken(){try{const t=localStorage.getItem('siAuthToken')||'';if(t)return t}catch(e){}return String(currentTeacher?.token||'').trim()}"
          if "function getAuthToken()" not in s:
              if marker not in s:
                  raise SystemExit('currentTeacher marker not found')
              s = s.replace(marker, helper, 1)
          s = s.replace("localStorage.getItem('siAuthToken')||''", "getAuthToken()")
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'function getAuthToken()' in s
          assert "getAuthToken()" in s
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/index-inline.js

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No sync auth patch needed'
            exit 0
          fi
          git commit -m 'fix: preserve JWT for D1 sync requests [skip ci]'
          git push origin main
