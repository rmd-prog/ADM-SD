name: One-time Repair LKPD Loader

on:
  push:
    branches: [feat-perangkat-pembelajaran-super-2026-09-10]
    paths: ['.github/repair-lkpd-trigger.txt']

permissions:
  contents: write
  actions: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-perangkat-pembelajaran-super-2026-09-10
      - name: Wait for Perangkat normalization
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          for i in {1..24}; do
            state=$(gh run list --workflow safe-perangkat-super-master-loader.yml --branch feat-perangkat-pembelajaran-super-2026-09-10 --limit 20 --json headSha,status,conclusion --jq ".[] | select(.headSha==\"$SHA\") | .status + \" \" + (.conclusion // \"\")" | head -1)
            echo "normalizer: $state"
            if echo "$state" | grep -q 'completed success'; then break; fi
            sleep 5
          done
      - name: Restore canonical LKPD loader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          src='assets/perangkat-lkpd-asesmen-super-v2.js'
          s=re.sub(r'\s*<script\s+src=["\']'+re.escape(src)+r'["\']\s*>\s*</script>\s*','\n',s,flags=re.I)
          pos=s.rfind('</body>')
          if pos<0: raise SystemExit('final </body> not found')
          s=s[:pos]+'\n<script src="'+src+'"></script>\n'+s[pos:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit repaired index
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "ci: restore canonical LKPD assessment loader"
          git push
