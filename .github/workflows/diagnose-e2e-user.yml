name: Diagnose E2E User Presence
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 1059f6c3f94755e9562d95cfd16ff6d1
      E2E_USERNAME: ${{ secrets.E2E_ADMIN_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check account presence without exposing credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          test -n "$E2E_USERNAME"
          SAFE_USER=$(printf '%s' "$E2E_USERNAME" | sed "s/'/''/g")
          npx --yes wrangler@latest d1 execute 20415873-2fac-4d5d-97bc-2ac207ba2109 --remote --command "SELECT CASE WHEN EXISTS (SELECT 1 FROM users WHERE username='$SAFE_USER') THEN 'FOUND' ELSE 'NOT_FOUND' END AS status;"
