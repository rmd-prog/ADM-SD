<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LKPD Visual AI — SI-NILAI SD V8</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2ff;color:#172033;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dbe4f0;border-radius:20px;box-shadow:0 12px 35px #0f172a12}.top{padding:18px 20px;margin-bottom:14px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff}.top h1{margin:0;font-size:23px}.top p{margin:5px 0 0;opacity:.9}.controls{padding:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.field label{display:block;font-weight:800;font-size:12px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:11px;background:#fff}.field.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:900;cursor:pointer}.primary{background:#2563eb;color:#fff}.secondary{background:#e2e8f0}.success{background:#16a34a;color:#fff}.status{display:none;margin-top:10px;padding:10px 12px;border-radius:10px;background:#eff6ff;color:#1e40af}.status.show{display:block}.stage{padding:18px;margin-top:14px;overflow:auto}.paper{width:794px;height:1123px;margin:0 auto;background:#fff;position:relative;padding:24px;overflow:hidden;border:1px solid #cbd5e1;font-family:Arial,sans-serif}.paper:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 4% 4%,#dbeafe 0 48px,transparent 49px),radial-gradient(circle at 97% 94%,#fef3c7 0 58px,transparent 59px);pointer-events:none}.head{position:relative;border:2px solid var(--accent,#2563eb);border-radius:18px;padding:12px 14px;margin-bottom:8px;background:linear-gradient(135deg,var(--soft,#eff6ff),#fff);display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center}.heroSvg{width:150px;height:88px;border-radius:12px;background:#fff;border:1px solid #dbe4f0;overflow:hidden}.badge{display:inline-block;background:var(--accent,#2563eb);color:#fff;padding:4px 9px;border-radius:999px;font-size:9px;font-weight:900}.title{font-size:21px;font-weight:900;margin:4px 0}.sub{font-size:9.5px;color:#475569}.identity{display:grid;grid-template-columns:1.5fr .8fr .8fr;gap:7px;margin-top:7px;grid-column:1/-1}.idbox{border-bottom:1px solid #64748b;font-size:9px;padding:4px 3px}.instructions{position:relative;margin:7px 0;padding:7px 9px;border-left:5px solid var(--accent,#2563eb);background:var(--soft,#eff6ff);font-size:9px;border-radius:8px}.questions{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;align-content:start}.q{border:1px solid #dbe4f0;border-radius:9px;padding:6px 7px;break-inside:avoid;background:#fff;min-height:48px}.q.visualQ{background:linear-gradient(135deg,#fff,var(--soft,#eff6ff))}.qnum{font-weight:900;font-size:9.5px}.qtext{font-size:8.7px;line-height:1.25;margin:2px 0 4px}.qimg{width:100%;height:58px;margin:3px 0 5px;border-radius:7px;overflow:hidden;border:1px solid #e2e8f0;background:#f8fafc}.qimg svg{width:100%;height:100%;display:block}.opts{display:grid;grid-template-columns:1fr 1fr;gap:3px}.opt{font-size:7.7px;border:1px solid #e2e8f0;border-radius:6px;padding:3px 4px;background:#f8fafc;display:flex;gap:4px;align-items:center;min-height:23px}.opt b{color:var(--accent,#2563eb)}.optpic{width:22px;height:22px;flex:none;border-radius:4px;overflow:hidden;background:#fff}.optpic svg{width:100%;height:100%}.answerLine{border-bottom:1px solid #64748b;height:19px;margin-top:3px}.essayLines{height:42px;margin-top:4px;background:repeating-linear-gradient(to bottom,transparent 0 12px,#94a3b8 13px 14px)}.typeTag{font-size:6.5px;font-weight:900;color:#fff;background:var(--accent,#2563eb);padding:2px 5px;border-radius:999px;float:right}.footer{position:absolute;left:24px;right:24px;bottom:10px;border-top:1px dashed #cbd5e1;padding-top:4px;display:flex;justify-content:space-between;font-size:7.5px;color:#64748b}.empty{height:100%;display:grid;place-items:center;color:#94a3b8;text-align:center}.loading{opacity:.55;pointer-events:none}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.paper{transform-origin:top left;margin-left:0}}@media(max-width:520px){.wrap{padding:10px}.grid{grid-template-columns:1fr}.top h1{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top card"><h1>🎨 LKPD Visual AI</h1><p>LKPD menarik • ilustrasi sesuai materi • PG + Isian + Essay • 1 halaman A4</p></div>
<div class="controls card">
<div class="grid">
<div class="field"><label>Kelas</label><select id="kelas"><option value="IA">Kelas 1</option><option value="IB">Kelas 1B</option><option value="IIA">Kelas 2</option><option value="IIB">Kelas 2B</option><option value="IIIA">Kelas 3</option><option value="IIIB">Kelas 3B</option><option value="IVA" selected>Kelas 4</option><option value="IVB">Kelas 4B</option><option value="V">Kelas 5</option><option value="VI">Kelas 6</option></select></div>
<div class="field"><label>Mapel</label><input id="mapel" value="IPAS"></div>
<div class="field"><label>Jumlah soal</label><select id="jumlah"><option>10</option><option>15</option><option selected>20</option><option>25</option><option>30</option></select></div>
<div class="field"><label>Gaya</label><select id="gaya"><option value="ceria">Ceria & ramah anak</option><option value="alam">Alam & ilustratif</option><option value="minimal">Minimal modern</option><option value="warna">Warna-warni edukatif</option></select></div>
<div class="field"><label>Komposisi</label><select id="komposisi"><option value="campur" selected>Campuran PG + Isian + Essay</option><option value="pg">Pilihan ganda dominan</option><option value="isian">Isian dominan</option><option value="essay">Essay dominan</option></select></div>
<div class="field full"><label>Materi / permintaan</label><textarea id="materi" rows="3" placeholder="Contoh: Ekosistem. Buat 20 soal, beberapa soal memakai gambar ekosistem/rantai makanan, dengan PG, isian, dan essay."></textarea></div>
</div>
<div class="actions"><button class="btn primary" id="generate">✨ Generate LKPD</button><button class="btn secondary" id="sample">Contoh cepat</button><button class="btn success" id="png">🖼️ Simpan PNG</button><button class="btn secondary" onclick="window.print()">🖨️ Cetak</button></div>
<div id="status" class="status"></div>
</div>
<div class="stage card"><div id="paper" class="paper"><div class="empty"><div><div style="font-size:44px">🧩</div><b>LKPD akan muncul di sini</b><br><small>Masukkan materi lalu tekan Generate LKPD.</small></div></div></div></div>
</div>
<script>
const API_BASE=localStorage.getItem('siApiBase')||'https://adm-sd.adm-sd.workers.dev/api';
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]));
const themes={ceria:['#2563eb','#eff6ff'],alam:['#15803d','#dcfce7'],minimal:['#334155','#f1f5f9'],warna:['#db2777','#fce7f3']};
function className(v){return v.replace(/A$|B$/,'').replace('I','1').replace('II','2').replace('III','3').replace('IV','4')||v}
function topicKind(text){const s=String(text).toLowerCase();if(/ekosistem|rantai makanan|jaring makanan|habitat|biotik|abiotik/.test(s))return'ecosystem';if(/tumbuh|daun|akar|batang|bunga|fotosint/.test(s))return'plant';if(/tata surya|planet|bulan|matahari|gerhana/.test(s))return'space';if(/pecahan|persegi|segitiga|bangun|sudut|geometri/.test(s))return'math';if(/air|siklus air|hujan|sungai|laut/.test(s))return'water';if(/hewan|rantai|ikan|burung|serangga|mamalia/.test(s))return'animal';if(/peta|provinsi|indonesia|pulau|kenampakan/.test(s))return'map';return'education'}
function svg(kind,label=''){const k=topicKind(label||$('materi').value);const common='<rect width="300" height="120" rx="12" fill="#f8fafc"/>';if(k==='ecosystem')return `<svg viewBox="0 0 300 120">${common}<circle cx="255" cy="25" r="16" fill="#facc15"/><path d="M0 88 Q70 65 140 88 T300 78 V120H0Z" fill="#86efac"/><rect x="48" y="54" width="8" height="38" fill="#92400e"/><circle cx="52" cy="45" r="24" fill="#22c55e"/><rect x="185" y="66" width="5" height="24" fill="#92400e"/><circle cx="187" cy="59" r="15" fill="#4ade80"/><path d="M100 92 q18-28 36 0" fill="#60a5fa"/><circle cx="115" cy="79" r="5" fill="#0ea5e9"/><path d="M215 43 q15-12 28 0" stroke="#334155" fill="none" stroke-width="3"/></svg>`;if(k==='plant')return `<svg viewBox="0 0 300 120">${common}<path d="M145 100V48" stroke="#15803d" stroke-width="7"/><path d="M146 65 Q105 38 88 60 Q116 82 146 68Z" fill="#22c55e"/><path d="M146 54 Q185 25 207 49 Q180 68 146 60Z" fill="#16a34a"/><circle cx="145" cy="38" r="14" fill="#f472b6"/><path d="M115 100 Q145 87 175 100" stroke="#92400e" stroke-width="5" fill="none"/></svg>`;if(k==='space')return `<svg viewBox="0 0 300 120">${common}<circle cx="150" cy="60" r="28" fill="#facc15"/><circle cx="70" cy="38" r="9" fill="#60a5fa"/><circle cx="230" cy="82" r="13" fill="#fb7185"/><circle cx="210" cy="25" r="4" fill="#334155"/><circle cx="38" cy="82" r="4" fill="#334155"/><path d="M35 105 Q150 8 270 105" stroke="#94a3b8" fill="none" stroke-dasharray="5 5"/></svg>`;if(k==='math')return `<svg viewBox="0 0 300 120">${common}<path d="M90 25h100v70H90z" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/><path d="M90 60h100M140 25v70" stroke="#2563eb" stroke-width="3"/><circle cx="115" cy="42" r="5" fill="#f97316"/><circle cx="165" cy="78" r="5" fill="#22c55e"/></svg>`;if(k==='water')return `<svg viewBox="0 0 300 120">${common}<circle cx="245" cy="25" r="16" fill="#facc15"/><path d="M0 70 Q55 45 110 70 T220 70 T330 65 V120H0Z" fill="#60a5fa"/><path d="M75 40 Q88 20 101 40" stroke="#94a3b8" stroke-width="4" fill="none"/><path d="M125 38 Q138 18 151 38" stroke="#94a3b8" stroke-width="4" fill="none"/></svg>`;if(k==='animal')return `<svg viewBox="0 0 300 120">${common}<ellipse cx="150" cy="68" rx="48" ry="28" fill="#f59e0b"/><circle cx="115" cy="55" r="20" fill="#fbbf24"/><path d="M105 42l-10-17 18 10M122 38l10-17 2 22" fill="#f59e0b"/><circle cx="110" cy="54" r="3"/><circle cx="120" cy="54" r="3"/><path d="M185 70q28-28 42-3" stroke="#92400e" stroke-width="6" fill="none"/></svg>`;if(k==='map')return `<svg viewBox="0 0 300 120">${common}<path d="M55 25l60 15 70-18 60 20-5 62-60-18-65 20-65-17z" fill="#bbf7d0" stroke="#15803d" stroke-width="3"/><circle cx="150" cy="65" r="8" fill="#ef4444"/><path d="M150 65l0-28" stroke="#ef4444" stroke-width="3"/></svg>`;return `<svg viewBox="0 0 300 120">${common}<circle cx="150" cy="52" r="30" fill="#dbeafe"/><path d="M135 48h30M140 60h20" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><path d="M80 98h140" stroke="#94a3b8" stroke-width="4"/></svg>`}
function normalizeAI(raw,n){let x=raw;if(typeof x==='string'){const m=x.match(/\{[\s\S]*\}/);if(m)try{x=JSON.parse(m[0])}catch{}if(typeof x==='string')return {title:'LKPD '+$('mapel').value,questions:[]}}return x&&Array.isArray(x.questions)?x:{title:'LKPD '+$('mapel').value,questions:[]}}
function fallbackQuestions(n){const kind=topicKind($('materi').value);const arr=[];for(let i=0;i<n;i++){if(i%5===0)arr.push({type:'pg',question:'Perhatikan gambar berikut. Manakah pernyataan yang paling sesuai dengan materi?',options:['Pernyataan yang tepat','Pernyataan kurang tepat','Pernyataan tidak sesuai','Belum dapat ditentukan'],image:true});else if(i%5===1)arr.push({type:'isian',question:'Tuliskan istilah penting yang tepat sesuai materi pada bagian yang kosong.'});else if(i%5===2)arr.push({type:'essay',question:'Jelaskan dengan singkat hubungan atau proses yang kamu pelajari.'});else arr.push({type:'pg',question:'Manakah jawaban yang paling tepat?',options:['Jawaban A','Jawaban B','Jawaban C','Jawaban D']})}return {title:'LKPD '+$('mapel').value+' — '+(kind==='ecosystem'?'Ekosistem':$('materi').value||'Pembelajaran'),questions:arr}}
function qType(q,i){let t=String(q.type||q.jenis||q.jenis_soal||'').toLowerCase();if(t.includes('essay')||t.includes('uraian'))return'essay';if(t.includes('isian'))return'isian';if(t.includes('pg')||t.includes('pilihan'))return'pg';return i%5===1?'isian':i%5===2?'essay':'pg'}
function render(data){const [accent,soft]=themes[$('gaya').value];document.documentElement.style.setProperty('--accent',accent);document.documentElement.style.setProperty('--soft',soft);const n=Number($('jumlah').value);let qs=(data.questions||[]).slice(0,n);if(qs.length<n){const fb=fallbackQuestions(n).questions;for(let i=qs.length;i<n;i++)qs.push(fb[i])}const title=data.title||'LEMBAR KERJA PESERTA DIDIK';$('paper').innerHTML=`<div class="head"><div class="heroSvg">${svg(topicKind(title+' '+$('materi').value))}</div><div><span class="badge">LKPD • KURIKULUM MERDEKA</span><div class="title">${esc(title)}</div><div class="sub">${esc($('mapel').value)} • Kelas ${esc(className($('kelas').value))} • Tahun Ajaran 2026/2027</div></div><div class="identity"><div class="idbox">Nama: ______________________________</div><div class="idbox">Kelas: ______</div><div class="idbox">Tanggal: ______</div></div></div><div class="instructions"><b>Petunjuk:</b> Bacalah soal dengan teliti. Untuk pilihan ganda pilih satu jawaban, isian tulis jawaban singkat, dan essay jawab dengan kalimat yang jelas.</div><div class="questions">${qs.map((q,i)=>{const t=qType(q,i);const img=q.image===true||q.gambar===true||q.visual===true||/gambar|perhatikan ilustrasi|lihat gambar/i.test(q.question||'');return `<div class="q ${img?'visualQ':''}"><span class="typeTag">${t==='pg'?'PILIHAN GANDA':t==='isian'?'ISIAN':'ESSAY'}</span><div class="qnum">${i+1}.</div><div class="qtext">${esc(q.question||q.pertanyaan||'')}</div>${img?`<div class="qimg">${svg(topicKind((q.question||'')+' '+$('materi').value))}</div>`:''}${t==='pg'?`<div class="opts">${(q.options||q.opsi||['A','B','C','D']).slice(0,4).map((o,j)=>`<div class="opt"><b>${String.fromCharCode(65+j)}.</b>${(q.optionImages||q.gambarOpsi)?`<span class="optpic">${svg(topicKind(String(o)))}</span>`:''}<span>${esc(typeof o==='string'?o:o.text||o.teks||'')}</span></div>`).join('')}</div>`:t==='isian'?`<div class="answerLine"></div>`:`<div class="essayLines"></div>`}</div>`}).join('')}</div><div class="footer"><span>Kerjakan dengan jujur • Semangat belajar!</span><span>${n} soal • 1 halaman A4</span></div>`}
function setStatus(t){$('status').textContent=t;$('status').classList.add('show')}
async function generate(){const token=localStorage.getItem('siAuthToken');if(!token){setStatus('❌ Sesi login ADM-SD tidak ditemukan. Login dulu di aplikasi utama.');return}const n=Number($('jumlah').value);const comp=$('komposisi').value;const context=`Buat LKPD SD satu halaman A4 dengan TEPAT ${n} soal. Kelas ${className($('kelas').value)}, mapel ${$('mapel').value}, materi: ${$('materi').value||'materi umum sesuai kelas dan mapel'}. KOMPOSISI: ${comp==='campur'?'campuran seimbang pilihan ganda, isian, dan essay':comp==='pg'?'pilihan ganda dominan dengan tetap menyertakan isian dan essay':comp==='isian'?'isian dominan dengan tetap menyertakan pilihan ganda dan essay':'essay dominan dengan tetap menyertakan pilihan ganda dan isian'}. HASIL WAJIB JSON valid tanpa markdown: {"title":"judul LKPD","questions":[{"type":"pg|isian|essay","question":"...","options":["...","...","...","..."],"image":true} ]}. Untuk PG wajib 4 opsi. Tandai image:true hanya pada soal yang memang lebih menarik bila memakai gambar. Gambar harus sesuai MATERI, bukan ikon random. Buat 5-8 soal visual bila jumlah soal cukup. Untuk opsi yang memang berbentuk gambar, boleh tambahkan optionImages:true. Jangan membuat halaman kedua. Bahasa sesuai siswa SD dan singkat agar muat satu halaman.`;setStatus('🤖 AI menyusun soal, jenis soal, dan ilustrasi sesuai materi...');$('generate').disabled=true;try{const res=await fetch(API_BASE+'/ai/generate',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({jenis:'lkpd',rombel:$('kelas').value,mapel:$('mapel').value,fase:'Fase '+(Number(className($('kelas').value))<=2?'A':Number(className($('kelas').value))<=4?'B':'C'),tahun:'2026/2027',context,tujuan:'LKPD visual satu halaman dengan ilustrasi sesuai materi',durasi:'40 menit',aktivitas:'Campuran pilihan ganda, isian, essay dengan soal visual',jumlahSoal:n,bentukSoal:'Campuran'})});const p=await res.json();if(!res.ok||!p.ok)throw Error(p.message||'AI gagal.');let d=normalizeAI(p.text,n);if(!d.questions||d.questions.length===0)d=fallbackQuestions(n);render(d);setStatus('✅ LKPD selesai: '+n+' soal, campuran PG + Isian + Essay, dengan ilustrasi sesuai materi.');}catch(e){setStatus('❌ '+e.message)}finally{$('generate').disabled=false}}
$('generate').onclick=generate;$('sample').onclick=()=>{$('materi').value='Ekosistem: komponen biotik dan abiotik, rantai makanan, serta hubungan antarmakhluk hidup. Buat beberapa soal dengan gambar ekosistem dan rantai makanan.';generate()};$('png').onclick=async()=>{if(!window.html2canvas){setStatus('❌ Mesin gambar belum siap.');return}setStatus('🖼️ Menyiapkan PNG LKPD...');const c=await html2canvas($('paper'),{scale:2,backgroundColor:'#fff',useCORS:true});const a=document.createElement('a');a.download='LKPD-Visual-'+Date.now()+'.png';a.href=c.toDataURL('image/png');a.click();setStatus('✅ PNG LKPD berhasil dibuat.');};
</script>
</body></html>
