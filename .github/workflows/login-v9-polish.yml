name: Login V9 polish
on:
  push:
    paths:
      - '.github/workflows/login-v9-polish.yml'
permissions:
  contents: write
jobs:
  polish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch login
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css=r'''/* ===== LOGIN V9 FINAL POLISH ===== */
          .login{min-height:100svh!important;padding:20px!important;position:relative!important;isolation:isolate!important;overflow:hidden!important;display:grid!important;place-items:center!important;background:#0b1d32!important}
          .login:before{content:""!important;position:absolute!important;inset:0!important;z-index:-2!important;background:linear-gradient(180deg,rgba(5,22,40,.18),rgba(5,22,40,.70)),url("https://commons.wikimedia.org/wiki/Special:FilePath/Kota%20Bogor%20%26%20Gunung%20Salak%20%28cropped%29.jpg") center/cover no-repeat!important;transform:scale(1.03)!important}
          .login:after{content:""!important;position:absolute!important;inset:0!important;z-index:-1!important;background:radial-gradient(circle at 50% 8%,rgba(255,255,255,.20),transparent 30%),linear-gradient(90deg,rgba(5,22,40,.18),transparent 45%,rgba(5,22,40,.20))!important;pointer-events:none!important}
          .login-card{width:min(370px,calc(100vw - 30px))!important;padding:22px 24px 20px!important;border-radius:26px!important;background:rgba(255,255,255,.94)!important;border:1px solid rgba(255,255,255,.92)!important;box-shadow:0 28px 80px rgba(0,0,0,.28),0 2px 8px rgba(0,0,0,.08)!important;backdrop-filter:blur(16px)!important;-webkit-backdrop-filter:blur(16px)!important;position:relative!important;overflow:hidden!important}
          .login-card:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,#2563eb,#7c3aed,#06b6d4)}
          .login .logo{width:70px!important;height:70px!important;border-radius:19px!important;border:1px solid #e2e8f0!important;box-shadow:0 12px 30px rgba(15,23,42,.10)!important;background:#fff!important}
          .login-card .center{margin-top:11px!important}
          .login-card h1{font-size:25px!important;letter-spacing:-.8px!important;margin:0 0 4px!important;color:#172033!important}
          .login-card .badge{font-size:10px!important;padding:4px 9px!important;margin-top:3px!important;background:#eef2ff!important;color:#4f46e5!important;border:1px solid #e0e7ff!important}
          .login-card form{margin-top:8px!important}
          .login-card label{font-size:11px!important;font-weight:800!important;color:#475569!important;margin:11px 0 5px!important}
          .login-card input{height:42px!important;padding:9px 12px!important;font-size:13px!important;border-radius:12px!important;border:1px solid #d7dee9!important;background:#f8fafc!important}
          .login-card input:focus{background:#fff!important;border-color:#6366f1!important;box-shadow:0 0 0 4px rgba(99,102,241,.10)!important}
          .login-card .password input{padding-right:60px!important}
          .login-card .toggle{top:4px!important;right:5px!important;font-size:11px!important;color:#6366f1!important;font-weight:800!important}
          .login-card .wide{height:43px!important;margin-top:15px!important;border-radius:12px!important;font-size:12px!important;letter-spacing:.2px!important;background:linear-gradient(135deg,#2563eb,#6366f1 55%,#7c3aed)!important;box-shadow:0 10px 22px rgba(79,70,229,.24)!important}
          .login-card .wide:hover{filter:brightness(1.04)!important;transform:translateY(-1px)!important}
          .bogor-corner{top:16px!important;right:18px!important;background:rgba(255,255,255,.90)!important;border:1px solid rgba(255,255,255,.65)!important;box-shadow:0 10px 30px rgba(0,0,0,.16)!important}
          .login-location{top:20px!important;left:20px!important;font-size:10px!important;letter-spacing:1.5px!important;opacity:.92!important}
          @media(max-width:600px){.login{padding:14px!important}.login-card{width:min(348px,calc(100vw - 24px))!important;padding:20px 18px 18px!important}.login .logo{width:64px!important;height:64px!important}.login-card h1{font-size:22px!important}.bogor-corner{top:10px!important;right:10px!important}.login-location{left:12px!important;top:14px!important;font-size:9px!important}}
          @media(max-height:620px) and (orientation:landscape){.login{padding:10px!important}.login-card{width:min(430px,62vw)!important;padding:12px 18px!important;border-radius:20px!important}.login .logo{width:48px!important;height:48px!important}.login-card .center{margin-top:5px!important}.login-card h1{font-size:18px!important}.login-card label{margin:6px 0 3px!important}.login-card input{height:34px!important}.login-card .wide{height:35px!important;margin-top:9px!important}.bogor-corner{display:none!important}.login-location{display:none!important}}
          @media(prefers-reduced-motion:no-preference){.login-card{animation:loginFinalIn .55s cubic-bezier(.2,.8,.2,1) both}@keyframes loginFinalIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}}
          '''
          if 'LOGIN V9 FINAL POLISH' not in s:
              s=s.replace('</style>',css+'\n</style>',1)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/login-v9-polish.yml
          git rm -f .github/workflows/login-v9-polish.yml
          git commit -m 'feat: final premium login layout [skip ci]' || exit 0
          git push origin main
