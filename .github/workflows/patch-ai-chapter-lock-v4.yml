name: Patch AI chapter lock V4
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old="""function aiBookLock(m,k,bab){const b=bookInfo(m,k);if(!b)return{title:'Belum terdaftar',source:'SIBI',chapters:[]};const chapters=Array.isArray(b.chapters)?b.chapters.slice():[];return{title:b.title,source:b.source,year:b.year||'',chapters,bab:bab&&chapters.includes(bab)?bab:''};}"""
          new="""function normalizeBabName(v){const s=String(v??'').trim();return s.replace(/^BAB\\s*\\d+\\s*[—-]\\s*/i,'').trim();}
function aiBookLock(m,k,bab){const b=bookInfo(m,k);if(!b)return{title:'Belum terdaftar',source:'SIBI',chapters:[]};const chapters=Array.isArray(b.chapters)?b.chapters.slice():[];const raw=normalizeBabName(bab);const wanted=/^\\d+$/.test(raw)&&chapters[Number(raw)]?chapters[Number(raw)]:raw;return{title:b.title,source:b.source,year:b.year||'',chapters,bab:wanted&&chapters.includes(wanted)?wanted:''};}"""
          if old not in s:
              raise SystemExit('aiBookLock block not found')
          s=s.replace(old,new,1)

          old="""function aiBookInstruction(m,k,bab){const r=aiBookLock(m,k,bab);if(!r.title||r.title==='Belum terdaftar')return'';return`SUMBER BUKU TERKUNCI: gunakan hanya buku resmi berikut. Judul: ${r.title}. Sumber: ${r.source||'SIBI'}. Tahun/Edisi: ${r.year||'sesuai metadata'}. ${r.bab?'BAB/UNIT WAJIB: '+r.bab+'. ':''}${r.chapters.length?'Daftar BAB/UNIT terverifikasi: '+r.chapters.join(' | ')+'. ':''}Jangan mengganti judul buku, jangan mengarang BAB/Unit, dan jangan memakai struktur dari buku lain.`;}"""
          new="""function aiBookInstruction(m,k,bab){const r=aiBookLock(m,k,bab);if(!r.title||r.title==='Belum terdaftar')return'';return`SUMBER BUKU TERKUNCI: gunakan hanya buku resmi berikut. Judul: ${r.title}. Sumber: ${r.source||'SIBI'}. Tahun/Edisi: ${r.year||'sesuai metadata'}. ${r.bab?'BAB/UNIT WAJIB: '+r.bab+'. ':''}${r.chapters.length?'Daftar BAB/UNIT terverifikasi: '+r.chapters.join(' | ')+'. ':''}Jangan mengganti judul buku, jangan mengarang BAB/Unit, dan jangan memakai struktur dari buku lain.`;}"""
          if old not in s:
              raise SystemExit('aiBookInstruction block not found')
          s=s.replace(old,new,1)

          old="""context:[ctx,aiBookInstruction(m,k,type==='rpm'?id('rpmBab').value:'')].filter(Boolean).join('\\n\\n'),existing:tx.value,bookReference:aiBookLock(m,k,type==='rpm'?id('rpmBab').value:''),bookLock:true"""
          new="""context:[ctx,aiBookInstruction(m,k,type==='rpm'?(babList(m,k)[Number(id('rpmBab').value||0)]||''):'')].filter(Boolean).join('\\n\\n'),existing:tx.value,bookReference:aiBookLock(m,k,type==='rpm'?(babList(m,k)[Number(id('rpmBab').value||0)]||''):''),bookLock:true"""
          if old not in s:
              raise SystemExit('generateDoc request block not found')
          s=s.replace(old,new,1)

          old="""if(t==='rpm')extra.bab=bab.options[bab.selectedIndex]?.textContent||'';"""
          new="""if(t==='rpm')extra.bab=normalizeBabName(bab.options[bab.selectedIndex]?.textContent||'');"""
          if old not in s:
              raise SystemExit('AI SUPER BAB line not found')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          print('patched')
          PY
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>',s,re.I)
          if not blocks: raise SystemExit('No script blocks')
          Path('/tmp/index.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/index.js
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "fix: normalize selected book chapter in all AI generators"
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/patch-ai-chapter-lock-v4.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "chore: remove temporary AI chapter lock workflow"
          git push
