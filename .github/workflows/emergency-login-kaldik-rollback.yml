name: Emergency Login Kaldik Rollback
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Kaldik loader temporarily
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="assets/perangkat-kaldik-super-v1.js"></script>'
          if tag in s:
              s=s.replace(tag+'\n','').replace(tag,'')
              p.write_text(s,encoding='utf-8')
              print('Kaldik loader removed temporarily for login recovery.')
          else:
              print('Kaldik loader not present; no change.')
      - name: Validate login boundary
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'assets/perangkat-kaldik-super-v1.js' not in s
          assert '<script src="assets/absensi.js"' in s
          print('PASS: Kaldik loader isolated; login boundary preserved.')
      - name: Commit recovery
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: isolate Kaldik loader from login'
          git push
