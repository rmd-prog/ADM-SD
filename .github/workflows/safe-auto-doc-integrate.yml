name: Safe Auto Document Super Integration

on:
  push:
    branches:
      - dev-auto-doc-safe-2026-09-10

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Safely attach Auto Document Super
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="assets/auto-doc-super.js"></script>'

          if tag in s:
              print('Auto Document Super already attached.')
              raise SystemExit(0)

          marker = '</script>'
          pos = s.rfind(marker)
          if pos < 0:
              raise SystemExit('SAFE STOP: no closing script tag found')

          insert_at = pos + len(marker)
          s = s[:insert_at] + '\n' + tag + s[insert_at:]
          p.write_text(s, encoding='utf-8')
          print('Safe integration prepared.')
          PY

      - name: Validate HTML/JS boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          tag = '<script src="assets/auto-doc-super.js"></script>'
          if s.count(tag) != 1:
              raise SystemExit(f'SAFE STOP: expected exactly one loader tag, found {s.count(tag)}')
          tag_pos = s.rfind(tag)
          tag_close_pos = tag_pos + len(tag) - len('</script>')
          last_close_pos = s.rfind('</script>')
          if tag_close_pos != last_close_pos:
              raise SystemExit('SAFE STOP: loader is not the final script boundary')
          print('Validation OK.')
          PY

      - name: Commit safe integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'feat: safely integrate Auto Document Super'
          git push
