name: Safe Kurikulum Super Schedule Integrate
on:
  push:
    branches: [main]
    paths:
      - 'assets/kurikulum-super-schedule.js'
      - '.github/workflows/safe-kurikulum-super-integrate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Safely load schedule engine
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="assets/kurikulum-super-schedule.js"></script>'
          if tag in s:
              print('Schedule loader already present')
          else:
              marker='<script src="assets/ai-super-smart.js"></script>'
              if marker in s:
                  s=s.replace(marker, marker+'\n'+tag, 1)
              else:
                  end='</body>'
                  if end not in s: raise SystemExit('No safe insertion point found')
                  s=s.replace(end, tag+'\n'+end, 1)
              p.write_text(s,encoding='utf-8')
          s=p.read_text(encoding='utf-8')
          if s.count(tag)!=1: raise SystemExit('Expected exactly one schedule loader')
          if '</script>' not in s: raise SystemExit('HTML script boundary missing')
          PY
      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'ci: load Kurikulum Super schedule engine'
          git push
