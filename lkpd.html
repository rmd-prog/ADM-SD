<body><div class="wrap">
<div class="top card"><h1>LKPD Visual AI</h1><p>Materi mengikuti kelas dan mata pelajaran • visual hanya bila benar-benar relevan • 1 lembar</p></div>
<div class="controls card"><div class="grid">

<div class="field"><label>Mapel</label><select id="mapel" disabled></select></div>
<div class="field"><label>Bab / Materi</label><select id="bab" disabled></select></div>
<div class="field"><label>Subbab / Topik</label><select id="subbab" disabled></select></div>
<div class="field"><label>Ukuran kertas</label><select id="kertas"><option value="a4">A4 — 21 × 29,7 cm</option><option value="f4" selected>F4 / Folio — 8,5 × 13 inci</option><option value="letter">Letter — 8,5 × 11 inci</option></select></div>
<div class="field"><label>Jumlah soal</label><select id="jumlah"><option>10</option><option>15</option><option selected>20</option><option>25</option><option>30</option></select></div>
<div class="field"><label>Komposisi</label><select id="komposisi"><option value="campur">Campuran PG + Isian + Essay</option><option value="pg">PG dominan</option><option value="isian">Isian dominan</option><option value="essay">Essay dominan</option></select></div>
<div class="field full"><label>Permintaan tambahan (opsional)</label><textarea id="materi" rows="2" placeholder="Contoh: soal kontekstual tentang lingkungan sekolah. Jangan gunakan gambar jika tidak diperlukan."></textarea></div>
</div><div class="actions"><button class="btn primary" id="generate">Generate LKPD</button><button class="btn secondary" id="sample">Contoh cepat</button><button class="btn success" id="png">Simpan PNG</button><button class="btn secondary" onclick="window.print()">Cetak</button></div><div id="status" class="status"></div></div>
<div class="stage card"><div id="paper" class="paper f4"><div style="height:100%;display:grid;place-items:center;color:#94a3b8;text-align:center"><div><b>LKPD akan muncul di sini</b><br><small>Pilih kelas, mapel, bab dan subbab lalu Generate.</small></div></div></div></div></div>

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function phase(k){return k<=2?'A':k<=4?'B':'C'}
function fill(sel,items,placeholder){sel.innerHTML='<option value="">'+placeholder+'</option>'+(items||[]).map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');sel.disabled=!(items&&items.length)}
function refreshMapel(){const k=+$('kelas').value;let names=Object.keys(curriculum).filter(m=>curriculum[m][k]);fill($('mapel'),names,'Pilih mata pelajaran');refreshBab()}
function refreshBab(){const k=+$('kelas').value,m=$('mapel').value,data=curriculum[m]?.[k]||{};fill($('bab'),Object.keys(data),'Pilih bab / materi');refreshSubbab()}
function refreshSubbab(){const k=+$('kelas').value,m=$('mapel').value,b=$('bab').value,data=curriculum[m]?.[k]?.[b]||[];fill($('subbab'),data,'Pilih subbab / topik')}
$('kelas').onchange=refreshMapel;$('mapel').onchange=refreshBab;$('bab').onchange=refreshSubbab;
function paperSize(){const p=$('kertas').value,el=$('paper');el.className='paper '+p;const sizes={a4:[210,297],f4:[215.9,330.2],letter:[215.9,279.4]},[w,h]=sizes[p];let st=document.getElementById('page-size-style');if(!st){st=document.createElement('style');st.id='page-size-style';document.head.appendChild(st)}st.textContent='@page{size:'+w+'mm '+h+'mm;margin:0}'}$('kertas').onchange=paperSize;
function comp(n){const c=$('komposisi').value;if(c==='pg')return[Math.ceil(n*.6),Math.floor(n*.25),n-Math.ceil(n*.6)-Math.floor(n*.25)];if(c==='isian')return[Math.floor(n*.25),Math.ceil(n*.5),n-Math.floor(n*.25)-Math.ceil(n*.5)];if(c==='essay')return[Math.floor(n*.25),Math.floor(n*.25),n-Math.floor(n*.25)-Math.floor(n*.25)];return[Math.round(n*.5),Math.round(n*.25),n-Math.round(n*.5)-Math.round(n*.25)]}
function parse(raw){if(typeof raw!=='string')return raw;const a=raw.indexOf('{'),b=raw.lastIndexOf('}');if(a>=0&&b>a)try{return JSON.parse(raw.slice(a,b+1))}catch{}return null}
function norm(d){if(!d||!Array.isArray(d.questions))return{title:'LKPD '+$('mapel').value,questions:[]};return{title:d.title||'LKPD '+$('mapel').value,questions:d.questions.map(q=>({type:String(q.type||q.jenis||'pilihan_ganda').toLowerCase().replace('pilihan ganda','pilihan_ganda'),question:q.question||q.pertanyaan||'',options:Array.isArray(q.options)?q.options.map(o=>typeof o==='string'?o:o.text||''):[],visual:!!q.visual,visual_type:q.visual_type||'',visual_description:q.visual_description||''}))}}
function visualKind(q){const s=(q.visual_description+' '+q.question).toLowerCase();if(/rantai makanan|jaring-jaring makanan|ekosistem|biotik|abiotik|habitat/.test(s))return'foodweb';if(/bagian tumbuhan|akar|batang|daun|bunga|fotosintesis/.test(s))return'plant';if(/pecahan|persegi|segitiga|bangun|sudut|keliling|luas|volume|desimal/.test(s))return'math';if(/cahaya|bunyi|magnet|listrik/.test(s))return'science';if(/air|siklus air|hujan|penguapan|kondensasi/.test(s))return'water';if(/planet|tata surya|bulan|matahari/.test(s))return'space';if(/peta|provinsi|pulau|indonesia/.test(s))return'map';if(/lari|lompat|menendang|melempar|menangkap/.test(s))return'sport';if(/pancasila|gotong royong|musyawarah|keberagaman/.test(s))return'civic';if(/garis|warna|bentuk|gambar|seni rupa/.test(s))return'art';return'none'}
function svgFor(q){const k=visualKind(q),bg='<rect width="300" height="100" rx="8" fill="#f8fafc"/>';if(k==='none')return'';if(k==='foodweb')return'<svg viewBox="0 0 300 100">'+bg+'<circle cx="55" cy="70" r="10" fill="#86efac"/><circle cx="150" cy="48" r="10" fill="#fde68a"/><circle cx="245" cy="25" r="10" fill="#bfdbfe"/><path d="M65 66L140 51M160 44L235 28" stroke="#475569" stroke-width="2"/><path d="M150 58L245 75M65 76L140 54" stroke="#64748b" stroke-width="2"/><text x="30" y="94" font-size="9" fill="#334155">produsen</text><text x="128" y="70" font-size="9" fill="#334155">konsumen</text><text x="225" y="94" font-size="9" fill="#334155">predator</text></svg>';if(k==='plant')return'<svg viewBox="0 0 300 100">'+bg+'<path d="M150 82V40" stroke="#166534" stroke-width="5"/><path d="M150 58Q110 35 88 48Q113 70 150 63M150 51Q190 28 215 40Q188 61 150 57" fill="#4ade80"/><path d="M110 84Q150 70 190 84" stroke="#92400e" stroke-width="5" fill="none"/><text x="10" y="18" font-size="9" fill="#334155">akar • batang • daun</text></svg>';if(k==='math')return'<svg viewBox="0 0 300 100">'+bg+'<rect x="35" y="22" width="70" height="55" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><path d="M140 77L175 22 210 77Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="228" y="52" font-size="18" fill="#334155">½</text><text x="30" y="92" font-size="9" fill="#334155">bangun & pecahan</text></svg>';if(k==='science')return'<svg viewBox="0 0 300 100">'+bg+'<circle cx="80" cy="50" r="25" fill="#fde68a" stroke="#d97706" stroke-width="2"/><path d="M115 50h80M175 40l20 10-20 10" stroke="#2563eb" stroke-width="3" fill="none"/><rect x="220" y="32" width="35" height="36" rx="4" fill="#dbeafe" stroke="#2563eb"/></svg>';if(k==='water')return'<svg viewBox="0 0 300 100">'+bg+'<circle cx="65" cy="28" r="16" fill="#fde68a"/><path d="M0 75Q65 52 130 75T300 70V100H0Z" fill="#93c5fd"/><path d="M110 38Q120 20 130 38M150 38Q160 20 170 38" stroke="#94a3b8" stroke-width="3" fill="none"/><path d="M205 30v25M225 30v25" stroke="#2563eb" stroke-width="3"/></svg>';if(k==='space')return'<svg viewBox="0 0 300 100"><rect width="300" height="100" rx="8" fill="#0f172a"/><circle cx="70" cy="45" r="18" fill="#fde68a"/><circle cx="180" cy="50" r="25" fill="#93c5fd"/><circle cx="250" cy="25" r="8" fill="#fda4af"/><circle cx="35" cy="20" r="2" fill="#fff"/><circle cx="270" cy="78" r="2" fill="#fff"/></svg>';if(k==='map')return'<svg viewBox="0 0 300 100">'+bg+'<path d="M25 25l65 12 55-18 70 18 50-12-12 55-65-10-60 18-90-17z" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/><circle cx="145" cy="48" r="5" fill="#dc2626"/><text x="105" y="92" font-size="9" fill="#334155">peta lokasi</text></svg>';if(k==='sport')return'<svg viewBox="0 0 300 100">'+bg+'<circle cx="150" cy="34" r="10" fill="#f1f5f9" stroke="#334155"/><path d="M150 44v27M150 52l-22 14M150 52l22 14M150 71l-18 18M150 71l18 18" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/></svg>';if(k==='civic')return'<svg viewBox="0 0 300 100">'+bg+'<circle cx="100" cy="50" r="27" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><path d="M100 30l6 13h14l-11 8 4 14-13-8-13 8 4-14-11-8h14z" fill="#dc2626"/><circle cx="200" cy="50" r="27" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><path d="M185 50h30M200 35v30" stroke="#2563eb" stroke-width="4"/></svg>';return'<svg viewBox="0 0 300 100">'+bg+'<path d="M35 75L80 30 125 75M165 70h90M180 55h60" stroke="#db2777" stroke-width="5" fill="none"/><circle cx="80" cy="30" r="8" fill="#f9a8d4"/></svg>'}
function headerSvg(){return'<svg viewBox="0 0 300 100"><rect width="300" height="100" rx="8" fill="#f8fafc"/><rect x="62" y="22" width="100" height="62" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><path d="M72 34h80M72 47h80M72 60h58" stroke="#2563eb" stroke-width="3"/><path d="M190 76l18-52 17 6-18 52z" fill="#fbbf24" stroke="#92400e" stroke-width="2"/><circle cx="214" cy="25" r="7" fill="#fca5a5"/></svg>'}
function render(d){const n=+$('jumlah').value,[ac,soft]=themes[$('mapel').value]||['#166534','#ecfdf5'];document.documentElement.style.setProperty('--accent',ac);document.documentElement.style.setProperty('--soft',soft);paperSize();const qs=d.questions.slice(0,n),cols=n>=21?3:2,fit=n>=30?'fit-30':n>=25?'fit-25':'';$('paper').className='paper '+$('kertas').value+' '+fit;let h='<div class="head"><div class="hero">'+headerSvg()+'</div><div><span class="badge">LKPD • KURIKULUM MERDEKA</span><div class="title">'+esc(d.title)+'</div><div class="sub">'+esc($('mapel').value)+' • Kelas '+esc($('kelas').value)+' • '+esc($('bab').value)+' • '+esc($('subbab').value)+'</div></div><div class="identity"><div class="id">Nama: _______________________</div><div class="id">Kelas: ______</div><div class="id">Tanggal: ______</div></div></div><div class="instructions"><b>Petunjuk:</b> PG pilih satu jawaban; isian tulis singkat; essay jawab jelas.</div><div class="questions" style="grid-template-columns:repeat('+cols+',1fr)">';qs.forEach((q,i)=>{const t=q.type==='essay'?'ESSAY':q.type==='isian'?'ISIAN':'PG',visual=q.visual&&visualKind(q)!=='none';h+='<div class="q '+(visual?'visual':'')+'"><div class="qnum">'+(i+1)+'. <span class="tag">'+t+'</span></div><div class="qt">'+esc(q.question)+'</div>'+(visual?'<div class="qimg">'+svgFor(q)+'</div>':'');if(t==='PG')h+='<div class="opts">'+q.options.slice(0,4).map((o,j)=>'<div class="opt"><b>'+String.fromCharCode(65+j)+'.</b>'+esc(o)+'</div>').join('')+'</div>';else if(t==='ISIAN')h+='<div class="line"></div>';else h+='<div class="essay"></div>';h+='</div>'});h+='</div><div class="foot"><span>Kerjakan dengan jujur • Semangat belajar!</span><span>'+qs.length+' soal • 1 lembar '+$('kertas').value.toUpperCase()+'</span></div>';$('paper').innerHTML=h}
async function ask(token,count,start){const n=+$('jumlah').value,[pg,is,es]=comp(n),k=+$('kelas').value,m=$('mapel').value,b=$('bab').value,s=$('subbab').value,extra=$('materi').value.trim();const context=`Buat TEPAT ${count} soal LKPD SD untuk bagian ${start+1}-${start+count}. Kelas ${k}, fase ${phase(k)}, mapel ${m}, materi/bab ${b}, subbab ${s}. Jangan memakai materi dari kelas lain. Permintaan tambahan: ${extra||'tidak ada'}. Komposisi total: ${pg} pilihan_ganda, ${is} isian, ${es} essay. JSON valid tanpa markdown: {"title":"judul LKPD","questions":[{"type":"pilihan_ganda|isian|essay","question":"pertanyaan","options":["opsi A","opsi B","opsi C","opsi D"],"visual":false,"visual_type":"foodweb|plant|math|science|water|space|map|sport|civic|art|none","visual_description":""}]}. ATURAN VISUAL SANGAT KETAT: visual=false sebagai default. Hanya true jika pertanyaan memang membutuhkan objek/diagram/gambar untuk dijawab atau dipahami. Jika true, visual_type dan visual_description harus persis sesuai objek yang disebut soal. Jangan pernah memakai visual dekoratif. Jangan memberi gambar pada semua soal. Opsi PG hanya teks, tanpa emoji, ikon, gambar, simbol dekoratif. Semua soal harus benar-benar sesuai kelas, mapel, bab dan subbab. Jangan mencampur materi kelas lain. Tepat ${count} questions.`;const r=await fetch(API_BASE+'/ai/generate',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({jenis:'lkpd',rombel:String(k),mapel:m,fase:'Fase '+phase(k),tahun:'2026/2027',context,tujuan:'LKPD satu lembar '+$('kertas').value.toUpperCase(),durasi:'40 menit',aktivitas:'latihan sesuai materi terpilih',jumlahSoal:count,bentukSoal:'Campuran'})});const p=await r.json();if(!r.ok||!p.ok)throw Error(p.message||'AI gagal');return norm(parse(p.text))}
async function generate(){const token=localStorage.getItem('siAuthToken');if(!token)return status('Sesi login ADM-SD tidak ditemukan. Login dulu di aplikasi utama.');if(!$('kelas').value||!$('mapel').value||!$('bab').value||!$('subbab').value)return status('Pilih kelas, mapel, bab dan subbab terlebih dahulu.');const n=+$('jumlah').value;$('generate').disabled=true;$('generate').textContent='Sedang Generate...';let timer;try{const msgs=['Menyusun kisi-kisi sesuai kelas...','Memastikan materi sesuai mapel dan bab...','Memeriksa relevansi visual...','Menata satu lembar...'];let mi=0;status(msgs[0],true);timer=setInterval(()=>{mi=(mi+1)%msgs.length;status(msgs[mi],true)},1600);let all=[],title='';for(let pass=0;pass<3&&all.length<n;pass++){const d=await ask(token,n-all.length,all.length);if(!title)title=d.title;for(const q of d.questions){if(q.question&&!all.some(x=>x.question.trim().toLowerCase()===q.question.trim().toLowerCase()))all.push(q);if(all.length>=n)break}}if(all.length!==n)throw Error('AI baru menghasilkan '+all.length+' dari '+n+' soal. Generate ulang.');render({title,questions:all});status('Selesai! '+n+' soal • '+$('kertas').value.toUpperCase())}catch(e){status('Gagal: '+e.message)}finally{clearInterval(timer);$('generate').disabled=false;$('generate').textContent='Generate LKPD'}}
function status(t,loading=false){$('status').innerHTML=(loading?'<span class="loader"></span>':'')+'<span>'+esc(t)+'</span>';$('status').classList.add('show')}
$('generate').onclick=generate;$('sample').onclick=()=>{$('materi').value='Soal kontekstual sesuai materi yang dipilih. Jangan gunakan gambar kecuali benar-benar diperlukan.';generate()};$('png').onclick=async()=>{if(!window.html2canvas)return status('Mesin PNG belum siap.');status('Menyiapkan PNG...',true);try{const c=await html2canvas($('paper'),{scale:2,backgroundColor:'#fff',useCORS:true}),a=document.createElement('a');a.download='LKPD-'+$('mapel').value+'-Kelas-'+$('kelas').value+'-'+$('kertas').value+'.png';a.href=c.toDataURL('image/png');a.click();status('PNG berhasil dibuat.')}catch(e){status('Gagal membuat PNG: '+e.message)}};
paperSize();
</script></body></html>
