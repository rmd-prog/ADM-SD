name: Login Final Fix
on:
  push:
    paths:
      - '.github/login-final-trigger.txt'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch login
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='''async function remoteLogin(username,password){\n  let res;\n  try{\n    res=await fetch(LOGIN_API,{\n      method:'POST',\n      mode:'cors',\n      cache:'no-store',\n      headers:{'Content-Type':'application/json','Accept':'application/json'},\n      body:JSON.stringify({username:String(username),password:String(password)})\n    });\n  }catch(e){\n    throw new Error('Worker tidak dapat dihubungi. Periksa internet atau alamat Worker.');\n  }'''
          new='''async function remoteLogin(username,password){\n  let res;\n  const controller=new AbortController();\n  const timer=setTimeout(()=>controller.abort(),15000);\n  try{\n    res=await fetch(LOGIN_API,{\n      method:'POST',\n      mode:'cors',\n      cache:'no-store',\n      headers:{'Content-Type':'application/json','Accept':'application/json'},\n      body:JSON.stringify({username:String(username),password:String(password)}),\n      signal:controller.signal\n    });\n  }catch(e){\n    if(e&&e.name==='AbortError')throw new Error('Server login tidak merespons dalam 15 detik. Worker/D1 sedang bermasalah atau belum aktif.');\n    throw new Error('Worker tidak dapat dihubungi. Periksa internet atau alamat Worker.');\n  }finally{clearTimeout(timer)}'''
          if old not in s: raise SystemExit('remoteLogin target tidak ditemukan')
          s=s.replace(old,new,1)
          old2='''  updateTeacherProfile(t);\n  id('loginScreen').style.display='none';id('app').style.display='block';window.scrollTo({top:0,left:0,behavior:'auto'});document.documentElement.scrollTop=0;document.body.scrollTop=0;id('loginError').style.display='none';\n  applyClassLock();syncRoleMenu();initAIGenerator();renderBookBasisStatus();renderStats();renderStudents();renderScores();renderReport();showPage((t.role==='guru'||t.role==='guru_mapel')?'students':'dashboard');\n  // Sinkronisasi D1 berjalan di belakang layar agar login tidak tertahan.\n  syncRemoteData(t).catch(err=>console.warn('Sinkronisasi D1 gagal:',err));\n  setTimeout(()=>showWelcome(t),220);'''
          new2='''  updateTeacherProfile(t);\n  id('loginScreen').style.display='none';\n  id('app').style.display='block';\n  window.scrollTo(0,0);document.documentElement.scrollTop=0;document.body.scrollTop=0;id('loginError').style.display='none';\n  try{applyClassLock()}catch(e){console.warn('Login init class lock:',e)}\n  try{syncRoleMenu()}catch(e){console.warn('Login init role menu:',e)}\n  try{initAIGenerator()}catch(e){console.warn('Login init AI:',e)}\n  try{renderBookBasisStatus()}catch(e){console.warn('Login init book basis:',e)}\n  try{renderStats()}catch(e){console.warn('Login init stats:',e)}\n  try{renderStudents()}catch(e){console.warn('Login init students:',e)}\n  try{renderScores()}catch(e){console.warn('Login init scores:',e)}\n  try{renderReport()}catch(e){console.warn('Login init report:',e)}\n  try{showPage((t.role==='guru'||t.role==='guru_mapel')?'students':'dashboard')}catch(e){console.warn('Login init page:',e)}\n  syncRemoteData(t).catch(err=>console.warn('Sinkronisasi D1 gagal:',err));\n  setTimeout(()=>showWelcome(t),220);'''
          if old2 not in s: raise SystemExit('finishLogin target tidak ditemukan')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          node --check src/index.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: make login fail-safe and timeout worker [skip ci]'
          git push origin main
