name: Safe Perangkat Pembelajaran SUPER
on:
  push:
    branches: [feat-perangkat-pembelajaran-super-2026-09-10]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Safely add loader
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="assets/perangkat-pembelajaran-super.js"></script>'
          if tag in s:
              print('loader already present')
              raise SystemExit(0)
          marker='</body>'
          if marker not in s:
              raise SystemExit('missing body boundary; refusing to modify index.html')
          s=s.replace(marker, tag+'\n'+marker, 1)
          p.write_text(s,encoding='utf-8')
          print('loader inserted safely before body close')
          PY
          test "$(grep -o 'assets/perangkat-pembelajaran-super.js' index.html | wc -l)" -eq 1
      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'ci: load Perangkat Pembelajaran SUPER'
          git push
