name: Safe PROMES Super Integrate
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Safely load PROMES Super
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="assets/promes-super-calendar.js"></script>'
          if tag in s:
              print('PROMES loader already present')
              raise SystemExit(0)
          anchor='<script src="assets/kurikulum-super-schedule.js"></script>'
          if anchor not in s:
              raise SystemExit('Schedule loader not found; refusing to modify index.html')
          s=s.replace(anchor, anchor+'\n'+tag, 1)
          if s.count(tag)!=1:
              raise SystemExit('PROMES loader count validation failed')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- index.html; then
            echo 'No integration changes'
            exit 0
          fi
          git add index.html
          git commit -m 'ci: safely load PROMES Super calendar'
          git push
