name: Apply AI Book Lock V2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Worker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/index.js')
          s = p.read_text()
          old = '''        if(!text)return json({ok:false,message:"AI tidak mengembalikan isi dokumen."},502);\n        return json({ok:true,jenis,text,model,bookReference: bookReference || null,bookLock});'''
          new = '''        if(!text)return json({ok:false,message:"AI tidak mengembalikan isi dokumen."},502);\n\n        // BOOK LOCK V2: metadata buku/BAB selalu dipasang ulang oleh Worker\n        // agar hasil yang tampil di frontend tidak bisa kehilangan identitas sumber.\n        let finalText = text;\n        if (bookLock && bookTitle) {\n          const lockLines = [\n            "🔒 SUMBER BUKU TERKUNCI",\n            `Judul buku: ${bookTitle}`,\n            `Sumber: ${bookSource || "SIBI"}`,\n            `Tahun/Edisi: ${bookYear || "sesuai metadata"}`\n          ];\n          if (bookBab) lockLines.push(`BAB/UNIT: ${bookBab}`);\n          if (bookChapters.length) lockLines.push(`Daftar BAB/UNIT terverifikasi: ${bookChapters.join(" | ")}`);\n          const lockHeader = lockLines.join("\\n") + "\\n\\n";\n          // Jangan pernah mengganti isi guru secara diam-diam; metadata terkunci\n          // ditempatkan di paling atas sebagai identitas sumber yang authoritative.\n          finalText = lockHeader + finalText;\n        }\n        return json({ok:true,jenis,text:finalText,model,bookReference: bookReference || null,bookLock,bookLockEnforced: !!(bookLock && bookTitle)});'''
          if old not in s:
              raise SystemExit('target block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          node --check src/index.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js
          git commit -m "fix: enforce AI book lock in generated output" || exit 0
          git push origin main
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git rm -f .github/workflows/patch-ai-lock-v2.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary patch workflow" || exit 0
          git push origin main || true