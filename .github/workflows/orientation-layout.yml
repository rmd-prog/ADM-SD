name: Clean login images and school name
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - .github/workflows/orientation-layout.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Clean login page
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\s*<div class="bogor-corner">.*?</div>', '', s, count=1, flags=re.S)
          s=re.sub(r'\s*<div class="login-location">.*?</div>', '', s, count=1)
          s=re.sub(r'\s*<img class="login-school"[^>]*>', '', s, count=1)
          s=re.sub(r'\s*<img class="login-kujang"[^>]*>', '', s, count=1)
          start=s.find('/* ===== GURU+ SD V9 • BOGOR LOGIN ===== */')
          if start<0: start=s.find('/* ===== GURU+ SD V9 • LOGIN CLEAN ===== */')
          end=s.find('</style>', start)
          if start>=0 and end>=0:
              css=r'''/* ===== GURU+ SD V9 • LOGIN CLEAN ===== */
          body{font-size:14px}
          h1,h2,h3{letter-spacing:-.25px}
          .page h2{font-size:22px!important}.panel{font-size:14px}.stat b{font-size:23px}.navbtn,.navgroup{font-size:13px}
          .login{position:relative;isolation:isolate;overflow:hidden;min-height:100svh;padding:20px!important;display:grid!important;place-items:center!important;background:radial-gradient(circle at 12% 8%,rgba(37,99,235,.18),transparent 28%),radial-gradient(circle at 88% 90%,rgba(124,58,237,.14),transparent 30%),linear-gradient(135deg,#eff6ff,#f8fafc 52%,#eef2ff)!important}
          .login:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(135deg,rgba(37,99,235,.05),transparent 45%,rgba(6,182,212,.05));pointer-events:none}
          .login-card{width:min(370px,calc(100vw - 30px))!important;padding:22px 24px 20px!important;border-radius:26px!important;background:rgba(255,255,255,.94)!important;border:1px solid rgba(255,255,255,.95)!important;box-shadow:0 28px 80px rgba(15,23,42,.16),0 2px 8px rgba(15,23,42,.06)!important;backdrop-filter:blur(16px)!important;-webkit-backdrop-filter:blur(16px)!important;position:relative!important;overflow:hidden!important}
          .login-card:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,#2563eb,#7c3aed,#06b6d4)}
          .login .logo{width:70px!important;height:70px!important;border-radius:19px!important;margin:auto!important;box-shadow:0 12px 30px rgba(15,23,42,.10)!important}
          .login-card .center{margin-top:11px!important}.login-card h1{font-size:25px!important;letter-spacing:-.8px!important;margin:0 0 4px!important;color:#172033!important}
          .school-name{display:inline-block;margin:7px auto 2px;padding:6px 16px;border-radius:999px;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;font-size:13px;font-weight:900;letter-spacing:.2px;box-shadow:0 8px 20px rgba(79,70,229,.18)}
          .school-city{font-size:11px;font-weight:800;color:#64748b;letter-spacing:1.2px;margin-top:5px}
          .login-card .badge{font-size:10px!important;padding:4px 9px!important;margin-top:3px!important;background:#eef2ff!important;color:#4f46e5!important;border:1px solid #e0e7ff!important}
          .login-card form{margin-top:8px!important}.login-card label{font-size:11px!important;font-weight:800!important;color:#475569!important;margin:11px 0 5px!important}
          .login-card input{height:42px!important;padding:9px 12px!important;font-size:13px!important;border-radius:12px!important;border:1px solid #d7dee9!important;background:#f8fafc!important}.login-card input:focus{background:#fff!important;border-color:#6366f1!important;box-shadow:0 0 0 4px rgba(99,102,241,.10)!important}
          .login-card .password input{padding-right:60px!important}.login-card .toggle{top:4px!important;right:5px!important;font-size:11px!important;color:#6366f1!important;font-weight:800!important}
          .login-card .wide{height:43px!important;margin-top:15px!important;border-radius:12px!important;font-size:12px!important;letter-spacing:.2px!important;background:linear-gradient(135deg,#2563eb,#6366f1 55%,#7c3aed)!important;box-shadow:0 10px 22px rgba(79,70,229,.24)!important}
          @media(max-width:600px){.login{padding:14px!important}.login-card{width:min(348px,calc(100vw - 24px))!important;padding:20px 18px 18px!important}.login .logo{width:64px!important;height:64px!important}.login-card h1{font-size:22px!important}.school-name{font-size:12px;padding:6px 14px}}
          '''
              s=s[:start]+css+s[end:]
          old='<h1>🚀 GURU+ SD</h1><div class="badge" style="margin-top:10px">TA 2026/2027 • V9 FINAL</div>'
          new='<h1>🚀 GURU+ SD</h1><div class="school-name">SDN Muarasari 1</div><div class="school-city">KOTA BOGOR</div><div class="badge" style="margin-top:10px">TA 2026/2027 • V9 FINAL</div>'
          if old in s: s=s.replace(old,new,1)
          elif 'class="school-name">SDN Muarasari 1</div>' not in s: raise SystemExit('Login heading not found')
          p.write_text(s,encoding='utf-8')
          print('Login cleaned and school name added')
          PY
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f .github/workflows/orientation-layout.yml deploy-trigger.txt 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "fix: clean login and show school name [skip ci]"; git push; fi
