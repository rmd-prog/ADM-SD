name: Fix AI BAB final
on:
  push:
    branches:
      - main
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="function aiBookLock(m,k,bab){const b=bookInfo(m,k);if(!b)return{title:'Belum terdaftar',source:'SIBI',chapters:[]};const chapters=Array.isArray(b.chapters)?b.chapters.slice():[];return{title:b.title,source:b.source,year:b.year||'',chapters,bab:bab&&chapters.includes(bab)?bab:''};}"
          new="function normalizeBabName(v){const s=String(v??'').trim();return s.replace(/^BAB\\s*\\d+\\s*[—-]\\s*/i,'').trim();}\nfunction aiBookLock(m,k,bab){const b=bookInfo(m,k);if(!b)return{title:'Belum terdaftar',source:'SIBI',chapters:[]};const chapters=Array.isArray(b.chapters)?b.chapters.slice():[];const raw=normalizeBabName(bab);const wanted=/^\\d+$/.test(raw)&&chapters[Number(raw)]?chapters[Number(raw)]:raw;return{title:b.title,source:b.source,year:b.year||'',chapters,bab:wanted&&chapters.includes(wanted)?wanted:''};}"
          if old not in s: raise SystemExit('LOCK TARGET NOT FOUND')
          s=s.replace(old,new,1)
          old="context:[ctx,aiBookInstruction(m,k,type==='rpm'?id('rpmBab').value:'')].filter(Boolean).join('\\n\\n'),existing:tx.value,bookReference:aiBookLock(m,k,type==='rpm'?id('rpmBab').value:''),bookLock:true"
          new="context:[ctx,aiBookInstruction(m,k,type==='rpm'?(babList(m,k)[Number(id('rpmBab').value||0)]||''):'')].filter(Boolean).join('\\n\\n'),existing:tx.value,bookReference:aiBookLock(m,k,type==='rpm'?(babList(m,k)[Number(id('rpmBab').value||0)]||''):''),bookLock:true"
          if old not in s: raise SystemExit('RPM TARGET NOT FOUND')
          s=s.replace(old,new,1)
          old="if(t==='rpm')extra.bab=bab.options[bab.selectedIndex]?.textContent||'';"
          new="if(t==='rpm')extra.bab=normalizeBabName(bab.options[bab.selectedIndex]?.textContent||'');"
          if old not in s: raise SystemExit('SUPER TARGET NOT FOUND')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          js='\n'.join(re.findall(r'<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>',s,re.I))
          Path('/tmp/index.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/index.js
      - name: Commit patch and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "fix: enforce selected book BAB in AI generators"
          git push
