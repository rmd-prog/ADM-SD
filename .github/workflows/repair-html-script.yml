name: repair html script parser

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ensure feature modules and login bridge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          marker="id('loginForm').onsubmit=async e=>{"
          if 'window.__ADM_LOGIN=async(username,password)' not in s and marker in s:
              s=s.replace(marker,"window.__ADM_LOGIN=async(username,password)=>{const t=await remoteLogin(username,password);await finishLogin(t);return t};"+marker,1)
          for tag in ('<script src="assets/absensi.js"></script>','<script src="guru-mapel-ui.js"></script>'):
              if tag not in s:
                  pos=s.rfind('</body>')
                  if pos<0: raise SystemExit('body marker missing')
                  s=s[:pos]+tag+'\n'+s[pos:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          assert '<script src="assets/absensi.js"></script>' in s
          assert '<script src="guru-mapel-ui.js"></script>' in s
          PY
          node --check /tmp/index-inline.js
          node --check src/index.js
          node --check assets/absensi.js
          node --check guru-mapel-ui.js
      - name: Commit patched index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No index patch needed'; exit 0; fi
          git commit -m 'fix: load attendance and Guru Mapel modules [skip ci]'
          git push
