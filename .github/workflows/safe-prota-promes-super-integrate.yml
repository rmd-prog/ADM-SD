name: Safe PROTA PROMES SUPER Integrate
on:
  push:
    branches: [feat-perangkat-pembelajaran-super-2026-09-10]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Safely load PROTA PROMES SUPER
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          tag='<script src="assets/perangkat-prota-promes-super-v1.js"></script>'
          if tag not in s:
              anchor='<script src="assets/perangkat-pembelajaran-super.js"></script>'
              if anchor not in s: raise SystemExit('anchor loader not found; refusing unsafe edit')
              s=s.replace(anchor,anchor+'\n'+tag,1);p.write_text(s,encoding='utf-8')
          if s.count(tag)!=1: raise SystemExit('invalid loader count')
          PY
      - name: Commit integration
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html && git commit -m 'ci: integrate PROTA PROMES SUPER loader' && git push