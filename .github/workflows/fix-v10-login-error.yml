name: Fix V10 login and scroll

on:
  push:
    paths:
      - '.github/workflows/fix-v10-login-error.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore known working V10 index and add CSS-only login lock
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          url = 'https://raw.githubusercontent.com/rmd-prog/ADM-SD/9221283d48e344d7ca5b5ba9852b5a97c64d025a/index.html'
          s = urlopen(url, timeout=30).read().decode('utf-8')
          marker = '</style>'
          css = '''\n/* V10 LOGIN LOCK — CSS ONLY, NO SCRIPT INJECTION */\nhtml,body{min-height:100%;overflow-x:hidden}\nbody.v10-login{overflow:hidden!important;height:100svh!important}\nbody.v10-login #loginScreen{position:fixed!important;inset:0!important;width:100%!important;height:100svh!important;min-height:100svh!important;overflow:hidden!important;box-sizing:border-box!important;padding:14px!important}\nbody.v10-login #loginScreen .login-card{max-height:calc(100svh - 28px)!important;overflow:auto!important}\nbody.v10-logged-in{overflow-x:hidden!important;overflow-y:auto!important;height:auto!important}\n'''
          if marker not in s:
              raise SystemExit('style marker not found')
          s = s.replace(marker, css + marker, 1)
          Path('index.html').write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: restore working V10 login and lock login scroll' || exit 0
          git push