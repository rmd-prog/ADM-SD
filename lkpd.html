per.letter{--pw:816px;--ph:1056px}.head{position:relative;border:2px solid var(--accent);border-radius:15px;padding:8px 10px;margin-bottom:5px;background:linear-gradient(135deg,var(--soft),#fff);display:grid;grid-template-columns:145px 1fr;gap:9px}.hero{width:145px;height:72px;border-radius:9px;overflow:hidden;background:#fff;border:1px solid #dbe4f0}.hero svg,.qimg svg,.opti svg{width:100%;height:100%;display:block}.badge{display:inline-block;background:var(--accent);color:#fff;padding:3px 7px;border-radius:99px;font-size:7px;font-weight:900}.title{font-size:18px;font-weight:900;margin:3px 0}.sub{font-size:8px;color:#475569}.identity{grid-column:1/-1;display:grid;grid-template-columns:1.5fr .8fr .8fr;gap:6px}.id{border-bottom:1px solid #64748b;font-size:8px;padding:3px}.instructions{position:relative;margin:4px 0;padding:5px 7px;border-left:4px solid var(--accent);background:var(--soft);font-size:7.5px;border-radius:6px}.questions{position:relative;display:grid;gap:4px 5px;align-content:start}.q{border:1px solid #dbe4f0;border-radius:6px;padding:4px 5px;background:#fff;overflow:hidden;break-inside:avoid}.q.visual{background:linear-gradient(135deg,#fff,var(--soft))}.qnum{font-size:7.8px;font-weight:900}.tag{float:right;background:var(--accent);color:#fff;border-radius:99px;padding:1px 4px;font-size:5px}.qt{font-size:7.2px;line-height:1.18;margin:2px 0}.qimg{height:42px;margin:2px 0 3px;border:1px solid #e2e8f0;border-radius:5px;overflow:hidden;background:#f8fafc}.opts{display:grid;grid-template-columns:1fr 1fr;gap:2px}.opt{font-size:6.2px;min-height:25px;padding:2px;border:1px solid #e2e8f0;border-radius:4px;display:flex;gap:3px;align-items:center;background:#fff}.opti{width:24px;height:24px;flex:none;border-radius:3px;overflow:hidden}.line{height:15px;border-bottom:1px solid #64748b}.essay{height:30px;margin-top:2px;background:repeating-linear-gradient(to bottom,transparent 0 8px,#94a3b8 9px 10px)}.fit-25 .qt{font-size:6.7px}.fit-25 .qimg{height:34px}.fit-25 .opt{font-size:5.8px;min-height:21px}.fit-25 .opti{width:19px;height:19px}.fit-30 .q{padding:3px 4px}.fit-30 .qt{font-size:6.2px;line-height:1.1}.fit-30 .qimg{height:27px}.fit-30 .opt{font-size:5.3px;min-height:18px;padding:1px}.fit-30 .opti{width:16px;height:16px}.fit-30 .line{height:11px}.fit-30 .essay{height:22px}.foot{position:absolute;bottom:7px;left:18px;right:18px;border-top:1px dashed #cbd5e1;padding-top:3px;display:flex;justify-content:space-between;font-size:6.5px;color:#64748b}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.paper{margin-left:0}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:10px}}@media print{body{background:#fff}.top,.controls{display:none}.stage{padding:0;border:0;box-shadow:none;overflow:visible}.paper{border:0;margin:0}.q{break-inside:avoid}}

<body><div class="wrap">
<div class="top card"><h1>🎨 LKPD Visual AI</h1><p>Visual sesuai materi & pertanyaan • PG + Isian + Essay • 1 lembar • A4 / F4 / Letter</p></div>
<div class="controls card"><div class="grid">
<div class="field"><label>Kelas</label><select id="kelas"><option value="1">Kelas 1</option><option value="2">Kelas 2</option><option value="3">Kelas 3</option><option value="4" selected>Kelas 4</option><option value="5">Kelas 5</option><option value="6">Kelas 6</option></select></div>
<div class="field"><label>Mapel</label><select id="mapel"></select></div>
<div class="field"><label>Bab</label><select id="bab" disabled></select></div>
<div class="field"><label>Subbab</label><select id="subbab" disabled></select></div>
<div class="field"><label>Ukuran kertas</label><select id="kertas"><option value="a4">A4 — 21 × 29,7 cm</option><option value="f4" selected>F4 / Folio — 8,5 × 13 inci</option><option value="letter">Letter — 8,5 × 11 inci</option></select></div>
<div class="field"><label>Jumlah soal</label><select id="jumlah"><option>10</option><option>15</option><option selected>20</option><option>25</option><option>30</option></select></div>
<div class="field"><label>Komposisi</label><select id="komposisi"><option value="campur">Campuran PG + Isian + Essay</option><option value="pg">PG dominan</option><option value="isian">Isian dominan</option><option value="essay">Essay dominan</option></select></div>
<div class="field"><label>Gaya</label><select id="gaya"><option value="ceria">Ceria</option><option value="alam">Alam</option><option value="minimal">Minimal</option><option value="warna">Warna-warni</option></select></div>
<div class="field full"><label>Permintaan tambahan (opsional)</label><textarea id="materi" rows="2" placeholder="Contoh: buat soal kontekstual tentang lingkungan sekolah, beberapa soal memakai gambar yang berbeda dan benar-benar sesuai pertanyaan."></textarea></div>
</div><div class="actions"><button class="btn primary" id="generate">✨ Generate LKPD</button><button class="btn secondary" id="sample">Contoh cepat</button><button class="btn success" id="png">🖼️ Simpan PNG</button><button class="btn secondary" onclick="window.print()">🖨️ Cetak</button></div><div id="status" class="status"></div></div>
<div class="stage card"><div id="paper" class="paper f4"><div style="height:100%;display:grid;place-items:center;color:#94a3b8;text-align:center"><div>🧩<br><b>LKPD akan muncul di sini</b><br><small>Pilih kelas, mapel, bab, subbab lalu Generate.</small></div></div></div></div></div>
<script>
const API_BASE=localStorage.getItem('siApiBase')||'https://adm-sd.adm-sd.workers.dev/api',$=id=>document.getElementById(id);
const themes={ceria:['#2563eb','#eff6ff'],alam:['#15803d','#dcfce7'],minimal:['#334155','#f1f5f9'],warna:['#db2777','#fce7f3']};
const curriculum={
"Bahasa Indonesia":{1:{"Bab 1 — Aku dan Teman Baru":["Menyimak dan berbicara","Membaca kata sederhana","Menulis huruf dan kata"],"Bab 2 — Tubuhku Sehat":["Anggota tubuh","Kata dan kalimat sederhana","Menulis pengalaman"]},2:{"Bab 1 — Bermain di Lingkunganku":["Kosakata kegiatan","Kalimat sederhana","Membaca teks pendek"],"Bab 2 — Hidup Bersih dan Sehat":["Kosakata kebersihan","Teks petunjuk","Menulis kalimat"]},3:{"Bab 1 — Pertumbuhan dan Perkembangan":["Ide pokok","Kosakata baru","Meringkas teks"],"Bab 2 — Menyayangi Tumbuhan dan Hewan":["Informasi dalam teks","Kalimat saran","Menulis paragraf"]},4:{"Bab 1 — Sudut Pandang dan Cerita":["Tokoh dan watak","Alur cerita","Menentukan informasi"],"Bab 2 — Teks Informasi":["Ide pokok","Kalimat utama","Meringkas informasi"]},5:{"Bab 1 — Membaca dan Memahami":["Ide pokok dan pendukung","Kosakata","Menyimpulkan teks"],"Bab 2 — Menulis Teks":["Kalimat efektif","Paragraf","Teks informatif"]},6:{"Bab 1 — Teks Eksplanasi":["Informasi penting","Struktur teks","Menyusun ringkasan"],"Bab 2 — Teks Pidato":["Tujuan pidato","Struktur pidato","Menyampaikan pidato"]}},
"Matematika":{1:{"Bab 1 — Bilangan sampai 20":["Membilang","Membandingkan bilangan","Penjumlahan dan pengurangan"],"Bab 2 — Bentuk dan Pola":["Bangun datar","Pola sederhana","Mengelompokkan bentuk"]},2:{"Bab 1 — Bilangan sampai 100":["Nilai tempat","Penjumlahan","Pengurangan"],"Bab 2 — Pengukuran":["Panjang","Berat","Waktu"]},3:{"Bab 1 — Bilangan":["Nilai tempat","Operasi hitung","Pecahan sederhana"],"Bab 2 — Bangun Datar":["Sifat bangun","Keliling","Luas sederhana"]},4:{"Bab 1 — Pecahan":["Pecahan senilai","Penjumlahan pecahan","Pengurangan pecahan"],"Bab 2 — Bangun Datar":["Keliling","Luas","Sifat bangun"]},5:{"Bab 1 — Pecahan dan Desimal":["Operasi pecahan","Desimal","Persen"],"Bab 2 — Geometri":["Bangun datar","Volume","Sudut"]},6:{"Bab 1 — Operasi Bilangan":["Bilangan bulat","Pecahan","Perbandingan"],"Bab 2 — Bangun Ruang":["Volume","Luas permukaan","Jaring-jaring"]}},
"IPAS":{1:{"Bab 1 — Aku dan Lingkunganku":["Anggota tubuh","Pancaindra","Lingkungan sekitar"],"Bab 2 — Makhluk Hidup":["Hewan","Tumbuhan","Kebutuhan makhluk hidup"]},2:{"Bab 1 — Tubuh dan Kesehatan":["Bagian tubuh","Pancaindra","Hidup sehat"],"Bab 2 — Lingkungan":["Makhluk hidup","Benda di sekitar","Menjaga lingkungan"]},3:{"Bab 1 — Makhluk Hidup":["Ciri makhluk hidup","Tumbuhan","Hewan"],"Bab 2 — Energi":["Sumber energi","Perubahan energi","Hemat energi"]},4:{"Bab 1 — Tumbuhan dan Fotosintesis":["Bagian tumbuhan","Fungsi bagian tumbuhan","Fotosintesis"],"Bab 2 — Wujud Zat":["Padat, cair, gas","Perubahan wujud","Sifat zat"],"Bab 3 — Gaya dan Gerak":["Macam gaya","Pengaruh gaya","Gerak benda"],"Bab 4 — Ekosistem":["Komponen biotik dan abiotik","Rantai makanan","Jaring-jaring makanan"]},5:{"Bab 1 — Ekosistem":["Komponen ekosistem","Rantai makanan","Keseimbangan ekosistem"],"Bab 2 — Siklus Air":["Penguapan","Kondensasi","Presipitasi"],"Bab 3 — Cahaya dan Bunyi":["Sifat cahaya","Pemantulan","Sumber bunyi"]},6:{"Bab 1 — Tata Surya":["Matahari","Planet","Gerak benda langit"],"Bab 2 — Energi dan Perubahannya":["Sumber energi","Perubahan energi","Energi listrik"],"Bab 3 — Lingkungan":["Keseimbangan lingkungan","Perubahan lingkungan","Pelestarian"]}},
"Pendidikan Pancasila":{1:{"Bab 1 — Aku Anak Pancasila":["Simbol Pancasila","Aturan sederhana","Sikap baik"]},2:{"Bab 1 — Hidup Bersama":["Kerja sama","Aturan","Keberagaman"]},3:{"Bab 1 — Aku dan Lingkungan":["Hak dan kewajiban","Gotong royong","Aturan bersama"]},4:{"Bab 1 — Pancasila":["Makna sila","Contoh perilaku","Penerapan nilai"],"Bab 2 — Keberagaman":["Keragaman budaya","Menghargai perbedaan","Persatuan"]},5:{"Bab 1 — Nilai Pancasila":["Nilai setiap sila","Musyawarah","Gotong royong"]},6:{"Bab 1 — Persatuan Indonesia":["Keberagaman","Persatuan","Tanggung jawab"]}},
"Seni dan Budaya":{1:{"Bab 1 — Garis dan Bentuk":["Garis","Bentuk","Warna"]},2:{"Bab 1 — Pola dan Warna":["Pola","Warna","Karya sederhana"]},3:{"Bab 1 — Menggambar":["Garis","Bentuk","Komposisi"]},4:{"Bab 1 — Seni Rupa":["Unsur seni rupa","Warna","Karya dua dimensi"]},5:{"Bab 1 — Karya Seni":["Teknik menggambar","Motif","Karya dekoratif"]},6:{"Bab 1 — Apresiasi Seni":["Unsur seni","Karya daerah","Apresiasi"]}},
"PJOK":{1:{"Bab 1 — Gerak Dasar":["Berjalan","Berlari","Melompat"]},2:{"Bab 1 — Kebugaran":["Gerak dasar","Keseimbangan","Kelenturan"]},3:{"Bab 1 — Permainan":["Gerak lokomotor","Gerak nonlokomotor","Permainan sederhana"]},4:{"Bab 1 — Permainan Bola":["Menendang","Melempar","Menangkap"]},5:{"Bab 1 — Kebugaran Jasmani":["Kekuatan","Kelenturan","Daya tahan"]},6:{"Bab 1 — Permainan dan Kesehatan":["Permainan bola","Kebugaran","Pola hidup sehat"]}}
};
const mapels=Object.keys(curriculum);
function esc(s){return String(s??'').replace(/[&<>\\\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}
function cn(v){return v}
function phase(k){return k<=2?'A':k<=4?'B':'C'}
function fill(sel,items,placeholder){sel.innerHTML=`<option value="">${placeholder}</option>`+(items||[]).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');sel.disabled=!(items&&items.length)}
function refreshMapel(){fill($('mapel'),mapels,'Pilih mata pelajaran');$('mapel').value='IPAS';refreshBab()}
function refreshBab(){const k=+$('kelas').value,m=$('mapel').value,data=curriculum[m]?.[k]||{};fill($('bab'),Object.keys(data),'Pilih bab');$('bab').value=Object.keys(data)[0]||'';refreshSubbab()}
function refreshSubbab(){const k=+$('kelas').value,m=$('mapel').value,b=$('bab').value,data=curriculum[m]?.[k]?.[b]||[];fill($('subbab'),data,'Pilih subbab');$('subbab').value=data[0]||''}
$('kelas').onchange=refreshBab;$('mapel').onchange=refreshBab;$('bab').onchange=refreshSubbab;
function paperSize(){const p=$('kertas').value,el=$('paper');el.className='paper '+p;const sizes={a4:[210,297],f4:[215.9,330.2],letter:[215.9,279.4]};const [w,h]=sizes[p];let st=document.getElementById('page-size-style');if(!st){st=document.createElement('style');st.id='page-size-style';document.head.appendChild(st)}st.textContent=`@page{size:${w}mm ${h}mm;margin:0}`}
$('kertas').onchange=paperSize;
function comp(n){const c=$('komposisi').value;if(c==='pg')return[Math.ceil(n*.6),Math.floor(n*.25),n-Math.ceil(n*.6)-Math.floor(n*.25)];if(c==='isian')return[Math.floor(n*.25),Math.ceil(n*.5),n-Math.floor(n*.25)-Math.ceil(n*.5)];if(c==='essay')return[Math.floor(n*.25),Math.floor(n*.25),n-Math.floor(n*.25)-Math.floor(n*.25)];return[Math.round(n*.5),Math.round(n*.25),n-Math.round(n*.5)-Math.round(n*.25)]}
function hash(s){let h=0;for(let i=0;i<String(s).length;i++)h=(h*31+String(s).charCodeAt(i))>>>0;return h}
function kind(s){s=String(s||'').toLowerCase();if(/ekosistem|biotik|abiotik|rantai makanan|jaring-jaring|habitat|sawah|kolam/.test(s))return'eco';if(/tumbuhan|daun|akar|batang|bunga|fotosint/.test(s))return'plant';if(/tata surya|planet|bulan|matahari|gerhana/.test(s))return'space';if(/pecahan|persegi|segitiga|bangun|sudut|geometri|keliling|luas|volume|desimal/.test(s))return'math';if(/air|siklus air|hujan|sungai|laut|penguapan|kondensasi/.test(s))return'water';if(/hewan|ikan|burung|serangga|mamalia|katak|kupu/.test(s))return'animal';if(/peta|provinsi|indonesia|pulau/.test(s))return'map';if(/cuaca|awan|angin|musim/.test(s))return'weather';if(/pancasila|gotong royong|musyawarah|keberagaman/.test(s))return'civic';if(/lari|lompat|menendang|melempar|menangkap|kebugaran/.test(s))return'sport';return'edu'}
function svg(label,small=false){const k=kind(label),v=hash(label)%5, bg='<rect width="300" height="120" rx="8" fill="#f8fafc"/>';if(k==='eco')return`<svg viewBox="0 0 300 120">${bg}<circle cx="250" cy="24" r="15" fill="#facc15"/><path d="M0 88Q70 65 145 88T300 80V120H0Z" fill="#86efac"/><rect x="43" y="48" width="9" height="48" fill="#92400e"/><circle cx="48" cy="39" r="27" fill="#22c55e"/><path d="M92 94q15-27 30 0M126 94q15-22 30 0" fill="#60a5fa"/><circle cx="107" cy="80" r="5" fill="#0ea5e9"/><path d="M205 45q14-12 28 0" stroke="#334155" fill="none" stroke-width="3"/></svg>`;if(k==='plant')return`<svg viewBox="0 0 300 120">${bg}<path d="M150 104V46" stroke="#15803d" stroke-width="7"/><path d="M150 68Q105 ${38-v*2} 86 61Q118 84 150 70M150 58Q190 ${28+v*2} 214 51Q180 73 150 63" fill="#22c55e"/><circle cx="150" cy="36" r="14" fill="#f472b6"/><path d="M113 104Q150 87 187 104" stroke="#92400e" stroke-width="5" fill="none"/></svg>`;if(k==='space')return`<svg viewBox="0 0 300 120" style="background:#0f172a">${'<rect width="300" height="120" fill="#0f172a"/>'}<circle cx="150" cy="60" r="27" fill="#facc15"/><circle cx="70" cy="38" r="${8+v}" fill="#60a5fa"/><circle cx="230" cy="82" r="${12+v}" fill="#fb7185"/><circle cx="45" cy="90" r="4" fill="#fff"/><circle cx="265" cy="25" r="3" fill="#fff"/></svg>`;if(k==='math')return`<svg viewBox="0 0 300 120">${bg}<path d="M80 24h120v72H80z" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/><path d="M80 60h120M140 24v72" stroke="#2563eb" stroke-width="3"/><circle cx="105" cy="42" r="6" fill="#f97316"/><circle cx="170" cy="78" r="6" fill="#22c55e"/><text x="212" y="63" font-size="25" fill="#334155">${v+1}/${5}</text></svg>`;if(k==='water')return`<svg viewBox="0 0 300 120">${bg}<circle cx="245" cy="25" r="16" fill="#facc15"/><path d="M0 70Q55 45 110 70T220 70T330 65V120H0Z" fill="#60a5fa"/><path d="M75 40Q88 ${18+v} 101 40M125 38Q138 ${16+v} 151 38" stroke="#94a3b8" stroke-width="4" fill="none"/><path d="M170 20v25" stroke="#0ea5e9" stroke-width="3"/></svg>`;if(k==='animal')return`<svg viewBox="0 0 300 120">${bg}<ellipse cx="155" cy="68" rx="48" ry="27" fill="${v%2?'#60a5fa':'#f59e0b'}"/><circle cx="115" cy="55" r="20" fill="#fbbf24"/><path d="M105 42l-10-17 18 10M122 38l10-17 2 22" fill="#f59e0b"/><circle cx="110" cy="54" r="3"/><circle cx="120" cy="54" r="3"/><path d="M202 70q25 10 35-5" stroke="#92400e" stroke-width="5" fill="none"/></svg>`;if(k==='map')return`<svg viewBox="0 0 300 120">${bg}<path d="M40 24l65 16 70-20 78 24-8 55-70-18-70 20-67-17z" fill="#bbf7d0" stroke="#15803d" stroke-width="3"/><circle cx="${115+v*14}" cy="${50+v*5}" r="8" fill="#ef4444"/><text x="135" y="110" font-size="12" fill="#334155">Peta Indonesia</text></svg>`;if(k==='weather')return`<svg viewBox="0 0 300 120">${bg}<circle cx="90" cy="40" r="22" fill="#facc15"/><path d="M120 78h85a22 22 0 0 0 0-44 30 30 0 0 0-55 10 20 20 0 0 0-30 34z" fill="#cbd5e1"/><path d="M145 88l-5 18M175 88l-5 18M205 88l-5 18" stroke="#60a5fa" stroke-width="4"/></svg>`;if(k==='civic')return`<svg viewBox="0 0 300 120">${bg}<circle cx="105" cy="60" r="34" fill="#ef4444"/><path d="M105 27l10 20h23l-18 14 7 22-22-13-22 13 7-22-18-14h23z" fill="#fff"/><circle cx="205" cy="60" r="34" fill="#fff" stroke="#2563eb" stroke-width="5"/><path d="M185 60h40M205 40v40" stroke="#2563eb" stroke-width="5"/></svg>`;if(k==='sport')return`<svg viewBox="0 0 300 120">${bg}<circle cx="150" cy="55" r="25" fill="#fff" stroke="#334155" stroke-width="3"/><path d="M130 48l20-12 20 12-8 24h-24z" fill="none" stroke="#334155" stroke-width="3"/><path d="M120 95l20-25M180 95l-20-25" stroke="#2563eb" stroke-width="6"/></svg>`;return`<svg viewBox="0 0 300 120">${bg}<circle cx="150" cy="50" r="28" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><path d="M135 48h30M140 60h20" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><text x="100" y="103" font-size="13" fill="#475569">Belajar bersama</text></svg>`}
function visualFor(q){return svg((q.visual_description||q.question||'')+' '+(q.visual_type||''))}
function parse(raw){if(typeof raw!=='string')return raw;let a=raw.indexOf('{'),b=raw.lastIndexOf('}');if(a>=0&&b>a)try{return JSON.parse(raw.slice(a,b+1))}catch{}return null}
function norm(d){if(!d||!Array.isArray(d.questions))return{title:'LKPD '+$('mapel').value,questions:[]};return{title:d.title||`LKPD ${$('mapel').value}`,questions:d.questions.map(q=>({type:String(q.type||q.jenis||'pilihan_ganda').toLowerCase().replace('pilihan ganda','pilihan_ganda'),question:q.question||q.pertanyaan||'',options:Array.isArray(q.options)?q.options.map(o=>typeof o==='string'?o:o.text||''):[],visual:!!(q.visual||q.gambar||q.image),visual_type:q.visual_type||q.tipe_gambar||'',visual_description:q.visual_description||q.deskripsi_gambar||''}))}}
async function ask(token,count,start){const n=+$('jumlah').value,[pg,is,es]=comp(n),k=+$('kelas').value,m=$('mapel').value,b=$('bab').value,s=$('subbab').value,extra=$('materi').value.trim();const context=`Buat TEPAT ${count} soal LKPD SD bagian ${start+1}-${start+count}. Kelas ${k}, fase ${phase(k)}, mapel ${m}, Bab ${b}, Subbab ${s}. Permintaan tambahan: ${extra||'tidak ada'}. Komposisi total: ${pg} pilihan_ganda, ${is} isian, ${es} essay. JSON valid tanpa markdown: {"title":"judul LKPD","questions":[{"type":"pilihan_ganda|isian|essay","question":"pertanyaan","options":["teks opsi A","teks opsi B","teks opsi C","teks opsi D"],"visual":true,"visual_type":"eco|plant|animal|space|water|math|map|weather|civic|sport|edu","visual_description":"deskripsi visual yang sangat spesifik dan benar-benar menjawab/menjelaskan pertanyaan"}]}. Isian/essay options=[]. Gunakan visual pada soal yang memang terbantu gambar; visual harus berbeda-beda, spesifik terhadap pertanyaan, bukan satu gambar untuk semua soal. Untuk PG, buat opsi yang jelas dan tidak ambigu. Jangan mengulang soal. Tepat ${count} questions.`;const r=await fetch(API_BASE+'/ai/generate',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({jenis:'lkpd',rombel:String(k),mapel:m,fase:'Fase '+phase(k),tahun:'2026/2027',context,tujuan:`LKPD visual satu lembar ${$('kertas').value.toUpperCase()}`,durasi:'40 menit',aktivitas:'campuran PG isian essay dengan visual relevan',jumlahSoal:count,bentukSoal:'Campuran'})});const p=await r.json();if(!r.ok||!p.ok)throw Error(p.message||'AI gagal');return norm(parse(p.text))}
function render(d){const n=+$('jumlah').value,[ac,soft]=themes[$('gaya').value];document.documentElement.style.setProperty('--accent',ac);document.documentElement.style.setProperty('--soft',soft);paperSize();const qs=d.questions.slice(0,n),cols=n>=21?3:2,fit=n>=30?'fit-30':n>=25?'fit-25':'';$('paper').className=`paper ${$('kertas').value} ${fit}`;let html=`<div class="head"><div class="hero">${visualFor({question:$('subbab').value,visual_description:$('bab').value+' '+$('subbab').value})}</div><div><span class="badge">LKPD • KURIKULUM MERDEKA</span><div class="title">${esc(d.title)}</div><div class="sub">${esc($('mapel').value)} • Kelas ${cn($('kelas').value)} • ${esc($('bab').value)} • ${esc($('subbab').value)}</div></div><div class="identity"><div class="id">Nama: _______________________</div><div class="id">Kelas: ______</div><div class="id">Tanggal: ______</div></div></div><div class="instructions"><b>Petunjuk:</b> PG pilih satu jawaban; isian tulis jawaban singkat; essay jawab jelas.</div><div class="questions" style="grid-template-columns:repeat(${cols},1fr)">`;qs.forEach((q,i)=>{let t=q.type==='essay'?'ESSAY':q.type==='isian'?'ISIAN':'PG',has=q.visual&&q.visual_description;html+=`<div class="q ${has?'visual':''}"><div class="qnum">${i+1}. <span class="tag">${t}</span></div><div class="qt">${esc(q.question)}</div>${has?`<div class="qimg">${visualFor(q)}</div>`:''}`;if(t==='PG')html+=`<div class="opts">${q.options.slice(0,4).map((o,j)=>`<div class="opt"><b>${String.fromCharCode(65+j)}.</b><div class="opti">${svg(o,true)}</div><span>${esc(o)}</span></div>`).join('')}</div>`;else if(t==='ISIAN')html+='<div class="line"></div>';else html+='<div class="essay"></div>';html+='</div>'});html+=`</div><div class="foot"><span>Kerjakan dengan jujur • Semangat belajar!</span><span>${qs.length} soal • 1 lembar ${$('kertas').value.toUpperCase()}</span></div>`;$('paper').innerHTML=html}
function status(t,loading=false){$('status').innerHTML=(loading?'<span class="loader"></span>':'')+`<span>${esc(t)}</span>`;$('status').classList.add('show')}
async function generate(){const token=localStorage.getItem('siAuthToken');if(!token)return status('❌ Sesi login ADM-SD tidak ditemukan. Login dulu di aplikasi utama.');if(!$('mapel').value||!$('bab').value||!$('subbab').value)return status('⚠️ Pilih mapel, bab, dan subbab terlebih dahulu.');const n=+$('jumlah').value;$('generate').disabled=true;$('generate').innerHTML='⏳ Sedang Generate...';let timer;try{const msgs=['🤖 Menyusun kisi-kisi dan soal...','🧠 Menyesuaikan soal dengan bab & subbab...','🎨 Menentukan visual berbeda untuk tiap soal...','📐 Menata layout satu lembar...'];let mi=0;status(msgs[mi],true);timer=setInterval(()=>{mi=(mi+1)%msgs.length;status(msgs[mi],true)},1800);let all=[],title='';for(let pass=0;pass<3&&all.length<n;pass++){let d=await ask(token,n-all.length,all.length);if(!title)title=d.title;for(const q of d.questions){if(q.question&&!all.some(x=>x.question.trim().toLowerCase()===q.question.trim().toLowerCase()))all.push(q);if(all.length>=n)break}}if(all.length!==n)throw Error(`AI baru menghasilkan ${all.length} dari ${n} soal. Coba Generate lagi.`);render({title,questions:all});status(`✅ Selesai! ${n} soal • ${$('kertas').value.toUpperCase()} • visual dibuat sesuai pertanyaan.`)}catch(e){status('❌ '+e.message)}finally{clearInterval(timer);$('generate').disabled=false;$('generate').innerHTML='✨ Generate LKPD'}}
$('generate').onclick=generate;$('sample').onclick=()=>{$('materi').value='Buat soal kontekstual. Gunakan gambar yang berbeda untuk soal yang memang membutuhkan visual, jangan gunakan gambar yang sama berulang.';generate()};$('png').onclick=async()=>{if(!window.html2canvas)return status('❌ Mesin PNG belum siap.');status('🖼️ Menyiapkan PNG...',true);try{const c=await html2canvas($('paper'),{scale:2,backgroundColor:'#fff',useCORS:true}),a=document.createElement('a');a.download=`LKPD-${$('mapel').value}-${$('kertas').value}-${Date.now()}.png`;a.href=c.toDataURL('image/png');a.click();status('✅ PNG berhasil dibuat.')}catch(e){status('❌ Gagal membuat PNG: '+e.message)}};
refreshMapel();paperSize();
</script></body></html>
