name: Safe JP SUPER Integrate
on:
  push:
    branches: [feat-perangkat-pembelajaran-super-2026-09-10]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-perangkat-pembelajaran-super-2026-09-10
          fetch-depth: 0
      - name: Safely add JP loader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          tag='<script src="assets/perangkat-jp-super-v1.js"></script>'
          if tag not in s:
              anchor='<script src="assets/perangkat-binding-super-v1.js"></script>'
              if anchor in s:
                  s=s.replace(anchor, anchor+'\n'+tag, 1)
              else:
                  pos=s.rfind('</body>')
                  if pos<0: raise SystemExit('NO_BODY')
                  s=s[:pos]+tag+'\n'+s[pos:]
              p.write_text(s,encoding='utf-8')
          if s.count(tag)!=1: raise SystemExit('JP_LOADER_COUNT_INVALID')
          print('JP loader OK')
          PY
      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ci: integrate JP allocation SUPER loader'
          git push origin HEAD:feat-perangkat-pembelajaran-super-2026-09-10