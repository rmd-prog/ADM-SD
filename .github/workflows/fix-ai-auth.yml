name: Fix AI auth await

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix async AI user lookup
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/index.js')
          s = p.read_text()
          old = 'const user = getUser(request);'
          new = 'const user = await getUser(request, env);'
          if old in s:
              p.write_text(s.replace(old, new, 1))
          PY
          if git diff --quiet -- src/index.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.js
          git commit -m 'fix: await AI user authentication'
          git push
