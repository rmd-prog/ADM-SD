# trigger-login-v15
name: Login Performance V15
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimize login transition
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Remove expensive blur from the welcome backdrop on mobile.
          s=s.replace('backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;visibility:hidden;', 'backdrop-filter:none;-webkit-backdrop-filter:none;opacity:0;visibility:hidden;')
          s=s.replace('setTimeout(()=>showWelcome(t),220);', 'setTimeout(()=>showWelcome(t),60);')
          # Keep the dashboard transition instant; defer heavier rendering until after the first paint.
          old=r'''  applyClassLock();syncRoleMenu();initAIGenerator();renderBookBasisStatus();renderStats();renderStudents();renderScores();renderReport();showPage((t.role==='guru'||t.role==='guru_mapel')?'students':'dashboard');
  // Sinkronisasi D1 berjalan di belakang layar agar login tidak tertahan.
  syncRemoteData(t).catch(err=>console.warn('Sinkronisasi D1 gagal:',err));'''
          new=r'''  applyClassLock();syncRoleMenu();
  const firstPage=(t.role==='guru'||t.role==='guru_mapel')?'students':'dashboard';
  showPage(firstPage);
  // First paint dulu. Modul berat dan sinkronisasi D1 berjalan setelah UI sudah tampil.
  const defer=window.requestAnimationFrame||((fn)=>setTimeout(fn,0));
  defer(()=>setTimeout(()=>{
    try{initAIGenerator();renderBookBasisStatus();renderStats();renderStudents();renderScores();renderReport();}catch(err){console.warn('Init dashboard tertunda:',err)}
    syncRemoteData(t).catch(err=>console.warn('Sinkronisasi D1 gagal:',err));
  },0));'''
          if old in s:
              s=s.replace(old,new,1)
          elif 'const firstPage=(t.role' not in s:
              raise SystemExit('finishLogin anchor not found')
          p.write_text(s,encoding='utf-8')
      - name: Commit and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if ! git diff --cached --quiet; then git commit -m 'Percepat transisi login GURU+ SD V15'; git push; fi
          rm -f .github/workflows/performance-login-v15.yml
          git add .github/workflows/performance-login-v15.yml
          if ! git diff --cached --quiet; then git commit -m 'Remove one-time login performance workflow'; git push; fi
