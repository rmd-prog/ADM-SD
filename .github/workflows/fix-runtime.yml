name: Fix runtime guards

on:
  push:
    paths:
      - '.github/workflows/fix-runtime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""function renderBookBasisStatus(){\n  const el=id('bookBasisStatus'); if(!el)return;\n  const lines=[];\n  Object.keys(BOOK_CATALOG).forEach(m=>Object.keys(BOOK_CATALOG[m]).forEach(g=>{const b=BOOK_CATALOG[m][g];lines.push(`Kelas ${g} • ${m}: ${b.title} (${b.year}) • ${b.chapters.length} BAB`)}));\n  el.innerHTML='<b>Master buku yang sudah tertanam:</b><br>'+lines.map(escHtml).join('<br>')+'<br><small>Mapel/kelas lain menggunakan referensi SIBI dan dapat diperbarui saat buku sekolah ditentukan.</small>';\n}"""
          new="""function renderBookBasisStatus(){\n  const el=id('bookBasisStatus'); if(!el)return;\n  const lines=[];\n  Object.keys(BOOK_CATALOG||{}).forEach(m=>Object.keys(BOOK_CATALOG[m]||{}).forEach(g=>{const b=BOOK_CATALOG[m][g]||{};const chapters=Array.isArray(b.chapters)?b.chapters:[];lines.push(`Kelas ${g} • ${m}: ${b.title||'Buku belum terverifikasi'} (${b.year||'-'}) • ${chapters.length} BAB`)}));\n  el.innerHTML='<b>Master buku yang sudah tertanam:</b><br>'+lines.map(escHtml).join('<br>')+'<br><small>Mapel/kelas lain menggunakan referensi SIBI dan dapat diperbarui saat buku sekolah ditentukan.</small>';\n}"""
          if old not in s:
              raise SystemExit('target renderBookBasisStatus tidak ditemukan; file tidak diubah')
          s=s.replace(old,new,1)
          old2="""function docMeta(type){const map={cp:['CP','cpKelas','cpMapel','cpText','cpPreview','cpBadge','cpStatus'],tp:['TP','tpKelas','tpMapel','tpText','tpPreview','tpBadge','tpStatus'],atp:['ATP','atpKelas','atpMapel','atpText','atpPreview','atpBadge','atpStatus'],prota:['Prota','protaKelas','protaMapel','protaText','protaPreview','protaBadge','protaStatus'],prosem:['Prosem','prosemKelas','prosemMapel','prosemText','prosemPreview','prosemBadge','prosemStatus']};return map[type]}"""
          new2="""function docMeta(type){const map={cp:['CP','cpKelas','cpMapel','cpText','cpPreview','cpBadge','cpStatus'],tp:['TP','tpKelas','tpMapel','tpText','tpPreview','tpBadge','tpStatus'],atp:['ATP','atpKelas','atpMapel','atpText','atpPreview','atpBadge','atpStatus'],prota:['Prota','protaKelas','protaMapel','protaText','protaPreview','protaBadge','protaStatus'],prosem:['Prosem','prosemKelas','prosemMapel','prosemText','prosemPreview','prosemBadge','prosemStatus'],rpm:['RPM','rpmKelas','rpmMapel','rpmText','rpmPreview','rpmBadge','rpmStatus']};return map[type]}"""
          if old2 not in s:
              raise SystemExit('target docMeta tidak ditemukan; file tidak diubah')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: prevent undefined chapters length error'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/fix-runtime.yml || true
          git commit -m 'chore: remove temporary runtime patch workflow' || true
          git push || true
