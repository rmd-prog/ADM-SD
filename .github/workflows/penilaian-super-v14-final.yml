name: Apply Penilaian SUPER V14 final

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Penilaian SUPER V14
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          js=r'''<script id="penilaian-super-v14">
          /* ===== PENILAIAN SUPER V14 ===== */
          (function(){
            const E=s=>document.getElementById(s);
            const students=k=>(db.students||[]).filter(s=>normalizeRombel(s.rombel||s.kelas)===normalizeRombel(k));
            const vals=(nis,mapel,k)=>Object.entries(db.scores||{}).filter(([key,v])=>{const a=key.split('|');return a[0]===String(nis)&&a[1]===mapel&&normalizeRombel(a[2])===normalizeRombel(k)&&Number.isFinite(Number(v.nilai))}).map(x=>Number(x[1].nilai));
            const setup=()=>{
              const base=E('scoreMapel')?.innerHTML||'';
              ['reportMapel','analysisMapel','remedialMapel','enrichMapel'].forEach(x=>{if(E(x))E(x).innerHTML=base});
              ['reportKelas','analysisKelas','remedialKelas','enrichKelas'].forEach(x=>{if(E(x))E(x).innerHTML=ROMBELS.map(r=>'<option value="'+esc(r)+'">Rombel '+esc(r)+'</option>').join('')});
              if(isGuruKelas())['reportKelas','analysisKelas','remedialKelas','enrichKelas'].forEach(x=>{if(E(x))E(x).value=allowedClass()});
              ['remedialBab','enrichBab'].forEach(x=>{if(E(x))E(x).innerHTML=E('scoreBab')?.innerHTML||''});
            };
            window.renderScores=function(){const k=isGuruKelas()?allowedClass():E('scoreKelas').value;E('scoreKelas').value=k;const ss=students(k),m=E('scoreMapel').value,b=E('scoreBab').value;E('scoreTable').innerHTML=ss.map((s,i)=>{const key=s.nis+'|'+m+'|'+k+'|'+b,v=(db.scores||{})[key]||{};return '<tr><td>'+(i+1)+'</td><td><b>'+esc(s.name)+'</b><div class="muted" style="font-size:12px">NIS '+esc(s.nis||'-')+'</div></td><td><input class="scoreInput" data-key="'+esc(key)+'" type="number" min="0" max="100" value="'+esc(v.nilai??'')+'" inputmode="numeric"></td><td><input class="noteInput" data-key="'+esc(key)+'" value="'+esc(v.catatan||'')+'" placeholder="Catatan"></td></tr>'}).join('')||'<tr><td colspan="4" class="muted">Belum ada siswa di kelas ini.</td></tr>'};
            window.renderReport=function(){const m=E('reportMapel')?.value||E('scoreMapel')?.value||'',k=isGuruKelas()?allowedClass():(E('reportKelas')?.value||ROMBELS[0]);if(E('reportKelas'))E('reportKelas').value=k;const ss=students(k);const rows=ss.map(s=>{const a=vals(s.nis,m,k),avg=a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;return{s,avg,count:a.length}});const t=rows.filter(x=>x.count&&x.avg>=75).length,n=rows.filter(x=>x.count&&x.avg<75).length;if(E('reportSummary'))E('reportSummary').innerHTML='<span class="badge">👥 '+rows.length+' siswa</span><span class="badge">✅ Tuntas '+t+'</span><span class="badge">🔄 Perlu tindak lanjut '+n+'</span>';if(E('reportTable'))E('reportTable').innerHTML=rows.map((x,i)=>'<tr><td>'+(i+1)+'</td><td><b>'+esc(x.s.name)+'</b></td><td>'+x.count+' nilai</td><td><b>'+x.avg+'</b></td><td>'+(x.count?(x.avg>=75?'<span class="badge">Tuntas</span>':'<span class="badge">Perlu tindak lanjut</span>'):'<span class="muted">Belum dinilai</span>')+'</td></tr>').join('')||'<tr><td colspan="5" class="muted">Belum ada data.</td></tr>';if(E('reportStudent'))E('reportStudent').innerHTML='<option value="">Pilih siswa</option>'+rows.map(x=>'<option value="'+esc(x.s.nis)+'">'+esc(x.s.name)+'</option>').join('')};
            const studentDetail=()=>{const nis=E('reportStudent')?.value;if(!nis){if(E('reportResult'))E('reportResult').innerHTML='';return}const s=db.students.find(x=>String(x.nis)===String(nis)),rs=Object.entries(db.scores||{}).filter(([k,v])=>k.startsWith(nis+'|')&&Number.isFinite(Number(v.nilai))),a=rs.map(x=>Number(x[1].nilai)),avg=a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;E('reportResult').innerHTML='<div class="doc-box"><h4>'+esc(s?.name||'Siswa')+'</h4><p>Jumlah nilai: <b>'+a.length+'</b> · Rata-rata: <b>'+avg+'</b> · Status: <b>'+(a.length?(avg>=75?'Tuntas':'Perlu tindak lanjut'):'Belum dinilai')+'</b></p></div>'};
            window.renderAnalysis=function(){const m=E('analysisMapel')?.value||'',k=isGuruKelas()?allowedClass():(E('analysisKelas')?.value||ROMBELS[0]);if(E('analysisKelas'))E('analysisKelas').value=k;const map=new Map();Object.entries(db.scores||{}).forEach(([key,v])=>{const a=key.split('|'),n=Number(v.nilai);if(a[1]===m&&normalizeRombel(a[2])===normalizeRombel(k)&&Number.isFinite(n)){if(!map.has(a[3]))map.set(a[3],[]);map.get(a[3]).push(n)}});const all=[...map.values()].flat(),avg=all.length?Math.round(all.reduce((x,y)=>x+y,0)/all.length):0,pass=all.filter(n=>n>=75).length;if(E('analysisCards'))E('analysisCards').innerHTML='<div class="stat card"><span>Rata-rata</span><b>'+avg+'</b></div><div class="stat card"><span>Nilai tersimpan</span><b>'+all.length+'</b></div><div class="stat card"><span>Tuntas</span><b>'+pass+'</b></div><div class="stat card"><span>Belum</span><b>'+Math.max(0,all.length-pass)+'</b></div>';if(E('analysisTable'))E('analysisTable').innerHTML=[...map.entries()].map(([b,a])=>{const av=Math.round(a.reduce((x,y)=>x+y,0)/a.length),p=a.filter(n=>n>=75).length;return '<tr><td>'+esc(b)+'</td><td>'+a.length+'</td><td><b>'+av+'</b></td><td>'+p+'</td><td>'+Math.max(0,a.length-p)+'</td></tr>'}).join('')||'<tr><td colspan="5" class="muted">Belum ada nilai untuk dianalisis.</td></tr>';if(E('analysisNote'))E('analysisNote').textContent=all.length?'Batas ketuntasan tampilan: 75.':'Masukkan dan simpan nilai terlebih dahulu.'};
            const follow=kind=>{const mp=kind==='remedial'?'remedial':'enrich',m=E(mp+'Mapel')?.value||'',k=isGuruKelas()?allowedClass():(E(mp+'Kelas')?.value||ROMBELS[0]),b=E(kind==='remedial'?'remedialBab':'enrichBab')?.value||'',ss=students(k).map(s=>({s,n:Number((db.scores||{})[s.nis+'|'+m+'|'+k+'|'+b]?.nilai)})).filter(x=>Number.isFinite(x.n)&&(kind==='remedial'?x.n<75:x.n>=75));const table=E(kind==='remedial'?'remedialTable':'enrichTable');if(table)table.innerHTML=ss.map((x,i)=>'<tr><td>'+(i+1)+'</td><td><b>'+esc(x.s.name)+'</b></td><td><b>'+x.n+'</b></td><td>'+(kind==='remedial'?'Penguatan materi, latihan terarah, bimbingan, lalu asesmen ulang.':'Tantangan lanjutan, proyek mini, eksplorasi, atau soal HOTS sesuai materi.')+'</td></tr>').join('')||'<tr><td colspan="4" class="muted">Tidak ada siswa pada kategori ini.</td></tr>';if(E(kind==='remedial'?'remedialEmpty':'enrichEmpty'))E(kind==='remedial'?'remedialEmpty':'enrichEmpty').textContent=ss.length?(kind==='remedial'?ss.length+' siswa perlu remedial.':ss.length+' siswa dapat mengikuti pengayaan.'):'Belum ada siswa yang memenuhi kriteria.'};
            const bind=()=>{setup();['reportMapel','reportKelas'].forEach(x=>{if(E(x))E(x).onchange=renderReport});if(E('reportStudent'))E('reportStudent').onchange=studentDetail;['analysisMapel','analysisKelas'].forEach(x=>{if(E(x))E(x).onchange=renderAnalysis});['remedialMapel','remedialKelas','remedialBab'].forEach(x=>{if(E(x))E(x).onchange=()=>follow('remedial')});['enrichMapel','enrichKelas','enrichBab'].forEach(x=>{if(E(x))E(x).onchange=()=>follow('enrich')});renderReport();renderAnalysis();follow('remedial');follow('enrich')};
            setTimeout(bind,0);
          })();
          </script>'''
          if 'id="penilaian-super-v14"' not in s:
              s=s.replace('</head>',js+'\n</head>',1)
          sections='''<section id="analysis" class="page"><div class="doc-hero"><div class="doc-title-row"><div><div class="doc-kicker">PENILAIAN SUPER</div><div class="doc-title">📈 Analisis Hasil Penilaian</div><div class="doc-sub">Ketuntasan, rata-rata, dan BAB yang perlu mendapat perhatian.</div></div><div class="doc-actions"><button class="btn secondary" type="button" onclick="window.print()">🖨 Cetak</button></div></div></div><div class="card panel"><div class="doc-controls"><select id="analysisMapel"></select><select id="analysisKelas"></select></div><div id="analysisCards" class="grid" style="margin-top:14px"></div><div class="tablewrap" style="margin-top:14px"><table class="table"><thead><tr><th>BAB/Unit</th><th>Nilai</th><th>Rata-rata</th><th>Tuntas</th><th>Belum</th></tr></thead><tbody id="analysisTable"></tbody></table></div><div id="analysisNote" class="doc-note"></div></div></section>
          <section id="remedial" class="page"><div class="doc-hero"><div class="doc-title-row"><div><div class="doc-kicker">PENILAIAN SUPER</div><div class="doc-title">🔄 Remedial</div><div class="doc-sub">Siswa di bawah batas ketuntasan untuk tindak lanjut.</div></div></div></div><div class="card panel"><div class="doc-controls"><select id="remedialMapel"></select><select id="remedialKelas"></select></div><select id="remedialBab" style="margin-top:10px"></select><div class="tablewrap" style="margin-top:12px"><table class="table"><thead><tr><th>No</th><th>Nama Siswa</th><th>Nilai</th><th>Tindak Lanjut</th></tr></thead><tbody id="remedialTable"></tbody></table></div><div id="remedialEmpty" class="doc-note"></div></div></section>
          <section id="enrichment" class="page"><div class="doc-hero"><div class="doc-title-row"><div><div class="doc-kicker">PENILAIAN SUPER</div><div class="doc-title">🚀 Pengayaan</div><div class="doc-sub">Siswa tuntas untuk tantangan belajar lanjutan.</div></div></div></div><div class="card panel"><div class="doc-controls"><select id="enrichMapel"></select><select id="enrichKelas"></select></div><select id="enrichBab" style="margin-top:10px"></select><div class="tablewrap" style="margin-top:12px"><table class="table"><thead><tr><th>No</th><th>Nama Siswa</th><th>Nilai</th><th>Ide Pengayaan</th></tr></thead><tbody id="enrichTable"></tbody></table></div><div id="enrichEmpty" class="doc-note"></div></div></section>'''
          if 'id="analysis"' not in s:
              s=s.replace('<section id="teachers"',sections+'\n\n  <section id="teachers"',1)
          old='<section id="report" class="page"><h2>Rapor</h2><p class="muted">Rekap sederhana dari nilai yang tersimpan. Pilih siswa untuk melihat rata-rata.</p><div class="card panel"><select id="reportStudent"></select><div id="reportResult" style="margin-top:15px"></div></div></section>'
          new='''<section id="report" class="page"><div class="doc-hero"><div class="doc-title-row"><div><div class="doc-kicker">PENILAIAN SUPER</div><div class="doc-title">📊 Rekap Nilai & Rapor</div><div class="doc-sub">Rekap per rombel dan detail nilai siswa.</div></div><div class="doc-actions"><button class="btn secondary" type="button" onclick="window.print()">🖨 Cetak</button></div></div></div><div class="card panel"><div class="doc-controls"><select id="reportMapel"></select><select id="reportKelas"></select></div><div id="reportSummary" class="toolbar"></div><div class="tablewrap"><table class="table"><thead><tr><th>No</th><th>Nama Siswa</th><th>Jumlah Nilai</th><th>Rata-rata</th><th>Status</th></tr></thead><tbody id="reportTable"></tbody></table></div><hr style="margin:18px 0;border:0;border-top:1px solid #e2e8f0"><select id="reportStudent"></select><div id="reportResult" style="margin-top:15px"></div></div></section>'''
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node -e "const fs=require('fs');const s=fs.readFileSync('index.html','utf8');if(!s.includes('penilaian-super-v14'))process.exit(1);if(!s.includes('id=\"analysis\"'))process.exit(1);console.log('V14 markers OK')"
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Implement Penilaian SUPER V14'
          git push
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/penilaian-super-v14-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove one-time Penilaian V14 workflow'
          git push
