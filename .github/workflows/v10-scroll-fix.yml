name: V10 Scroll Fix
on:
  push:
    paths:
      - '.github/v10-scroll-trigger.txt'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch scroll behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''\n/* ===== V10 SCROLL FIX ===== */\nhtml,body{margin:0!important;padding:0!important;width:100%;min-height:100%;overflow-x:hidden!important}\nbody.v10-login{height:100svh!important;min-height:100svh!important;overflow:hidden!important;position:fixed!important;inset:0!important}\nbody.v10-login .login{height:100svh!important;min-height:100svh!important;overflow:hidden!important;padding:16px!important}\nbody.v10-login .login-card{max-height:calc(100svh - 32px);overflow:auto}\nbody.v10-logged-in{position:static!important;overflow-x:hidden!important;overflow-y:auto!important}\nbody.v10-logged-in .app{min-height:100svh!important}\nbody.v10-logged-in .layout{min-height:calc(100svh - 64px)!important}\nbody.v10-logged-in .main{min-height:calc(100svh - 64px)!important;overflow:visible!important}\n@media(max-width:850px){body.v10-logged-in .layout{min-height:calc(100svh - 60px)!important}.side.open{height:calc(100svh - 60px)!important;max-height:calc(100svh - 60px)!important}}\n'''
          if 'V10 SCROLL FIX' not in s:
              s=s.replace('</style>',css+'</style>',1)
          js='''\n<script>\n(function(){\n  function resetV10Scroll(){\n    if(document.body && document.body.classList.contains('v10-logged-in')){\n      window.scrollTo(0,0); document.documentElement.scrollTop=0; document.body.scrollTop=0;\n    }\n  }\n  document.addEventListener('DOMContentLoaded',resetV10Scroll);\n  document.addEventListener('click',function(e){\n    var b=e.target.closest && e.target.closest('#loginBtn,#logoutBtn');\n    if(b) setTimeout(resetV10Scroll,80);\n  },true);\n  window.addEventListener('pageshow',resetV10Scroll);\n})();\n</script>\n'''
          if 'V10 SCROLL RESET' not in s:
              js=js.replace('<script>','<script>/* V10 SCROLL RESET */',1)
              s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/v10-scroll-trigger.txt .github/workflows/v10-scroll-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/v10-scroll-trigger.txt .github/workflows/v10-scroll-fix.yml
          git commit -m 'fix: clean V10 login and dashboard scrolling' || exit 0
          git push
